<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viggo AI</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- SIDEBAR -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <button id="newChat" class="new-chat-btn">➕ New Chat</button>
                <button id="closeSidebar" class="close-sidebar-btn">✕</button>
            </div>
            <div class="sidebar-search">
                <input type="text" id="searchChat" placeholder="Search chats...">
            </div>
            <div id="chatHistory" class="chat-history"></div>
        </aside>

        <!-- MAIN CHAT AREA -->
        <main class="chat-main">
            <header class="chat-header">
                <button id="openSidebar" class="menu-btn">☰</button>
                <h1>Viggo AI</h1>
            </header>

            <div id="conversation" class="conversation-container"></div>

            <!-- INPUT AREA -->
            <div class="chat-input-container">
                <div class="input-wrapper">
                    <button id="plusBtn" class="plus-btn" type="button">＋</button>
                    
                    <!-- PLUS POPUP MENU -->
                    <div id="plusMenu" class="plus-menu">
                        <button id="cameraBtn" type="button">📷 Take Photo</button>
                        <button id="photoBtn" type="button">🖼️ Upload Photo</button>
                        <button id="videoBtn" type="button">🎥 Upload Video</button>
                        <button id="fileBtn" type="button">📄 Upload File</button>
                    </div>

                    <!-- HIDDEN FILE INPUTS -->
                    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">
                    <input type="file" id="photoInput" accept="image/*" style="display: none;">
                    <input type="file" id="videoInput" accept="video/*" style="display: none;">
                    <input type="file" id="fileInput" accept=".pdf,.txt,.doc,.docx" style="display: none;">

                    <textarea id="message" placeholder="Message Viggo AI..." rows="1"></textarea>
                    
                    <button id="mic" class="mic-btn" type="button" title="Voice Input">🎤</button>
                    <button id="send" class="send-btn" type="button" title="Send Message">➤</button>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
