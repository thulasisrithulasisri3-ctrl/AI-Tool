<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viggo AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #050b14;
    color: white;
    height: 100vh;
    overflow: hidden;
}

button {
    font-family: inherit;
}

/* =========================
   APP
========================= */

.app {
    display: flex;
    height: 100vh;
    background:
        radial-gradient(
            circle at top right,
            #123b68 0%,
            #07111f 45%,
            #03070d 100%
        );
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
    width: 270px;
    height: 100vh;
    background: #050b14;
    border-right: 1px solid #18304d;

    padding: 18px;

    display: flex;
    flex-direction: column;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo-b {
    width: 43px;
    height: 43px;

    border-radius: 12px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: linear-gradient(
        135deg,
        #238cff,
        #0755a8
    );

    font-size: 23px;
    font-weight: bold;

    box-shadow:
        0 0 20px rgba(
            0,
            130,
            255,
            .35
        );
}

.logo-text {
    font-size: 22px;
    font-weight: bold;
}

.online {
    margin-top: 7px;
    margin-left: 53px;

    font-size: 12px;
    color: #52e08a;
}

.online-dot {
    display: inline-block;

    width: 7px;
    height: 7px;

    background: #35db78;

    border-radius: 50%;

    margin-right: 5px;

    box-shadow:
        0 0 8px #35db78;
}

/* =========================
   NEW CHAT
========================= */

.new-chat {
    margin-top: 25px;

    width: 100%;

    padding: 12px;

    border: 1px solid #1768b8;

    border-radius: 11px;

    background: linear-gradient(
        135deg,
        #0d70c9,
        #06437f
    );

    color: white;

    cursor: pointer;

    font-size: 15px;

    box-shadow:
        0 5px 20px rgba(
            0,
            110,
            255,
            .2
        );
}

.new-chat:hover {
    background: linear-gradient(
        135deg,
        #1688ec,
        #0755a0
    );
}

/* =========================
   SIDEBAR TITLES
========================= */

.side-title {
    margin-top: 25px;
    margin-bottom: 9px;

    color: #7294b8;

    font-size: 12px;

    text-transform: uppercase;
}

.chat-list {
    display: flex;
    flex-direction: column;

    gap: 5px;

    overflow-y: auto;
}

/* =========================
   CHAT ITEMS
========================= */

.chat-item {
    width: 100%;

    border: 0;

    background: transparent;

    color: #d9e9fb;

    padding: 10px;

    border-radius: 9px;

    text-align: left;

    cursor: pointer;
}

.chat-item:hover {
    background: #0b1c30;
}

.empty-sidebar {
    color: #607a97;

    font-size: 12px;

    padding: 8px;
}

/* =========================
   MORE
========================= */

.more-area {
    margin-top: auto;

    position: relative;
}

.more-button {
    width: 100%;

    padding: 11px;

    border-radius: 10px;

    border: 1px solid #244966;

    background: #0a1928;

    color: #dceeff;

    cursor: pointer;

    text-align: left;

    font-size: 14px;
}

.more-button:hover {
    background: #10304b;
}

/* =========================
   MORE MENU
========================= */

.more-menu {
    display: none;

    position: absolute;

    left: 0;
    right: 0;

    bottom: 50px;

    background: #081522;

    border: 1px solid #245172;

    border-radius: 12px;

    padding: 7px;

    box-shadow:
        0 12px 35px
        rgba(
            0,
            0,
            0,
            .6
        );

    z-index: 1000;
}

.more-menu.show {
    display: block;
}

.more-menu button {
    width: 100%;

    padding: 10px;

    border: 0;

    border-radius: 8px;

    background: transparent;

    color: #dceeff;

    text-align: left;

    cursor: pointer;
}

.more-menu button:hover {
    background: #10304b;
}

/* =========================
   MAIN
========================= */

.main {
    flex: 1;

    min-width: 0;

    height: 100vh;

    display: flex;

    flex-direction: column;
}

/* =========================
   TOP BAR
========================= */

.topbar {
    height: 65px;

    padding: 0 20px;

    display: flex;

    align-items: center;

    border-bottom: 1px solid #18304d;

    background: rgba(
        4,
        11,
        20,
        .92
    );

    backdrop-filter: blur(12px);
}

.current-title {
    font-weight: bold;

    color: #eaf4ff;
}

/* =========================
   SHARE
========================= */

.share-button {
    margin-left: auto;

    border: 1px solid #1d78ca;

    background: #0b3157;

    color: white;

    padding: 8px 14px;

    border-radius: 9px;

    cursor: pointer;
}

.share-button:hover {
    background: #0f477c;
}

/* =========================
   CHAT AREA
========================= */

.chat-area {
    flex: 1;

    overflow-y: auto;

    padding: 25px;
}

.conversation {
    max-width: 900px;

    margin: auto;
}

/* =========================
   WELCOME
========================= */

.welcome {
    text-align: center;

    padding-top: 90px;
}

.welcome-logo {
    width: 75px;
    height: 75px;

    margin: auto;

    border-radius: 20px;

    display: flex;

    align-items: center;

    justify-content: center;

    background: linear-gradient(
        135deg,
        #2496ff,
        #064d91
    );

    font-size: 37px;

    font-weight: bold;

    box-shadow:
        0 10px 35px
        rgba(
            0,
            110,
            255,
            .3
        );
}

.welcome h1 {
    margin-top: 18px;

    font-size: 30px;
}

.welcome p {
    margin-top: 8px;

    color: #7893af;
}

/* =========================
   MESSAGE
========================= */

.message {
    display: flex;

    gap: 12px;

    margin-bottom: 22px;
}

.message-avatar {
    width: 36px;
    height: 36px;

    min-width: 36px;

    border-radius: 10px;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #0d5da6;

    font-weight: bold;
}

.message.user .message-avatar {
    background: #24364b;
}

.message-name {
    font-size: 12px;

    color: #6f9ac5;

    margin-bottom: 5px;
}

.message-text {
    line-height: 1.6;

    color: #e9f3ff;

    white-space: pre-wrap;
}

/* MESSAGE BUTTONS */

.message button {
    border: 1px solid #24445f;

    background: #0b1928;

    color: #a9c8e5;

    padding: 6px 9px;

    border-radius: 7px;

    cursor: pointer;

    font-size: 12px;
}

.message button:hover {
    background: #10304c;

    color: white;
}

/* =========================
   INPUT
========================= */

.bottom-area {
    padding: 15px 20px 18px;

    border-top: 1px solid #18304d;

    background: #050c15;
}

.input-box {
    max-width: 900px;

    margin: auto;

    display: flex;

    align-items: flex-end;

    gap: 8px;
}

#message {
    flex: 1;

    resize: none;

    min-height: 48px;

    max-height: 130px;

    padding: 14px;

    border-radius: 13px;

    border: 1px solid #1e4264;

    background: #091522;

    color: white;

    outline: none;
}

#message:focus {
    border-color: #2189e5;

    box-shadow:
        0 0 0 2px
        rgba(
            33,
            137,
            229,
            .12
        );
}

.input-button {
    height: 48px;

    min-width: 48px;

    border-radius: 12px;

    border: 1px solid #1d5f93;

    background: #0a3153;

    color: white;

    cursor: pointer;
}

.send-button {
    background: linear-gradient(
        135deg,
        #1688ec,
        #0755a0
    );
}

/* =========================
   HISTORY MODAL
========================= */

.modal {
    display: none;

    position: fixed;

    inset: 0;

    background: rgba(
        0,
        0,
        0,
        .7
    );

    z-index: 2000;

    padding: 30px;
}

.modal-content {
    max-width: 700px;

    max-height: 85vh;

    overflow-y: auto;

    margin: auto;

    background: #081522;

    border: 1px solid #214d72;

    border-radius: 15px;

    padding: 20px;

    box-shadow:
        0 20px 60px
        rgba(
            0,
            0,
            0,
            .6
        );
}

.modal-header {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 15px;
}

.close-history {
    border: 0;

    background: transparent;

    color: white;

    font-size: 25px;

    cursor: pointer;
}

.history-card {
    padding: 14px;

    margin-bottom: 10px;

    border: 1px solid #1c3b58;

    border-radius: 10px;

    background: #0a1928;
}

.history-card-title {
    font-weight: bold;

    color: #e8f5ff;
}

.history-card-time {
    font-size: 11px;

    color: #6685a2;

    margin-top: 5px;
}

.history-card-actions {
    display: flex;

    gap: 7px;

    margin-top: 10px;
}

.history-card-actions button {
    border: 1px solid #255172;

    background: #0b243a;

    color: white;

    padding: 6px 9px;

    border-radius: 7px;

    cursor: pointer;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .sidebar {
        width: 245px;
    }

    .chat-area {
        padding: 15px;
    }

    .topbar {
        padding: 0 12px;
    }

    .bottom-area {
        padding: 10px;
    }

    .welcome {
        padding-top: 50px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- ==================================
         LEFT SIDEBAR
    =================================== -->

    <aside
        class="sidebar"
        id="sidebar"
    >

        <div class="logo">

            <div class="logo-b">
                B
            </div>

            <div class="logo-text">
                Viggo
            </div>

        </div>


        <div class="online">

            <span class="online-dot"></span>

            Online

        </div>


        <!-- NEW CHAT -->

        <button
            class="new-chat"
            id="newChat"
        >
            + New Chat
        </button>


        <!-- PINNED -->

        <div class="side-title">
            Pinned
        </div>

        <div
            class="chat-list"
            id="pinnedList"
        ></div>


        <!-- RECENT -->

        <div class="side-title">
            Recent
        </div>

        <div
            class="chat-list"
            id="recentList"
        ></div>


        <!-- ==================================
             MORE - SIDEBAR BOTTOM
        =================================== -->

        <div class="more-area">

            <button
                class="more-button"
                id="moreButton"
            >
                ⋮ More
            </button>


            <div
                class="more-menu"
                id="moreMenu"
            >

                <button
                    id="saveButton"
                >
                    💾 Save
                </button>


                <button
                    id="historyButton"
                >
                    🕘 History
                </button>


                <button
                    id="pinCurrentButton"
                >
                    📌 Pin Chat
                </button>


                <button
                    id="voiceToggle"
                >
                    🔊 Voice ON
                </button>


                <button
                    id="femaleVoiceButton"
                >
                    🎙️ Female Voice
                </button>


                <button
                    id="maleVoiceButton"
                >
                    🎙️ Male Voice
                </button>


                <button
                    id="clearHistory"
                >
                    🗑️ Clear History
                </button>

            </div>

        </div>

    </aside>


    <!-- ==================================
         MAIN
    =================================== -->

    <main class="main">


        <!-- TOP BAR -->

        <header class="topbar">

            <div
                class="current-title"
                id="currentTitle"
            >
                New Chat
            </div>


            <!-- SHARE ONLY -->

            <button
                class="share-button"
                id="shareButton"
            >
                ↗ Share
            </button>

        </header>


        <!-- ==================================
             CHAT
        =================================== -->

        <section
            class="chat-area"
            id="chatArea"
        >

            <div
                class="conversation"
                id="conversation"
            >

                <div
                    class="welcome"
                    id="welcome"
                >

                    <div class="welcome-logo">
                        B
                    </div>

                    <h1>
                        Viggo
                    </h1>

                    <p>
                        Your AI friend is ready.
                    </p>

                </div>

            </div>

        </section>


        <!-- ==================================
             INPUT
        =================================== -->

        <section class="bottom-area">

            <div class="input-box">

                <textarea
                    id="message"
                    placeholder="Message Viggo..."
                    rows="1"
                ></textarea>


                <button
                    class="input-button"
                    id="mic"
                    title="Voice input"
                >
                    🎤
                </button>


                <button
                    class="input-button send-button"
                    id="send"
                    title="Send"
                >
                    ➤
                </button>

            </div>

        </section>

    </main>

</div>


<!-- ==================================
     HISTORY MODAL
=================================== -->

<div
    class="modal"
    id="historyModal"
>

    <div class="modal-content">

        <div class="modal-header">

            <h2>
                🕘 Chat History
            </h2>

            <button
                class="close-history"
                id="closeHistory"
            >
                ×
            </button>

        </div>


        <div
            id="historyList"
        ></div>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
