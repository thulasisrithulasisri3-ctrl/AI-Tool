<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viggo AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

        <div class="brand">
            <div class="brand-logo">V</div>

            <div>
                <div class="brand-name">Viggo AI</div>
                <div class="brand-sub">Your AI Assistant</div>
            </div>

            <button id="closeSidebar" class="mobile-close">×</button>
        </div>

        <button id="newChatBtn" class="new-chat">
            <span>＋</span>
            <span>New Chat</span>
        </button>

        <div class="recent-title">
            <span>Recent</span>
            <span id="recentCount">0</span>
        </div>

        <div id="recentList" class="recent-list"></div>

        <!-- SIDEBAR MORE -->
        <div class="sidebar-bottom">

            <button id="moreBtn" class="more-btn">
                <span>•••</span>
                <span>More</span>
            </button>

            <div id="moreMenu" class="side-menu">

                <button id="languageBtn">
                    🌐 Language
                </button>

                <button id="voiceBtn">
                    🎤 Voice
                </button>

                <button id="deleteBtn">
                    🗑 Delete Chat
                </button>

            </div>

        </div>

    </aside>


    <!-- MAIN -->
    <main class="main">

        <!-- HEADER -->
        <header class="header">

            <div class="header-left">

                <button id="menuBtn" class="menu-btn">
                    ☰
                </button>

                <div>
                    <div class="header-title">
                        Viggo AI
                    </div>

                    <div class="online">
                        <span></span>
                        Online
                    </div>
                </div>

            </div>

            <button id="shareChatBtn" class="header-share">
                🔗 Share
            </button>

        </header>


        <!-- CHAT -->
        <section id="chatArea" class="chat-area">

            <div id="welcome" class="welcome">

                <div class="welcome-logo">
                    V
                </div>

                <h1>
                    Hello! I'm Viggo AI
                </h1>

                <p>
                    Your friendly AI assistant. Ask me anything.
                </p>

            </div>

        </section>


        <!-- INPUT -->
        <div class="input-area">

            <div class="input-box">

                <!-- PLUS LEFT -->
                <button id="plusBtn" class="input-button">
                    ＋
                </button>

                <textarea
                    id="messageInput"
                    placeholder="Message Viggo AI..."
                    rows="1"
                ></textarea>

                <!-- VOICE -->
                <button id="voiceInputBtn" class="input-button">
                    🎤
                </button>

                <!-- SEND -->
                <button id="sendBtn" class="send-button">
                    ➤
                </button>

            </div>

            <div class="input-note">
                Viggo AI can make mistakes. Check important information.
            </div>

        </div>

    </main>


    <!-- PLUS MENU -->
    <div id="plusMenu" class="popup plus-menu">

        <button id="photoBtn">
            📷 Photos
        </button>

        <button id="videoBtn">
            🎥 Videos
        </button>

        <button id="fileBtn">
            📎 Files
        </button>

    </div>


    <!-- LANGUAGE MENU -->
    <div id="languageMenu" class="popup language-menu">

        <div class="popup-title">
            🌐 Language
        </div>

        <button data-language="en">English</button>
        <button data-language="ta">தமிழ்</button>
        <button data-language="hi">हिन्दी</button>
        <button data-language="ml">മലയാളം</button>
        <button data-language="te">తెలుగు</button>
        <button data-language="kn">ಕನ್ನಡ</button>

        <button id="moreLanguageBtn">
            + More Languages
        </button>

        <div id="moreLanguages" class="more-languages">

            <button data-language="bn">Bengali</button>
            <button data-language="mr">Marathi</button>
            <button data-language="gu">Gujarati</button>
            <button data-language="pa">Punjabi</button>
            <button data-language="ur">Urdu</button>
            <button data-language="es">Spanish</button>
            <button data-language="fr">French</button>
            <button data-language="de">German</button>
            <button data-language="ja">Japanese</button>
            <button data-language="ko">Korean</button>
            <button data-language="zh">Chinese</button>
            <button data-language="ar">Arabic</button>

        </div>

    </div>


    <!-- VOICE MENU -->
    <div id="voiceMenu" class="popup voice-menu">

        <div class="popup-title">
            🎤 Voice
        </div>

        <button data-voice="female">
            👩 Female
        </button>

        <button data-voice="male">
            👨 Male
        </button>

        <div id="voiceStatus" class="voice-status">
            Female Voice
        </div>

    </div>


    <!-- DELETE MENU -->
    <div id="deleteMenu" class="popup delete-menu">

        <div class="popup-title">
            🗑 Delete Chat
        </div>

        <button id="selectDeleteBtn">
            ☑ Select Chat
        </button>

        <button id="clearAllBtn">
            🧹 Clear All Chats
        </button>

    </div>


    <!-- FILE INPUT -->
    <input
        id="photoInput"
        type="file"
        accept="image/*"
        multiple
        hidden
    >

    <input
        id="videoInput"
        type="file"
        accept="video/*"
        multiple
        hidden
    >

    <input
        id="fileInput"
        type="file"
        multiple
        hidden
    >


    <!-- SHARE POPUP -->
    <div id="sharePopup" class="share-overlay">

        <div class="share-box">

            <h2>
                🔗 Share Chat
            </h2>

            <input
                id="shareLink"
                readonly
            >

            <button id="copyLinkBtn">
                📋 Copy Link
            </button>

            <button id="nativeShareBtn">
                ↗ Share
            </button>

            <button id="closeShareBtn">
                Close
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</div>

</body>
</html>
