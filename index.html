<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viggo AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

        <div class="brand-row">

            <div class="brand-logo">V</div>

            <div class="brand-text">
                <div class="brand-name">Viggo AI</div>
                <div class="brand-sub">AI Assistant</div>
            </div>

            <button id="closeSidebar" class="close-sidebar">×</button>

        </div>


        <!-- NEW CHAT -->
        <button id="newChatBtn" class="new-chat-btn">
            <span>＋</span>
            <span>New Chat</span>
        </button>


        <!-- RECENT -->
        <div class="recent-header">
            <span>Recent</span>
            <span id="recentCount">0</span>
        </div>

        <div id="recentHistory" class="recent-history"></div>


        <!-- MORE -->
        <div class="sidebar-bottom">

            <button id="moreBtn" class="more-btn">
                <span>•••</span>
                <span>More</span>
            </button>

            <div id="moreMenu" class="more-menu">

                <button id="languageBtn">
                    🌐 Language
                </button>

                <button id="voiceBtn">
                    🎤 Voice
                </button>

                <button id="deleteBtn">
                    🗑 Delete Chat
                </button>

            </div>

        </div>

    </aside>


    <!-- MAIN -->
    <main class="main">

        <!-- HEADER -->
        <header class="top-bar">

            <div class="top-left">

                <button id="menuBtn" class="menu-btn">
                    ☰
                </button>

                <div>
                    <div class="top-title">Viggo AI</div>

                    <div class="online">
                        <span></span>
                        Online
                    </div>
                </div>

            </div>


            <!-- SHARE -->
            <button id="shareChatBtn" class="share-chat-btn">
                🔗 Share
            </button>

        </header>


        <!-- CHAT -->
        <section id="chatArea" class="chat-area">

            <div id="welcome" class="welcome">

                <div class="welcome-logo">
                    V
                </div>

                <h1>Hello! I'm Viggo AI</h1>

                <p>
                    Your friendly AI assistant
                </p>

            </div>

        </section>


        <!-- INPUT -->
        <div class="input-section">

            <div class="input-box">

                <!-- PLUS -->
                <button id="plusBtn" class="input-btn">
                    ＋
                </button>

                <!-- MESSAGE -->
                <textarea
                    id="messageInput"
                    rows="1"
                    placeholder="Message Viggo AI..."
                ></textarea>

                <!-- VOICE INPUT -->
                <button id="voiceInputBtn" class="input-btn">
                    🎤
                </button>

                <!-- SEND -->
                <button id="sendBtn" class="send-btn">
                    ➤
                </button>

            </div>

            <div class="input-note">
                Viggo AI can make mistakes. Check important information.
            </div>

        </div>

    </main>

</div>


<!-- PLUS MENU -->

<div id="plusMenu" class="popup">

    <button id="photoBtn">
        📷 Photos
    </button>

    <button id="videoBtn">
        🎥 Videos
    </button>

    <button id="fileBtn">
        📎 Files
    </button>

</div>


<input
    id="photoInput"
    type="file"
    accept="image/*"
    multiple
    hidden
>

<input
    id="videoInput"
    type="file"
    accept="video/*"
    multiple
    hidden
>

<input
    id="fileInput"
    type="file"
    multiple
    hidden
>


<!-- LANGUAGE -->

<div id="languageMenu" class="popup">

    <h3>🌐 Language</h3>

    <button data-language="en">English</button>
    <button data-language="ta">தமிழ்</button>
    <button data-language="hi">हिन्दी</button>
    <button data-language="ml">മലയാളം</button>
    <button data-language="te">తెలుగు</button>
    <button data-language="kn">ಕನ್ನಡ</button>

    <button id="moreLanguageBtn">
        ＋ More Languages
    </button>

    <div id="moreLanguages">

        <button data-language="bn">Bengali</button>
        <button data-language="mr">Marathi</button>
        <button data-language="gu">Gujarati</button>
        <button data-language="pa">Punjabi</button>
        <button data-language="ur">Urdu</button>
        <button data-language="es">Spanish</button>
        <button data-language="fr">French</button>
        <button data-language="de">German</button>
        <button data-language="ja">Japanese</button>
        <button data-language="ko">Korean</button>
        <button data-language="zh">Chinese</button>
        <button data-language="ar">Arabic</button>

    </div>

</div>


<!-- VOICE -->

<div id="voiceMenu" class="popup">

    <h3>🎤 Voice</h3>

    <button data-voice="female">
        👩 Female
    </button>

    <button data-voice="male">
        👨 Male
    </button>

    <div id="voiceStatus">
        👩 Female voice selected
    </div>

</div>


<!-- DELETE -->

<div id="deleteMenu" class="popup">

    <h3>🗑 Delete Chat</h3>

    <button id="selectDeleteBtn">
        ☑ Select Chat
    </button>

    <button id="clearAllBtn">
        🧹 Clear All Chats
    </button>

</div>


<!-- SHARE -->

<div id="shareOverlay" class="share-overlay">

    <div class="share-box">

        <h2>🔗 Share Chat</h2>

        <input id="shareLink" readonly>

        <button id="copyShareLink">
            📋 Copy Link
        </button>

        <button id="nativeShare">
            ↗ Share
        </button>

        <button id="closeShare">
            Close
        </button>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
