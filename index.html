<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Viggo AI Assistant</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #070711;
  --panel: rgba(17, 17, 30, 0.88);
  --border: rgba(255,255,255,0.09);
  --text: #f7f7ff;
  --muted: #9292a8;
  --purple: #8b5cf6;
  --blue: #3b82f6;
  --pink: #ec4899;
}

body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  font-family: Arial, sans-serif;
  color: var(--text);

  background:
    radial-gradient(
      circle at 15% 10%,
      rgba(139,92,246,.18),
      transparent 28%
    ),
    radial-gradient(
      circle at 90% 85%,
      rgba(59,130,246,.14),
      transparent 30%
    ),
    #070711;
}

/* =========================
   APP
========================= */

.app {
  height: 100vh;
  display: flex;
}

/* =========================
   SIDEBAR
========================= */

#sidebar {
  width: 270px;
  height: 100vh;
  padding: 18px 15px;

  display: flex;
  flex-direction: column;

  background: rgba(10,10,20,.88);
  border-right: 1px solid var(--border);

  backdrop-filter: blur(25px);

  flex-shrink: 0;
  z-index: 100;
}

/* VIGGO TEXT ONLY */

.brand {
  padding: 8px 10px 22px;

  font-size: 25px;
  font-weight: 800;

  letter-spacing: -1px;
}

.brand-text {
  background:
    linear-gradient(
      90deg,
      #ffffff,
      #bca8ff,
      #7db4ff
    );

  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* =========================
   SIDEBAR BUTTONS
========================= */

#newChat,
#historyButton,
#saveButton,
#voiceToggle,
#clearHistory {

  width: 100%;

  border: 1px solid var(--border);
  border-radius: 12px;

  padding: 11px 13px;

  cursor: pointer;

  font-size: 14px;

  transition: .2s;
}

#newChat {

  background:
    linear-gradient(
      135deg,
      rgba(139,92,246,.25),
      rgba(59,130,246,.14)
    );

  color: white;

  text-align: left;

  margin-bottom: 18px;
}

#historyButton,
#voiceToggle {

  background: rgba(255,255,255,.045);
  color: #ddd;
}

#saveButton {

  background:
    linear-gradient(
      135deg,
      #8b5cf6,
      #6366f1
    );

  color: white;
  border: 0;
}

#clearHistory {

  background: rgba(239,68,68,.10);
  color: #ff9999;
}

#newChat:hover,
#historyButton:hover,
#saveButton:hover,
#voiceToggle:hover,
#clearHistory:hover {

  transform: translateY(-1px);

  border-color:
    rgba(139,92,246,.5);

  background-color:
    rgba(255,255,255,.08);
}

/* =========================
   SIDEBAR TITLES
========================= */

.side-title {

  font-size: 10px;

  color: #77778c;

  padding: 8px;

  text-transform: uppercase;

  letter-spacing: 1.4px;

  font-weight: 700;
}

/* =========================
   CHAT LIST
========================= */

.chat-list {

  overflow-y: auto;

  margin-bottom: 8px;
}

.chat-item {

  width: 100%;

  display: flex;

  align-items: center;

  justify-content: space-between;

  background: transparent;

  color: #cfcfe0;

  border: 0;

  padding: 10px;

  border-radius: 10px;

  cursor: pointer;

  text-align: left;

  margin-bottom: 3px;

  transition: .2s;
}

.chat-item:hover,
.chat-item.active {

  background:
    rgba(139,92,246,.12);

  color: white;
}

.chat-item-title {

  overflow: hidden;

  text-overflow: ellipsis;

  white-space: nowrap;
}

.pin-icon {
  margin-left: 5px;
}

.empty-sidebar {

  color: #656579;

  font-size: 12px;

  padding: 10px;
}

/* =========================
   SIDEBAR BOTTOM
========================= */

.sidebar-bottom {

  margin-top: auto;

  display: flex;

  flex-direction: column;

  gap: 7px;
}

/* =========================
   MAIN
========================= */

.main {

  flex: 1;

  display: flex;

  flex-direction: column;

  min-width: 0;

  position: relative;
}

/* =========================
   TOP BAR
========================= */

.topbar {

  height: 64px;

  background:
    rgba(7,7,17,.68);

  border-bottom:
    1px solid var(--border);

  backdrop-filter:
    blur(20px);

  display: flex;

  align-items: center;

  padding: 0 22px;

  gap: 14px;
}

#currentTitle {

  font-size: 15px;

  font-weight: 700;

  color: #eeeef8;
}

.status {

  margin-left: auto;

  display: flex;

  align-items: center;

  gap: 6px;

  color: #9999ad;

  font-size: 12px;
}

.status-dot {

  width: 7px;

  height: 7px;

  border-radius: 50%;

  background: #22c55e;

  box-shadow:
    0 0 10px #22c55e;
}

/* =========================
   CHAT AREA
========================= */

#chatArea {

  flex: 1;

  overflow-y: auto;

  padding: 25px;
}

#conversation {

  max-width: 920px;

  margin: auto;
}

/* =========================
   WELCOME
========================= */

.welcome {

  min-height: 65vh;

  display: flex;

  justify-content: center;

  align-items: center;

  text-align: center;
}

.welcome-box {

  max-width: 650px;

  width: 100%;
}

/* GLOW ORB */

.ai-orb {

  width: 90px;

  height: 90px;

  margin: auto;

  border-radius: 28px;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 42px;

  background:
    linear-gradient(
      135deg,
      rgba(139,92,246,.8),
      rgba(59,130,246,.8),
      rgba(236,72,153,.7)
    );

  box-shadow:
    0 0 35px rgba(139,92,246,.35),
    inset 0 0 25px rgba(255,255,255,.12);

  animation:
    floating 4s ease-in-out infinite;
}

@keyframes floating {

  0%,100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-8px);
  }
}

/* =========================
   WELCOME TEXT
========================= */

.welcome-box h1 {

  font-size:
    clamp(32px,5vw,48px);

  margin:
    24px 0 8px;

  letter-spacing:
    -1.5px;

  background:
    linear-gradient(
      90deg,
      #ffffff,
      #bda9ff,
      #7db4ff
    );

  -webkit-background-clip: text;

  -webkit-text-fill-color: transparent;
}

.welcome-box p {

  color: #9292a8;

  font-size: 15px;

  line-height: 1.6;

  margin-bottom: 28px;
}

/* =========================
   SUGGESTIONS
========================= */

.suggestions {

  display: grid;

  grid-template-columns:
    repeat(2,1fr);

  gap: 10px;

  margin-top: 25px;
}

.suggestion {

  text-align: left;

  padding: 15px;

  border-radius: 15px;

  border:
    1px solid var(--border);

  background:
    rgba(255,255,255,.035);

  color: #ddd;

  cursor: pointer;

  transition: .25s;
}

.suggestion:hover {

  transform:
    translateY(-3px);

  background:
    rgba(139,92,246,.10);

  border-color:
    rgba(139,92,246,.35);
}

.suggestion strong {

  display: block;

  margin-bottom: 5px;
}

.suggestion span {

  font-size: 12px;

  color: #85859b;
}

/* =========================
   MESSAGES
========================= */

.message {

  display: flex;

  gap: 13px;

  padding: 18px 14px;

  margin-bottom: 8px;

  border-radius: 18px;

  animation:
    messageIn .25s ease;
}

@keyframes messageIn {

  from {

    opacity: 0;

    transform:
      translateY(8px);
  }

  to {

    opacity: 1;

    transform:
      translateY(0);
  }
}

.message.user {

  background:
    rgba(255,255,255,.035);

  border:
    1px solid rgba(255,255,255,.04);
}

.message.ai {

  background:
    rgba(139,92,246,.035);
}

.message-avatar {

  width: 36px;

  height: 36px;

  border-radius: 11px;

  display: flex;

  align-items: center;

  justify-content: center;

  background:
    linear-gradient(
      135deg,
      #8b5cf6,
      #3b82f6
    );

  color: white;

  font-weight: bold;

  flex-shrink: 0;

  box-shadow:
    0 0 18px
    rgba(139,92,246,.2);
}

.message.user .message-avatar {

  background:
    linear-gradient(
      135deg,
      #44445a,
      #222232
    );
}

.message-name {

  font-weight: 700;

  margin-bottom: 6px;

  font-size: 13px;
}

.message-text {

  white-space: pre-wrap;

  line-height: 1.7;

  color: #d9d9e5;

  font-size: 14px;
}

/* =========================
   INPUT AREA
========================= */

.input-area {

  background:
    linear-gradient(
      to top,
      rgba(7,7,17,.98),
      rgba(7,7,17,.85)
    );

  padding:
    12px 20px 18px;
}

.input-box {

  max-width: 920px;

  margin: auto;

  display: flex;

  align-items: flex-end;

  gap: 8px;

  border:
    1px solid
    rgba(255,255,255,.12);

  border-radius: 18px;

  padding: 8px;

  background:
    rgba(22,22,38,.86);

  backdrop-filter:
    blur(20px);

  box-shadow:
    0 10px 35px
    rgba(0,0,0,.25),

    inset 0 1px
    rgba(255,255,255,.04);

  transition: .2s;
}

.input-box:focus-within {

  border-color:
    rgba(139,92,246,.55);

  box-shadow:

    0 0 0 3px
    rgba(139,92,246,.08),

    0 10px 35px
    rgba(0,0,0,.3);
}

#message {

  flex: 1;

  border: 0;

  outline: none;

  resize: none;

  font-size: 15px;

  min-height: 40px;

  max-height: 150px;

  padding: 10px;

  background: transparent;

  color: white;

  font-family: inherit;
}

#message::placeholder {

  color: #77778c;
}

#mic,
#send {

  border: 0;

  border-radius: 12px;

  cursor: pointer;

  min-width: 44px;

  height: 42px;

  transition: .2s;
}

#mic {

  background:
    rgba(255,255,255,.07);

  color: white;

  font-size: 17px;
}

#mic:hover {

  background:
    rgba(139,92,246,.15);
}

#mic.listening {

  background:
    rgba(239,68,68,.18);

  box-shadow:
    0 0 18px
    rgba(239,68,68,.2);
}

#send {

  background:
    linear-gradient(
      135deg,
      #8b5cf6,
      #6366f1,
      #3b82f6
    );

  color: white;

  font-weight: bold;

  box-shadow:
    0 5px 18px
    rgba(99,102,241,.25);
}

#send:hover {

  transform:
    translateY(-2px);

  box-shadow:
    0 8px 25px
    rgba(99,102,241,.35);
}

#send:disabled {

  opacity: .45;

  cursor: not-allowed;

  transform: none;
}

.input-hint {

  max-width: 920px;

  margin: 7px auto 0;

  text-align: center;

  color: #555568;

  font-size: 10px;
}

/* =========================
   HISTORY MODAL
========================= */

#historyModal {

  display: none;

  position: fixed;

  inset: 0;

  background:
    rgba(0,0,0,.7);

  backdrop-filter:
    blur(8px);

  z-index: 1000;

  padding: 30px;
}

.history-window {

  background:
    #11111e;

  border:
    1px solid var(--border);

  max-width: 800px;

  max-height: 85vh;

  overflow-y: auto;

  margin: auto;

  border-radius: 20px;

  padding: 20px;

  box-shadow:
    0 30px 80px
    rgba(0,0,0,.5);
}

.history-header {

  display: flex;

  justify-content:
    space-between;

  align-items:
    center;

  margin-bottom: 18px;
}

.history-header h2 {

  margin: 0;
}

#closeHistory {

  border: 0;

  background:
    rgba(255,255,255,.07);

  color: white;

  border-radius: 9px;

  padding: 8px 12px;

  cursor: pointer;
}

.history-card {

  border:
    1px solid var(--border);

  background:
    rgba(255,255,255,.035);

  border-radius: 14px;

  padding: 14px;

  margin-bottom: 10px;
}

.history-card.pinned {

  border-left:
    4px solid #8b5cf6;
}

.history-card-title {

  font-weight: bold;

  margin-bottom: 5px;
}

.history-card-time {

  color: #77778b;

  font-size: 12px;

  margin-bottom: 10px;
}

.history-card-actions {

  display: flex;

  flex-wrap: wrap;

  gap: 6px;
}

.history-card-actions button {

  border: 0;

  border-radius: 8px;

  padding: 8px 10px;

  cursor: pointer;

  background:
    rgba(255,255,255,.07);

  color: #ddd;
}

.delete-button {

  background:
    rgba(239,68,68,.12) !important;

  color: #ff9999 !important;
}

/* =========================
   MOBILE
========================= */

#mobileMenu {

  display: none;

  border:
    1px solid var(--border);

  background:
    rgba(255,255,255,.06);

  color: white;

  border-radius: 9px;

  padding: 8px 10px;

  cursor: pointer;
}

@media (max-width: 700px) {

  #sidebar {

    position: fixed;

    left: -285px;

    top: 0;

    bottom: 0;

    transition:
      left .25s ease;

    box-shadow:
      20px 0 60px
      rgba(0,0,0,.4);
  }

  #sidebar.open {
    left: 0;
  }

  #mobileMenu {
    display: block;
  }

  .topbar {
    padding: 0 12px;
  }

  #chatArea {
    padding: 12px;
  }

  .welcome {
    min-height: 70vh;
  }

  .welcome-box h1 {
    font-size: 34px;
  }

  .suggestions {
    grid-template-columns: 1fr;
  }

  .input-area {
    padding:
      8px 10px 12px;
  }

  .input-hint {
    display: none;
  }

  #historyModal {
    padding: 10px;
  }

  .history-window {
    max-height: 95vh;
  }
}

/* =========================
   SCROLLBAR
========================= */

::-webkit-scrollbar {
  width: 6px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {

  background:
    rgba(255,255,255,.12);

  border-radius: 10px;
}

::-webkit-scrollbar-thumb:hover {

  background:
    rgba(139,92,246,.35);
}
</style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->

  <aside id="sidebar">

    <div class="brand">
      <div class="brand-text">
        Viggo
      </div>
    </div>

    <button id="newChat">
      ＋ &nbsp; New Chat
    </button>

    <div class="side-title">
      Pinned
    </div>

    <div id="pinnedList" class="chat-list">
      <div class="empty-sidebar">
        No pinned chats
      </div>
    </div>

    <div class="side-title">
      Recent
    </div>

    <div id="recentList" class="chat-list">
      <div class="empty-sidebar">
        No recent chats
      </div>
    </div>

    <div class="sidebar-bottom">

      <button id="historyButton">
        🕘 &nbsp; History
      </button>

      <button id="saveButton">
        💾 &nbsp; Save Chat
      </button>

      <button id="voiceToggle">
        🔊 &nbsp; Voice ON
      </button>

      <button id="clearHistory">
        🗑️ &nbsp; Clear History
      </button>

    </div>

  </aside>


  <!-- MAIN -->

  <main class="main">

    <header class="topbar">

      <button id="mobileMenu">
        ☰
      </button>

      <div id="currentTitle">
        New Chat
      </div>

      <div class="status">

        <span class="status-dot"></span>

        Viggo Online

      </div>

    </header>


    <!-- CHAT -->

    <section id="chatArea">

      <div id="conversation">

        <div class="welcome">

          <div class="welcome-box">

            <div class="ai-orb">
              ✦
            </div>

            <h1>
              What can I help you with?
            </h1>

            <p>
              Meet Viggo — your smart AI assistant for
              learning, coding, ideas and everyday tasks.
            </p>


            <div class="suggestions">

              <button
                class="suggestion"
                onclick="useSuggestion('Explain this concept in simple words')">

                <strong>
                  🧠 Explain
                </strong>

                <span>
                  Understand difficult topics easily
                </span>

              </button>


              <button
                class="suggestion"
                onclick="useSuggestion('Help me write a program')">

                <strong>
                  💻 Code
                </strong>

                <span>
                  Build and debug your projects
                </span>

              </button>


              <button
                class="suggestion"
                onclick="useSuggestion('Give me creative ideas')">

                <strong>
                  💡 Create
                </strong>

                <span>
                  Generate fresh ideas and content
                </span>

              </button>


              <button
                class="suggestion"
                onclick="useSuggestion('Teach me something interesting')">

                <strong>
                  🚀 Learn
                </strong>

                <span>
                  Learn something new today
                </span>

              </button>

            </div>

          </div>

        </div>

      </div>

    </section>


    <!-- INPUT -->

    <footer class="input-area">

      <div class="input-box">

        <textarea
          id="message"
          placeholder="Message Viggo..."
          rows="1">
        </textarea>

        <button
          id="mic"
          title="Voice input">

          🎤

        </button>

        <button
          id="send"
          title="Send message">

          ➤

        </button>

      </div>

      <div class="input-hint">
        Viggo can make mistakes. Check important information.
      </div>

    </footer>

  </main>

</div>


<!-- HISTORY -->

<div id="historyModal">

  <div class="history-window">

    <div class="history-header">

      <h2>
        🕘 Chat History
      </h2>

      <button id="closeHistory">
        ✕
      </button>

    </div>

    <div id="historyList"></div>

  </div>

</div>


<script src="script.js"></script>


<script>

/* =========================
   SUGGESTIONS
========================= */

function useSuggestion(text) {

  const message =
    document.getElementById("message");

  message.value = text;

  message.focus();

  message.style.height = "auto";

  message.style.height =
    Math.min(
      message.scrollHeight,
      150
    ) + "px";
}


/* =========================
   AUTO RESIZE
========================= */

const textarea =
  document.getElementById("message");

textarea.addEventListener(
  "input",
  function() {

    this.style.height = "auto";

    this.style.height =
      Math.min(
        this.scrollHeight,
        150
      ) + "px";

  }
);


/* =========================
   ENTER SEND
========================= */

textarea.addEventListener(
  "keydown",
  function(e) {

    if (
      e.key === "Enter" &&
      !e.shiftKey
    ) {

      e.preventDefault();

      document
        .getElementById("send")
        .click();

    }

  }
);


/* =========================
   MOBILE MENU
========================= */

const mobileMenu =
  document.getElementById(
    "mobileMenu"
  );

const sidebar =
  document.getElementById(
    "sidebar"
  );

if (mobileMenu) {

  mobileMenu.addEventListener(
    "click",
    () => {

      sidebar.classList.toggle(
        "open"
      );

    }
  );

}


/* =========================
   CLOSE MOBILE SIDEBAR
========================= */

document.addEventListener(
  "click",
  function(e) {

    if (
      window.innerWidth <= 700 &&
      sidebar.classList.contains("open") &&
      !sidebar.contains(e.target) &&
      e.target !== mobileMenu
    ) {

      sidebar.classList.remove(
        "open"
      );

    }

  }
);

</script>

</body>
</html>
