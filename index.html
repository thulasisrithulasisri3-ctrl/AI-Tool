<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viggo AI</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">

    <div class="sidebar-header">
      <h2>Viggo AI</h2>

      <button id="closeSidebar" class="icon-btn">✕</button>
    </div>

    <button id="newChat" class="new-chat">
      ＋ New Chat
    </button>

    <div class="search-box">
      🔎
      <input id="searchChat" type="text" placeholder="Search Chat">
    </div>

    <div class="history-title">
      CHAT HISTORY
    </div>

    <div id="chatHistory" class="chat-history"></div>

    <!-- MORE BUTTON AT BOTTOM -->
    <div class="sidebar-more">

      <button id="moreBtn" class="more-button">
        <span class="more-dots">⋮</span>
        <span>More</span>
      </button>

      <div id="moreMenu" class="more-menu">

        <button id="voiceMenuBtn">
          🎤 Voice
        </button>

        <button id="languageBtn">
          🌐 Language
        </button>

        <button id="clearChatBtn">
          🗑 Clear Chat
        </button>

        <button id="showHistoryBtn">
          🕘 Show History
        </button>

        <button id="savedChatsBtn">
          💾 Saved Chats
        </button>

        <button id="selectChatsBtn">
          ☑ Select Chats
        </button>

        <button id="deleteSelectedBtn">
          🗑 Delete Selected
        </button>

      </div>

    </div>

  </aside>


  <!-- MAIN -->
  <main class="main">

    <!-- TOP BAR -->
    <header class="topbar">

      <div class="top-left">

        <button id="openSidebar" class="menu-btn">
          ☰
        </button>

        <div class="brand">
          Viggo AI
        </div>

      </div>


      <!-- SHARE ON RIGHT SIDE -->
      <button id="shareBtn" class="share-btn">
        🔗 Share
      </button>

    </header>


    <!-- CHAT -->
    <section class="chat-area">

      <div id="conversation" class="conversation"></div>

    </section>


    <!-- INPUT -->
    <div class="input-area">

      <button id="plusBtn" class="input-plus">
        ＋
      </button>

      <textarea
        id="message"
        rows="1"
        placeholder="Message Viggo AI..."
      ></textarea>

      <button id="mic" class="input-icon">
        🎤
      </button>

      <button id="send" class="send-btn">
        ➤
      </button>

    </div>

  </main>


  <!-- PLUS MENU -->
  <div id="plusMenu" class="plus-menu">

    <button>
      📷 Photo
    </button>

    <button>
      🎥 Video
    </button>

    <button>
      📎 File
    </button>

    <button id="plusVoiceBtn">
      🎤 Voice
    </button>

  </div>


  <!-- VOICE MODAL -->
  <div id="voiceModal" class="modal">

    <div class="modal-box">

      <button id="closeVoice" class="modal-close">
        ✕
      </button>

      <h3>Voice Settings</h3>

      <select id="voiceSelect">
        <option value="female">Female</option>
        <option value="male">Male</option>
      </select>

      <button id="voiceTest" class="modal-button">
        🔊 Test Voice
      </button>

    </div>

  </div>


  <!-- LANGUAGE MODAL -->
  <div id="languageModal" class="modal">

    <div class="modal-box">

      <button id="closeLanguage" class="modal-close">
        ✕
      </button>

      <h3>Language</h3>

      <select id="languageSelect">
        <option value="English">English</option>
        <option value="Tamil">தமிழ்</option>
        <option value="Hindi">हिन्दी</option>
        <option value="Malayalam">മലയാളം</option>
        <option value="Telugu">తెలుగు</option>
        <option value="Kannada">ಕನ್ನಡ</option>
      </select>

      <button id="saveLanguage" class="modal-button">
        Save
      </button>

    </div>

  </div>


<script src="script.js?v=3"></script>

</body>
</html>
