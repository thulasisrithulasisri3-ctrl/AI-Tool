<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#05070c"
    >

    <title>Viggo AI</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<div class="app">

    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside
        class="sidebar"
        id="sidebar"
    >

        <!-- BRAND -->

        <div class="brand">

            <div class="brand-logo">
                V
            </div>

            <div>
                <div class="brand-name">
                    Viggo AI
                </div>

                <div class="brand-status">
                    AI Assistant
                </div>
            </div>

        </div>


        <!-- NEW CHAT -->

        <button
            id="newChatButton"
            class="new-chat-btn"
            type="button"
        >
            <span>＋</span>
            New Chat
        </button>


        <!-- RECENT -->

        <div class="recent-title">
            Recent
        </div>


        <!-- HISTORY -->

        <div
            id="historyContainer"
            class="history-container"
        >
            <!-- JavaScript creates chats here -->
        </div>


        <!-- SELECT / DELETE -->

        <div class="select-controls">

            <button
                id="selectChatsButton"
                class="select-button"
                type="button"
            >
                ☑ Select Chats
            </button>

            <button
                id="deleteSelectedButton"
                class="delete-selected-button"
                type="button"
                disabled
            >
                🗑 Delete Selected
            </button>

        </div>


        <!-- DELETED CHATS -->

        <div class="deleted-section">

            <button
                id="deletedChatsButton"
                class="deleted-chats-button"
                type="button"
            >
                🗑 Deleted Chats
            </button>

            <div
                id="deletedChatsContainer"
                class="deleted-chats-container"
            >
                <!-- Deleted chats appear here -->
            </div>

        </div>


        <!-- MORE -->

        <div class="sidebar-bottom">

            <button
                id="moreButton"
                class="more-button"
                type="button"
            >
                ⋮
                More
            </button>


            <div
                id="moreMenu"
                class="more-menu"
            >

                <button
                    id="languageButton"
                    type="button"
                >
                    🌐 Language
                </button>

                <button
                    id="voiceButton"
                    type="button"
                >
                    🔊 Voice
                </button>

                <button
                    id="clearAllButton"
                    type="button"
                >
                    🗑 Clear All Chats
                </button>

            </div>

        </div>

    </aside>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="main">


        <!-- HEADER -->

        <header class="header">

            <div class="header-left">

                <button
                    id="mobileMenuButton"
                    class="mobile-menu"
                    type="button"
                    aria-label="Open menu"
                >
                    ☰
                </button>


                <div>

                    <h1>
                        Viggo AI
                    </h1>

                    <span>
                        Your intelligent AI assistant
                    </span>

                </div>

            </div>


            <!-- TOP RIGHT SERVER LINK -->

            <div class="header-right">

                <a
                    id="serverLink"
                    class="server-link"
                    href="https://ai-tool-2-zpul.onrender.com"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    🔗 Viggo Server
                </a>

            </div>

        </header>


        <!-- =================================================
             MESSAGE AREA
        ================================================== -->

        <section
            id="messageContainer"
            class="message-container"
        >

            <!-- WELCOME -->

            <div
                id="welcomeScreen"
                class="welcome"
            >

                <div class="welcome-logo">
                    V
                </div>

                <h2>
                    How can I help you?
                </h2>

                <p>
                    Ask Viggo AI anything.
                </p>

            </div>


            <!-- MESSAGES CREATED BY JS -->

        </section>


        <!-- =================================================
             INPUT AREA
        ================================================== -->

        <section class="input-wrapper">

            <div class="input-box">


                <!-- PLUS -->

                <button
                    id="plusButton"
                    class="input-button"
                    type="button"
                    aria-label="More options"
                >
                    ＋
                </button>


                <!-- PLUS MENU -->

                <div
                    id="plusMenu"
                    class="plus-menu"
                >

                    <button
                        id="photoButton"
                        type="button"
                    >
                        📷
                        <span>
                            Photo
                        </span>
                    </button>

                    <button
                        id="videoButton"
                        type="button"
                    >
                        🎥
                        <span>
                            Video
                        </span>
                    </button>

                    <button
                        id="fileButton"
                        type="button"
                    >
                        📎
                        <span>
                            File
                        </span>
                    </button>

                </div>


                <!-- HIDDEN FILE INPUT -->

                <input
                    id="photoInput"
                    type="file"
                    accept="image/*"
                    hidden
                >

                <input
                    id="videoInput"
                    type="file"
                    accept="video/*"
                    hidden
                >

                <input
                    id="fileInput"
                    type="file"
                    hidden
                >


                <!-- MESSAGE INPUT -->

                <textarea
                    id="messageInput"
                    class="message-input"
                    rows="1"
                    placeholder="Message Viggo AI..."
                    autocomplete="off"
                ></textarea>


                <!-- VOICE -->

                <button
                    id="voiceInputButton"
                    class="input-button"
                    type="button"
                    aria-label="Voice input"
                    title="Voice input"
                >
                    🎤
                </button>


                <!-- SEND -->

                <button
                    id="sendButton"
                    class="send-button"
                    type="button"
                    aria-label="Send message"
                    title="Send"
                >
                    ➤
                </button>

            </div>

        </section>

    </main>

</div>


<!-- =====================================================
     LANGUAGE MODAL
====================================================== -->

<div
    id="languageModal"
    class="modal"
>

    <div class="modal-box">

        <div class="modal-header">

            <h3>
                Select Language
            </h3>

            <button
                id="closeLanguageModal"
                type="button"
            >
                ×
            </button>

        </div>


        <label for="languageSelect">
            Language
        </label>

        <select
            id="languageSelect"
        >

            <option value="en">
                English
            </option>

            <option value="ta">
                தமிழ்
            </option>

            <option value="hi">
                हिन्दी
            </option>

            <option value="ml">
                മലയാളം
            </option>

            <option value="te">
                తెలుగు
            </option>

            <option value="kn">
                ಕನ್ನಡ
            </option>

        </select>


        <button
            id="saveLanguageButton"
            class="save-button"
            type="button"
        >
            Save Language
        </button>

    </div>

</div>


<!-- =====================================================
     CONFIRM MODAL
====================================================== -->

<div
    id="confirmModal"
    class="modal"
>

    <div class="modal-box">

        <div class="modal-header">

            <h3 id="confirmTitle">
                Confirm
            </h3>

            <button
                id="closeConfirmModal"
                type="button"
            >
                ×
            </button>

        </div>


        <p
            id="confirmMessage"
            style="
                color:#aeb9c9;
                line-height:1.6;
                margin-bottom:18px;
            "
        >
            Are you sure?
        </p>


        <div
            style="
                display:flex;
                gap:8px;
            "
        >

            <button
                id="cancelConfirmButton"
                class="select-button"
                type="button"
            >
                Cancel
            </button>

            <button
                id="confirmActionButton"
                class="delete-selected-button"
                type="button"
            >
                Confirm
            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     MAIN SCRIPT
====================================================== -->

<script src="script.js"></script>

</body>
</html>
