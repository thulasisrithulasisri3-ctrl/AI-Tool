<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Voice Assistant</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #eef2ff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 95%;
      max-width: 720px;
      height: 90vh;
      background: white;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 25px;
    }

    #status {
      margin-top: 7px;
      font-size: 13px;
      color: #86efac;
    }

    #chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .message {
      display: flex;
      margin-bottom: 15px;
    }

    .user {
      justify-content: flex-end;
    }

    .ai {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 82%;
      padding: 13px 16px;
      border-radius: 16px;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .user .bubble {
      background: #2563eb;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .ai .bubble {
      background: #e5e7eb;
      color: #111827;
      border-bottom-left-radius: 4px;
    }

    .controls {
      display: flex;
      gap: 8px;
      padding: 12px 15px 5px;
      border-top: 1px solid #ddd;
    }

    #messageInput {
      flex: 1;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    button {
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
    }

    #sendButton {
      padding: 0 18px;
      background: #2563eb;
      color: white;
    }

    #micButton {
      width: 50px;
      height: 50px;
      background: #111827;
      color: white;
      font-size: 21px;
    }

    #micButton.listening {
      background: #dc2626;
    }

    #speakButton {
      margin: 5px 15px 15px;
      padding: 11px;
      background: #16a34a;
      color: white;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .welcome {
      text-align: center;
      color: #6b7280;
      margin-top: 40px;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      <h1>🤖 AI Voice Assistant</h1>
      <div id="status">Connecting...</div>
    </div>

    <div id="chat">
      <div class="welcome">
        🎤 Tap the microphone and speak<br>
        தமிழ் / English / Tanglish
      </div>
    </div>

    <div class="controls">

      <input
        id="messageInput"
        type="text"
        placeholder="Type or speak..."
        autocomplete="off"
      >

      <button id="micButton" title="Speak">
        🎤
      </button>

      <button id="sendButton">
        Send
      </button>

    </div>

    <button id="speakButton">
      🔊 Read last answer
    </button>

  </div>


  <script>

    const API_URL =
      "https://ai-tool-2-zpul.onrender.com";


    const chat =
      document.getElementById("chat");

    const input =
      document.getElementById("messageInput");

    const sendButton =
      document.getElementById("sendButton");

    const micButton =
      document.getElementById("micButton");

    const speakButton =
      document.getElementById("speakButton");

    const status =
      document.getElementById("status");


    let lastAnswer = "";


    // -----------------------------
    // ADD MESSAGE
    // -----------------------------

    function addMessage(text, type) {

      const welcome =
        document.querySelector(".welcome");

      if (welcome) {
        welcome.remove();
      }

      const message =
        document.createElement("div");

      message.className =
        "message " + type;


      const bubble =
        document.createElement("div");

      bubble.className =
        "bubble";

      bubble.textContent =
        text;


      message.appendChild(bubble);

      chat.appendChild(message);

      chat.scrollTop =
        chat.scrollHeight;
    }


    // -----------------------------
    // BACKEND CHECK
    // -----------------------------

    async function checkBackend() {

      try {

        const response =
          await fetch(API_URL + "/");

        if (!response.ok) {
          throw new Error("Backend offline");
        }

        const data =
          await response.json();

        if (data.status === "online") {

          status.textContent =
            "● Online";

          status.style.color =
            "#86efac";

        }

      } catch (error) {

        status.textContent =
          "● Backend offline";

        status.style.color =
          "#fca5a5";

        console.error(error);
      }
    }


    // -----------------------------
    // SEND MESSAGE
    // -----------------------------

    async function sendMessage() {

      const message =
        input.value.trim();


      if (!message) {
        return;
      }


      addMessage(
        message,
        "user"
      );


      input.value = "";

      sendButton.disabled =
        true;

      micButton.disabled =
        true;

      sendButton.textContent =
        "Thinking...";


      try {

        const response =
          await fetch(
            API_URL + "/chat",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                message: message
              })
            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.details ||
            data.error ||
            "AI request failed"
          );

        }


        const answer =
          data.reply ||
          "No response received.";


        lastAnswer =
          answer;


        addMessage(
          answer,
          "ai"
        );


        // Automatically speak AI answer
        speakText(answer);


      } catch (error) {

        console.error(
          "AI Error:",
          error
        );


        addMessage(
          "❌ " + error.message,
          "ai"
        );

      } finally {

        sendButton.disabled =
          false;

        micButton.disabled =
          false;

        sendButton.textContent =
          "Send";

        input.focus();
      }
    }


    // -----------------------------
    // ENTER KEY
    // -----------------------------

    input.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {
          sendMessage();
        }

      }
    );


    sendButton.addEventListener(
      "click",
      sendMessage
    );


    // -----------------------------
    // VOICE INPUT
    // -----------------------------

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;


    let recognition = null;


    if (SpeechRecognition) {

      recognition =
        new SpeechRecognition();


      recognition.continuous =
        false;

      recognition.interimResults =
        false;


      // Tamil voice recognition
      recognition.lang =
        "ta-IN";


      recognition.onstart =
        function() {

          micButton.classList.add(
            "listening"
          );

          micButton.textContent =
            "🔴";

          status.textContent =
            "🎤 Listening...";

        };


      recognition.onresult =
        function(event) {

          const transcript =
            event.results[0][0].transcript;

          input.value =
            transcript;

          status.textContent =
            "● Online";

          status.style.color =
            "#86efac";


          // Automatically send
          sendMessage();

        };


      recognition.onerror =
        function(event) {

          console.error(
            "Speech error:",
            event.error
          );

          status.textContent =
            "🎤 Mic error";

          status.style.color =
            "#fca5a5";
        };


      recognition.onend =
        function() {

          micButton.classList.remove(
            "listening"
          );

          micButton.textContent =
            "🎤";

          status.textContent =
            "● Online";

          status.style.color =
            "#86efac";
        };


      micButton.addEventListener(
        "click",
        function() {

          try {

            recognition.start();

          } catch (error) {

            console.error(error);

          }

        }
      );


    } else {

      micButton.disabled =
        true;

      micButton.title =
        "Speech recognition is not supported in this browser";

    }


    // -----------------------------
    // VOICE OUTPUT
    // -----------------------------

    function speakText(text) {

      if (
        !("speechSynthesis" in window)
      ) {

        console.log(
          "Speech synthesis not supported"
        );

        return;
      }


      window.speechSynthesis.cancel();


      const utterance =
        new SpeechSynthesisUtterance(
          text
        );


      // Tamil voice
      utterance.lang =
        "ta-IN";

      utterance.rate =
        1;

      utterance.pitch =
        1;

      utterance.volume =
        1;


      window.speechSynthesis.speak(
        utterance
      );
    }


    speakButton.addEventListener(
      "click",
      function() {

        if (lastAnswer) {

          speakText(
            lastAnswer
          );

        }

      }
    );


    // -----------------------------
    // START
    // -----------------------------

    checkBackend();

  </script>

</body>
</html>
