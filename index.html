<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Voice Assistant</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #111827, #312e81);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app {
            width: 100%;
            max-width: 650px;
            height: 700px;
            background: #ffffff;
            border-radius: 25px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0,0,0,0.35);
        }

        .header {
            padding: 20px;
            background: #4f46e5;
            color: white;
            text-align: center;
        }

        .header h1 {
            font-size: 25px;
        }

        .header p {
            margin-top: 5px;
            opacity: 0.8;
        }

        #chat {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8fafc;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            margin-bottom: 12px;
            border-radius: 16px;
            line-height: 1.5;
        }

        .ai {
            background: #e5e7eb;
            color: #111827;
        }

        .user {
            background: #4f46e5;
            color: white;
            margin-left: auto;
        }

        .bottom {
            padding: 15px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #ddd;
            background: white;
        }

        #messageInput {
            flex: 1;
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 15px;
            outline: none;
            font-size: 16px;
        }

        button {
            border: none;
            border-radius: 15px;
            padding: 12px 16px;
            cursor: pointer;
            font-size: 18px;
            background: #4f46e5;
            color: white;
        }

        button:hover {
            transform: scale(1.05);
        }

        #micButton {
            background: #ef4444;
        }
    </style>
</head>

<body>

<div class="app">

    <div class="header">
        <h1>🤖 AI Voice Assistant</h1>
        <p>Your personal AI assistant</p>
    </div>

    <div id="chat">
        <div class="message ai">
            Hello! 👋 I'm your AI assistant.
        </div>
    </div>

    <div class="bottom">

        <input
            type="text"
            id="messageInput"
            placeholder="Type your message..."
        >

        <button onclick="sendMessage()">
            ➤
        </button>

        <button id="micButton" onclick="startVoice()">
            🎤
        </button>

    </div>

</div>

<script>

function sendMessage() {

    const input = document.getElementById("messageInput");
    const text = input.value.trim();

    if (text === "") {
        return;
    }

    addMessage(text, "user");

    input.value = "";

    setTimeout(function() {
        addMessage(
            "I received your message! 🤖 Real AI will be connected next.",
            "ai"
        );
    }, 500);
}


function addMessage(text, type) {

    const chat = document.getElementById("chat");

    const message = document.createElement("div");

    message.className = "message " + type;

    message.textContent = text;

    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;
}


function startVoice() {

    if (!("webkitSpeechRecognition" in window)) {

        alert(
            "Voice input is not supported in this browser."
        );

        return;
    }

    const recognition =
        new webkitSpeechRecognition();

    recognition.lang = "en-IN";

    recognition.start();

    recognition.onresult = function(event) {

        const text =
            event.results[0][0].transcript;

        document.getElementById(
            "messageInput"
        ).value = text;

    };
}

</script>

</body>
</html>
