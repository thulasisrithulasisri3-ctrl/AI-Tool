<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Viggo AI</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<div class="app">

    <!-- ================= SIDEBAR ================= -->

    <aside
        class="sidebar"
        id="sidebar"
    >

        <!-- BRAND -->

        <div class="brand">

            <div class="brand-logo">
                V
            </div>

            <div class="brand-info">

                <div class="brand-name">
                    Viggo AI
                </div>

                <div class="brand-sub">
                    Your AI Assistant
                </div>

            </div>

            <button
                id="closeSidebar"
                class="mobile-close"
                type="button"
            >
                ×
            </button>

        </div>


        <!-- NEW CHAT -->

        <button
            id="newChatBtn"
            class="new-chat"
            type="button"
        >

            <span>＋</span>

            <span>
                New Chat
            </span>

        </button>


        <!-- RECENT -->

        <div class="recent-title">

            <span>
                Recent
            </span>

            <span id="recentCount">
                0
            </span>

        </div>


        <div
            id="recentList"
            class="recent-list"
        ></div>


        <!-- SIDEBAR MORE -->

        <div class="sidebar-bottom">

            <button
                id="moreBtn"
                class="more-btn"
                type="button"
            >

                <span>
                    ⋯
                </span>

                <span>
                    More
                </span>

            </button>


            <!-- MORE MENU -->

            <div
                id="moreMenu"
                class="side-menu"
            >

                <button
                    id="languageBtn"
                    type="button"
                >
                    🌐 Language
                </button>

                <button
                    id="voiceBtn"
                    type="button"
                >
                    🎤 Voice
                </button>

                <button
                    id="deleteBtn"
                    type="button"
                >
                    🗑 Delete Chat
                </button>

            </div>

        </div>

    </aside>


    <!-- ================= MAIN ================= -->

    <main class="main">


        <!-- HEADER -->

        <header class="header">

            <div class="header-left">

                <button
                    id="menuBtn"
                    class="menu-btn"
                    type="button"
                >
                    ☰
                </button>


                <div class="header-info">

                    <div class="header-title">
                        Viggo AI
                    </div>

                    <div class="online">

                        <span></span>

                        Online

                    </div>

                </div>

            </div>


            <!-- SHARE CHAT -->

            <button
                id="shareChatBtn"
                class="header-share"
                type="button"
            >
                🔗 Share
            </button>

        </header>


        <!-- ================= CHAT AREA ================= -->

        <section
            id="chatArea"
            class="chat-area"
        >

            <!-- WELCOME -->

            <div
                id="welcome"
                class="welcome"
            >

                <div class="welcome-logo">
                    V
                </div>

                <h1>
                    Hello! I'm Viggo AI
                </h1>

                <p>
                    Your friendly AI assistant.
                    Ask me anything.
                </p>

            </div>

        </section>


        <!-- ================= MESSAGE INPUT ================= -->

        <div class="input-area">

            <div class="input-box">


                <!-- PLUS -->

                <button
                    id="plusBtn"
                    class="input-button"
                    type="button"
                    title="Attach"
                >
                    ＋
                </button>


                <!-- MESSAGE -->

                <textarea
                    id="messageInput"
                    rows="1"
                    placeholder="Message Viggo AI..."
                ></textarea>


                <!-- VOICE -->

                <button
                    id="voiceInputBtn"
                    class="input-button"
                    type="button"
                    title="Voice"
                >
                    🎤
                </button>


                <!-- SEND -->

                <button
                    id="sendBtn"
                    class="send-button"
                    type="button"
                    title="Send"
                >
                    ➤
                </button>

            </div>


            <div class="input-note">
                Viggo AI can make mistakes.
                Check important information.
            </div>

        </div>

    </main>

</div>


<!-- ==================================================
     PLUS MENU
================================================== -->

<div
    id="plusMenu"
    class="popup plus-menu"
>

    <button
        id="photoBtn"
        type="button"
    >
        📷 Photos
    </button>

    <button
        id="videoBtn"
        type="button"
    >
        🎥 Videos
    </button>

    <button
        id="fileBtn"
        type="button"
    >
        📎 Files
    </button>

</div>


<!-- ==================================================
     LANGUAGE MENU
================================================== -->

<div
    id="languageMenu"
    class="popup language-menu"
>

    <div class="popup-title">
        🌐 Language
    </div>


    <button
        type="button"
        data-language="en"
    >
        English
    </button>


    <button
        type="button"
        data-language="ta"
    >
        தமிழ்
    </button>


    <button
        type="button"
        data-language="hi"
    >
        हिन्दी
    </button>


    <button
        type="button"
        data-language="ml"
    >
        മലയാളം
    </button>


    <button
        type="button"
        data-language="te"
    >
        తెలుగు
    </button>


    <button
        type="button"
        data-language="kn"
    >
        ಕನ್ನಡ
    </button>


    <!-- MORE LANGUAGES -->

    <button
        id="moreLanguageBtn"
        type="button"
    >
        ＋ More Languages
    </button>


    <div
        id="moreLanguages"
        class="more-languages"
    >

        <button
            type="button"
            data-language="bn"
        >
            Bengali
        </button>

        <button
            type="button"
            data-language="mr"
        >
            Marathi
        </button>

        <button
            type="button"
            data-language="gu"
        >
            Gujarati
        </button>

        <button
            type="button"
            data-language="pa"
        >
            Punjabi
        </button>

        <button
            type="button"
            data-language="ur"
        >
            Urdu
        </button>

        <button
            type="button"
            data-language="es"
        >
            Spanish
        </button>

        <button
            type="button"
            data-language="fr"
        >
            French
        </button>

        <button
            type="button"
            data-language="de"
        >
            German
        </button>

        <button
            type="button"
            data-language="ja"
        >
            Japanese
        </button>

        <button
            type="button"
            data-language="ko"
        >
            Korean
        </button>

        <button
            type="button"
            data-language="zh"
        >
            Chinese
        </button>

        <button
            type="button"
            data-language="ar"
        >
            Arabic
        </button>

    </div>

</div>


<!-- ==================================================
     VOICE MENU
================================================== -->

<div
    id="voiceMenu"
    class="popup voice-menu"
>

    <div class="popup-title">
        🎤 Voice
    </div>


    <button
        type="button"
        data-voice="female"
    >
        👩 Female
    </button>


    <button
        type="button"
        data-voice="male"
    >
        👨 Male
    </button>


    <div
        id="voiceStatus"
        class="voice-status"
    >
        👩 Female Voice selected
    </div>

</div>


<!-- ==================================================
     DELETE MENU
================================================== -->

<div
    id="deleteMenu"
    class="popup delete-menu"
>

    <div class="popup-title">
        🗑 Delete Chat
    </div>


    <!-- SELECTIVE DELETE -->

    <button
        id="selectDeleteBtn"
        type="button"
    >
        ☑ Select Chat
    </button>


    <!-- CLEAR ALL -->

    <button
        id="clearAllBtn"
        type="button"
    >
        🧹 Clear All Chats
    </button>

</div>


<!-- ==================================================
     FILE INPUTS
================================================== -->

<input
    id="photoInput"
    type="file"
    accept="image/*"
    multiple
    hidden
>


<input
    id="videoInput"
    type="file"
    accept="video/*"
    multiple
    hidden
>


<input
    id="fileInput"
    type="file"
    multiple
    hidden
>


<!-- ==================================================
     SHARE CHAT POPUP
================================================== -->

<div
    id="sharePopup"
    class="share-overlay"
>

    <div class="share-box">

        <h2>
            🔗 Share Chat
        </h2>


        <input
            id="shareLink"
            type="text"
            readonly
        >


        <button
            id="copyLinkBtn"
            type="button"
        >
            📋 Copy Link
        </button>


        <button
            id="nativeShareBtn"
            type="button"
        >
            ↗ Share
        </button>


        <button
            id="closeShareBtn"
            type="button"
        >
            Close
        </button>

    </div>

</div>


<!-- ================= JAVASCRIPT ================= -->

<script src="script.js"></script>

</body>

</html>
