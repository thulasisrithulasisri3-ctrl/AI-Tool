<!-- LANGUAGE MENU -->
<div class="language-menu" id="languageMenu">

    <button
        id="languageBtn"
        class="language-main-button"
        type="button"
    >
        🌐 Select Language
        <span>▸</span>
    </button>

    <div
        id="languageSubmenu"
        class="language-submenu"
    >

        <button
            type="button"
            data-language="en"
        >
            🇬🇧 English
        </button>

        <button
            type="button"
            data-language="ta"
        >
            🇮🇳 தமிழ்
        </button>

        <button
            type="button"
            data-language="hi"
        >
            🇮🇳 हिन्दी
        </button>

        <button
            type="button"
            data-language="ml"
        >
            🇮🇳 മലയാളം
        </button>

        <button
            type="button"
            data-language="te"
        >
            🇮🇳 తెలుగు
        </button>

        <button
            type="button"
            data-language="kn"
        >
            🇮🇳 ಕನ್ನಡ
        </button>

    </div>

</div>
