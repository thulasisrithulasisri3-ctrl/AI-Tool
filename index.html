<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viggo AI</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">

    <div class="sidebar-header">
      <h2>Viggo AI</h2>

      <button id="closeSidebar" class="icon-btn" title="Close">
        ✕
      </button>
    </div>

    <button id="newChat" class="new-chat">
      ＋ New Chat
    </button>

    <div class="search-box">
      🔎
      <input
        type="text"
        id="searchChat"
        placeholder="Search Chat"
      >
    </div>

    <div class="history-title">
      CHAT HISTORY
    </div>

    <div id="chatHistory" class="chat-history"></div>

    <!-- ONLY NEW MORE BUTTON -->
    <div class="sidebar-more">

      <button id="moreBtn" class="more-button">
        <span class="more-dots">⋮</span>
        <span>More</span>
      </button>

      <div id="moreMenu" class="more-menu">

        <button id="voiceMenuBtn">
          🎤 <span>Voice</span>
        </button>

        <button id="languageBtn">
          🌐 <span>Language</span>
        </button>

        <button id="clearChatBtn">
          🗑 <span>Clear Chat</span>
        </button>

        <button id="showHistoryBtn">
          🕘 <span>Show History</span>
        </button>

        <button id="savedChatsBtn">
          💾 <span>Saved Chats</span>
        </button>

        <button id="selectChatsBtn">
          ☑ <span>Select Chats</span>
        </button>

        <button id="deleteSelectedBtn">
          🗑 <span>Delete Selected</span>
        </button>

      </div>

    </div>

  </aside>


  <!-- MAIN -->
  <main class="main">

    <!-- TOP BAR -->
    <header class="topbar">

      <button id="openSidebar" class="menu-btn">
        ☰
      </button>

      <div class="brand">
        Viggo AI
      </div>

      <div class="top-actions">

        <button id="topMoreBtn" class="top-more-btn">
          ⋮
        </button>

        <div id="topMoreMenu" class="top-more-menu">

          <button id="topVoiceBtn">
            🎤 Voice
          </button>

          <button id="topLanguageBtn">
            🌐 Language
          </button>

          <button id="topClearBtn">
            🗑 Clear Chat
          </button>

          <button id="topHistoryBtn">
            🕘 Show History
          </button>

          <button id="topSavedBtn">
            💾 Saved Chats
          </button>

          <button id="topSelectBtn">
            ☑ Select Chats
          </button>

          <button id="topDeleteBtn">
            🗑 Delete Selected
          </button>

        </div>

      </div>

    </header>


    <!-- CHAT AREA -->
    <section id="chatArea" class="chat-area">

      <div id="conversation" class="conversation"></div>

    </section>


    <!-- INPUT AREA -->
    <div class="input-area">

      <button id="plusBtn" class="input-plus">
        ＋
      </button>

      <textarea
        id="message"
        rows="1"
        placeholder="Message Viggo AI..."
      ></textarea>

      <button id="mic" class="input-icon" title="Voice">
        🎤
      </button>

      <button id="send" class="send-btn" title="Send">
        ➤
      </button>

    </div>

  </main>


  <!-- PLUS MENU -->
  <div id="plusMenu" class="plus-menu">

    <button>
      📷 Photo
    </button>

    <button>
      🎥 Video
    </button>

    <button>
      📎 File
    </button>

    <button id="plusVoiceBtn">
      🎤 Voice
    </button>

  </div>


  <!-- VOICE MODAL -->
  <div id="voiceModal" class="modal">

    <div class="modal-box">

      <button class="modal-close" id="closeVoice">
        ✕
      </button>

      <h3>Voice Settings</h3>

      <label>
        Voice
      </label>

      <select id="voiceSelect">
        <option value="female">Female</option>
        <option value="male">Male</option>
      </select>

      <button id="voiceTest" class="modal-button">
        🔊 Test Voice
      </button>

    </div>

  </div>


  <!-- LANGUAGE MODAL -->
  <div id="languageModal" class="modal">

    <div class="modal-box">

      <button class="modal-close" id="closeLanguage">
        ✕
      </button>

      <h3>Language</h3>

      <select id="languageSelect">
        <option value="English">English</option>
        <option value="Tamil">தமிழ்</option>
        <option value="Hindi">हिन्दी</option>
        <option value="Malayalam">മലയാളം</option>
        <option value="Telugu">తెలుగు</option>
        <option value="Kannada">ಕನ್ನಡ</option>
      </select>

      <button id="saveLanguage" class="modal-button">
        Save
      </button>

    </div>

  </div>


  <script src="script.js"></script>

</body>
</html>
