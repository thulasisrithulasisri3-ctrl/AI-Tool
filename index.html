<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Viggo AI</title>

  <!-- CSS -->
  <link
    rel="stylesheet"
    href="style.css?v=100"
  >

</head>


<body>


  <!-- =========================================
       SIDEBAR
  ========================================== -->

  <aside
    class="sidebar"
    id="sidebar"
  >

    <div class="sidebar-header">

      <h2>Viggo AI</h2>

      <button
        id="closeSidebar"
        class="icon-btn"
      >
        ✕
      </button>

    </div>


    <button
      id="newChat"
      class="new-chat"
    >
      ＋ New Chat
    </button>


    <div class="search-box">

      🔎

      <input
        id="searchChat"
        type="text"
        placeholder="Search Chat"
      >

    </div>


    <div class="history-title">
      CHAT HISTORY
    </div>


    <div
      id="chatHistory"
      class="chat-history"
    ></div>


    <!-- MORE -->

    <div class="sidebar-more">

      <button
        id="moreBtn"
        class="more-button"
      >

        <span class="more-dots">
          ⋮
        </span>

        <span>
          More
        </span>

      </button>


      <div
        id="moreMenu"
        class="more-menu"
      >

        <button id="voiceMenuBtn">
          🎤 Voice
        </button>


        <button id="languageBtn">
          🌐 Language
        </button>


        <button id="clearChatBtn">
          🗑 Clear Chat
        </button>


        <button id="showHistoryBtn">
          🕘 Show History
        </button>


        <button id="savedChatsBtn">
          💾 Saved Chats
        </button>


        <button id="selectChatsBtn">
          ☑ Select Chats
        </button>


        <button id="deleteSelectedBtn">
          🗑 Delete Selected
        </button>

      </div>

    </div>

  </aside>



  <!-- =========================================
       MAIN
  ========================================== -->

  <main class="main">


    <!-- TOP BAR -->

    <header class="topbar">

      <div class="top-left">

        <button
          id="openSidebar"
          class="menu-btn"
        >
          ☰
        </button>


        <div class="brand">
          Viggo AI
        </div>

      </div>


      <!-- SHARE -->

      <button
        id="shareBtn"
        class="share-btn"
      >
        🔗 Share
      </button>

    </header>



    <!-- =======================================
         CHAT AREA
    ======================================== -->

    <section class="chat-area">

      <div
        id="conversation"
        class="conversation"
      ></div>

    </section>



    <!-- =======================================
         INPUT AREA
    ======================================== -->

    <div class="input-area">


      <!-- PLUS -->

      <button
        id="plusBtn"
        class="input-plus"
      >
        ＋
      </button>


      <!-- MESSAGE -->

      <textarea
        id="message"
        rows="1"
        placeholder="Message Viggo AI..."
      ></textarea>


      <!-- MICROPHONE -->

      <button
        id="mic"
        class="input-icon"
      >
        🎤
      </button>


      <!-- SEND -->

      <button
        id="send"
        class="send-btn"
      >
        ➤
      </button>

    </div>

  </main>



  <!-- =========================================
       PLUS MENU
  ========================================== -->

  <div
    id="plusMenu"
    class="plus-menu"
  >

    <button>
      📷 Photo
    </button>


    <button>
      🎥 Video
    </button>


    <button>
      📎 File
    </button>


    <button id="plusVoiceBtn">
      🎤 Voice
    </button>

  </div>



  <!-- =========================================
       VOICE MODAL
  ========================================== -->

  <div
    id="voiceModal"
    class="modal"
  >

    <div class="modal-box">


      <button
        id="closeVoice"
        class="modal-close"
      >
        ✕
      </button>


      <h3>
        Voice Settings
      </h3>


      <select id="voiceSelect">

        <option value="female">
          Female
        </option>

        <option value="male">
          Male
        </option>

      </select>


      <button
        id="voiceTest"
        class="modal-button"
      >
        🔊 Test Voice
      </button>

    </div>

  </div>



  <!-- =========================================
       LANGUAGE MODAL
  ========================================== -->

  <div
    id="languageModal"
    class="modal"
  >

    <div class="modal-box">


      <button
        id="closeLanguage"
        class="modal-close"
      >
        ✕
      </button>


      <h3>
        Language
      </h3>


      <select id="languageSelect">

        <option value="English">
          English
        </option>

        <option value="Tamil">
          தமிழ்
        </option>

        <option value="Hindi">
          हिन्दी
        </option>

        <option value="Malayalam">
          മലയാളം
        </option>

        <option value="Telugu">
          తెలుగు
        </option>

        <option value="Kannada">
          ಕನ್ನಡ
        </option>

      </select>


      <button
        id="saveLanguage"
        class="modal-button"
      >
        Save
      </button>

    </div>

  </div>



  <!-- =========================================
       SERVICE WORKER
  ========================================== -->

  <script>

    if ("serviceWorker" in navigator) {

      window.addEventListener(
        "load",
        () => {

          navigator.serviceWorker
            .register(
              "/AI-Tool/service-worker.js?v=100"
            )
            .then(
              registration => {

                console.log(
                  "Viggo Service Worker registered:",
                  registration.scope
                );

              }
            )
            .catch(
              error => {

                console.error(
                  "Service Worker error:",
                  error
                );

              }
            );

        }
      );

    }

  </script>



  <!-- =========================================
       MAIN SCRIPT
  ========================================== -->

  <script src="script.js?v=100"></script>


</body>

</html>
