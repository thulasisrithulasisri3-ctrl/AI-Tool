```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Viggo AI</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside
        class="sidebar"
        id="sidebar"
    >

        <!-- LOGO -->

        <div class="logo">

            <div class="logo-icon">
                V
            </div>

            <div class="logo-text">

                <strong>
                    Viggo
                </strong>

                <small>
                    AI Friend
                </small>

            </div>

        </div>


        <!-- NEW CHAT -->

        <button
            class="new-chat"
            id="newChatBtn"
            type="button"
        >
            ＋ New Chat
        </button>


        <!-- HISTORY -->

        <div
            class="history"
            id="historyList"
        ></div>


        <!-- MORE -->

        <div class="sidebar-more">

            <button
                class="more-button"
                id="moreBtn"
                type="button"
            >
                ⋮ More
            </button>


            <div
                class="more-menu"
                id="moreMenu"
            >

                <!-- SAVE -->

                <button
                    id="saveBtn"
                    type="button"
                >
                    💾 Save
                </button>


                <!-- SELECT -->

                <button
                    id="selectChatsBtn"
                    type="button"
                >
                    ☑ Select Chats
                </button>


                <!-- DELETE SELECTED -->

                <button
                    id="deleteSelectedBtn"
                    type="button"
                    class="danger-button"
                    style="display:none;"
                >
                    🗑 Delete Selected
                </button>


                <!-- CLEAR -->

                <button
                    id="clearHistoryBtn"
                    type="button"
                    class="danger-button"
                >
                    🗑 Clear History
                </button>


                <div class="menu-divider"></div>


                <!-- LANGUAGE -->

                <div class="language-title">
                    🌐 Select Language
                </div>


                <button
                    type="button"
                    data-language="en"
                >
                    🇬🇧 English
                </button>


                <button
                    type="button"
                    data-language="ta"
                >
                    🇮🇳 தமிழ்
                </button>


                <button
                    type="button"
                    data-language="hi"
                >
                    🇮🇳 हिन्दी
                </button>


                <button
                    type="button"
                    data-language="ml"
                >
                    🇮🇳 മലയാളം
                </button>


                <button
                    type="button"
                    data-language="te"
                >
                    🇮🇳 తెలుగు
                </button>


                <button
                    type="button"
                    data-language="kn"
                >
                    🇮🇳 ಕನ್ನಡ
                </button>


                <div class="menu-divider"></div>


                <!-- VOICE SETTINGS -->

                <button
                    id="voiceSettingsButton"
                    type="button"
                >
                    🔊 Voice Settings
                </button>


                <div
                    id="voiceSettingsPanel"
                    class="voice-settings-panel"
                >

                    <div class="voice-setting-title">
                        Voice
                    </div>


                    <button
                        id="femaleVoiceBtn"
                        class="voice-choice"
                        type="button"
                    >
                        👩 Female
                    </button>


                    <button
                        id="maleVoiceBtn"
                        class="voice-choice"
                        type="button"
                    >
                        👨 Male
                    </button>


                    <div
                        id="voiceLanguageStatus"
                        class="voice-language-status"
                    ></div>

                </div>

            </div>

        </div>

    </aside>


    <!-- =========================
         MAIN
    ========================== -->

    <main class="main">


        <!-- HEADER -->

        <header class="header">


            <button
                class="mobile-menu"
                id="mobileMenuBtn"
                type="button"
            >
                ☰
            </button>


            <div
                class="chat-title"
                id="chatTitle"
            >
                New Chat
            </div>


            <button
                class="share-btn"
                id="shareBtn"
                type="button"
            >
                ↗ Share
            </button>

        </header>


        <!-- MESSAGES -->

        <section
            class="messages"
            id="messages"
        ></section>


        <!-- INPUT -->

        <footer class="input-area">


            <div class="input-box">


                <input
                    type="text"
                    id="messageInput"
                    placeholder="Message Viggo..."
                    autocomplete="off"
                >


                <!-- VOICE INPUT -->

                <button
                    class="input-icon"
                    id="voiceBtn"
                    type="button"
                    title="Voice input"
                    aria-label="Voice input"
                >
                    🎤
                </button>


                <!-- SEND -->

                <button
                    class="send-btn"
                    id="sendBtn"
                    type="button"
                    title="Send"
                    aria-label="Send"
                >
                    ➤
                </button>

            </div>


            <div class="input-hint">
                Viggo AI can make mistakes. Check important information.
            </div>

        </footer>

    </main>


    <!-- TOAST -->

    <div
        id="viggoToast"
        class="toast"
    ></div>


    <script src="script.js"></script>

</body>

</html>
```
