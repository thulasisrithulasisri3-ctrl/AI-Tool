<!DOCTYPE html>
<html lang="en">

<head>

  <link rel="icon" type="image/png" href="icon.png?v=2">

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Viggo AI</title>

  <!-- Prevent favicon.ico 404 -->
  <link rel="icon" href="data:,">

  <link
    rel="stylesheet"
    href="style.css?v=4"
  >

</head>


<body>


  <!-- =========================================
       SIDEBAR
  ========================================== -->

  <aside
    class="sidebar"
    id="sidebar"
  >

    <div class="sidebar-header">

      <h2>
        Viggo AI
      </h2>

      <button
        id="closeSidebar"
        class="icon-btn"
        type="button"
      >
        ✕
      </button>

    </div>


    <!-- NEW CHAT -->

    <button
      id="newChat"
      class="new-chat"
      type="button"
    >
      ＋ New Chat
    </button>


    <!-- SEARCH -->

    <div class="search-box">

      🔎

      <input
        id="searchChat"
        type="text"
        placeholder="Search Chat"
        autocomplete="off"
      >

    </div>


    <!-- HISTORY TITLE -->

    <div class="history-title">
      CHAT HISTORY
    </div>


    <!-- CHAT HISTORY -->

    <div
      id="chatHistory"
      class="chat-history"
    ></div>


    <!-- MORE -->

    <div class="sidebar-more">

      <button
        id="moreBtn"
        class="more-button"
        type="button"
      >

        <span class="more-dots">
          ⋮
        </span>

        <span>
          More
        </span>

      </button>


      <!-- MORE MENU -->

      <div
        id="moreMenu"
        class="more-menu"
      >

        <button
          id="voiceMenuBtn"
          type="button"
        >
          🎤 Voice
        </button>


        <button
          id="languageBtn"
          type="button"
        >
          🌐 Language
        </button>


        <button
          id="clearChatBtn"
          type="button"
        >
          🗑 Clear Chat
        </button>


        <button
          id="showHistoryBtn"
          type="button"
        >
          🕘 Show History
        </button>


        <button
          id="savedChatsBtn"
          type="button"
        >
          💾 Saved Chats
        </button>


        <button
          id="selectChatsBtn"
          type="button"
        >
          ☑ Select Chats
        </button>


        <button
          id="deleteSelectedBtn"
          type="button"
        >
          🗑 Delete Selected
        </button>

      </div>

    </div>

  </aside>



  <!-- =========================================
       MAIN
  ========================================== -->

  <main class="main">


    <!-- TOP BAR -->

    <header class="topbar">

      <div class="top-left">

        <button
          id="openSidebar"
          class="menu-btn"
          type="button"
        >
          ☰
        </button>


        <div class="brand">
          Viggo AI
        </div>

      </div>


      <!-- SHARE -->

      <button
        id="shareBtn"
        class="share-btn"
        type="button"
      >
        🔗 Share
      </button>

    </header>



    <!-- =====================================
         CHAT AREA
    ====================================== -->

    <section class="chat-area">

      <div
        id="conversation"
        class="conversation"
      ></div>

    </section>



    <!-- =====================================
         INPUT AREA
    ====================================== -->

    <div class="input-area">


      <!-- PLUS -->

      <button
        id="plusBtn"
        class="input-plus"
        type="button"
      >
        ＋
      </button>


      <!-- MESSAGE -->

      <textarea
        id="message"
        rows="1"
        placeholder="Message Viggo AI..."
        autocomplete="off"
      ></textarea>


      <!-- MICROPHONE -->

      <button
        id="mic"
        class="input-icon"
        type="button"
        title="Voice input"
      >
        🎤
      </button>


      <!-- SEND -->

      <button
        id="send"
        class="send-btn"
        type="button"
        title="Send"
      >
        ➤
      </button>

    </div>

  </main>



  <!-- =========================================
       PLUS MENU
  ========================================== -->

  <div
    id="plusMenu"
    class="plus-menu"
  >

    <!-- PHOTO -->

    <button
      type="button"
      data-action="photo"
    >
      📷 Photo
    </button>


    <!-- VIDEO -->

    <button
      type="button"
      data-action="video"
    >
      🎥 Video
    </button>


    <!-- FILE -->

    <button
      type="button"
      data-action="file"
    >
      📎 File
    </button>


    <!-- VOICE -->

    <button
      id="plusVoiceBtn"
      type="button"
      data-action="voice"
    >
      🎤 Voice
    </button>

  </div>



  <!-- =========================================
       VOICE MODAL
  ========================================== -->

  <div
    id="voiceModal"
    class="modal"
  >

    <div class="modal-box">


      <button
        id="closeVoice"
        class="modal-close"
        type="button"
      >
        ✕
      </button>


      <h3>
        Voice Settings
      </h3>


      <select id="voiceSelect">

        <option value="female">
          Female
        </option>

        <option value="male">
          Male
        </option>

      </select>


      <button
        id="voiceTest"
        class="modal-button"
        type="button"
      >
        🔊 Test Voice
      </button>

    </div>

  </div>



  <!-- =========================================
       LANGUAGE MODAL
  ========================================== -->

  <div
    id="languageModal"
    class="modal"
  >

    <div class="modal-box">


      <button
        id="closeLanguage"
        class="modal-close"
        type="button"
      >
        ✕
      </button>


      <h3>
        Language
      </h3>


      <select id="languageSelect">

        <option value="English">
          English
        </option>

        <option value="Tamil">
          தமிழ்
        </option>

        <option value="Hindi">
          हिन्दी
        </option>

        <option value="Malayalam">
          മലയാളം
        </option>

        <option value="Telugu">
          తెలుగు
        </option>

        <option value="Kannada">
          ಕನ್ನಡ
        </option>

      </select>


      <button
        id="saveLanguage"
        class="modal-button"
        type="button"
      >
        Save
      </button>

    </div>

  </div>



  <!-- =========================================
       SERVICE WORKER
  ========================================== -->




  <!-- =========================================
       VIGGO SCRIPT
  ========================================== -->

  <script src="script.js?v=4"></script>


</body>

</html>
