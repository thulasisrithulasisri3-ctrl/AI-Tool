<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viggo AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0d0f12;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation Header */
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      background-color: #0d0f12;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .header-title {
      font-size: 14px;
      font-weight: 500;
      color: #e0e0e0;
    }

    /* Combined Action Buttons Layout */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Shared styling for Header Buttons */
    .btn-action {
      background-color: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #ffffff;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .btn-action:hover {
      background-color: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .share-btn {
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 500;
      gap: 6px;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      padding: 6px;
    }

    /* Main Container */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .brand-icon {
      width: 64px;
      height: 64px;
      background-color: #2563eb;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 16px;
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.3);
    }

    .brand-title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .brand-subtitle {
      color: #9ca3af;
      font-size: 14px;
    }

    /* Input Footer Area */
    .chat-input-container {
      width: 100%;
      max-width: 768px;
      padding: 20px;
      margin: 0 auto;
    }

    .chat-input-wrapper {
      background-color: #1a1d24;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      display: flex;
      align-items: center;
      padding: 8px 16px;
    }

    .chat-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #ffffff;
      padding: 8px;
      font-size: 14px;
      outline: none;
    }

    .chat-input::placeholder {
      color: #6b7280;
    }

    .input-btn {
      background-color: #2563eb;
      border: none;
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      margin-left: 8px;
    }
  </style>
</head>
<body>

  <!-- Top Header Bar -->
  <header class="top-header">
    <div class="header-title">New Chat</div>
    
    <!-- Unified Header Actions Container -->
    <div class="header-actions">
      <!-- Three-Dot Button Moved Right Beside Share -->
      <button class="btn-action icon-btn" id="optionsBtn" aria-label="Options">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="5" r="2"/>
          <circle cx="12" cy="12" r="2"/>
          <circle cx="12" cy="19" r="2"/>
        </svg>
      </button>

      <!-- Share Button -->
      <button class="btn-action share-btn" id="shareBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
          <polyline points="16 6 12 2 8 6"></polyline>
          <line x1="12" y1="2" x2="12" y2="15"></line>
        </svg>
        Share
      </button>
    </div>
  </header>

  <!-- Main Display -->
  <main class="main-content">
    <div class="brand-icon">B</div>
    <h1 class="brand-title">Viggo</h1>
    <p class="brand-subtitle">Your AI friend is ready.</p>
  </main>

  <!-- Chat Input Footer -->
  <div class="chat-input-container">
    <div class="chat-input-wrapper">
      <input type="text" class="chat-input" placeholder="Message Viggo..." />
      <button class="input-btn" aria-label="Send Message">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
    // Event listener attached for interaction functionality
    document.getElementById('shareBtn').addEventListener('click', () => {
      alert('Share menu opened!');
    });

    document.getElementById('optionsBtn').addEventListener('click', () => {
      alert('More options menu opened!');
    });
  </script>
</body>
</html>
