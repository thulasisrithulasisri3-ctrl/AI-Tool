<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viggo AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<aside class="sidebar" id="sidebar">

    <div class="logo">
        <div class="logo-icon">V</div>
        <div class="logo-text">
            <strong>Viggo</strong>
            <small>AI Friend</small>
        </div>
    </div>

    <button class="new-chat" id="newChatBtn">
        ＋ New Chat
    </button>

    <div class="history" id="historyList"></div>

    <div class="sidebar-more">

        <button class="more-button" id="moreBtn">
            ⋮ More
        </button>

        <div class="more-menu" id="moreMenu">

            <button id="saveBtn">💾 Save</button>

            <button id="selectChatsBtn">
                ☑ Select Chats
            </button>

            <button
                id="deleteSelectedBtn"
                class="danger-button"
                style="display:none;"
            >
                🗑 Delete Selected
            </button>

            <button
                id="clearHistoryBtn"
                class="danger-button"
            >
                🗑 Clear History
            </button>

            <div class="menu-divider"></div>

            <div class="language-title">
                🌐 Select Language
            </div>

            <button data-language="en">🇬🇧 English</button>
            <button data-language="ta">🇮🇳 தமிழ்</button>
            <button data-language="hi">🇮🇳 हिन्दी</button>
            <button data-language="ml">🇮🇳 മലയാളം</button>
            <button data-language="te">🇮🇳 తెలుగు</button>
            <button data-language="kn">🇮🇳 ಕನ್ನಡ</button>

        </div>
    </div>

</aside>


<main class="main">

    <header class="header">

        <button
            class="mobile-menu"
            id="mobileMenuBtn"
        >
            ☰
        </button>

        <div
            class="chat-title"
            id="chatTitle"
        >
            New Chat
        </div>

        <button
            class="share-btn"
            id="shareBtn"
        >
            ↗ Share
        </button>

    </header>


    <section
        class="messages"
        id="messages"
    ></section>


    <footer class="input-area">

        <div class="input-box">

            <input
                type="text"
                id="messageInput"
                placeholder="Message Viggo..."
                autocomplete="off"
            >

            <button
                id="voiceBtn"
                class="input-icon"
                title="Voice"
            >
                🎤
            </button>

            <button
                id="sendBtn"
                class="send-btn"
                title="Send"
            >
                ➤
            </button>

        </div>

        <div class="input-hint">
            Viggo AI can make mistakes. Check important information.
        </div>

    </footer>

</main>


<div id="viggoToast" class="toast"></div>

<script src="script.js"></script>

</body>
</html
