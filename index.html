<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Viggo AI Assistant</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #111827;
    }

    body {
      overflow: hidden;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    /* =========================
       APP
    ========================= */

    .app {
      display: flex;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
      width: 280px;
      height: 100%;
      background: #f7f7f8;
      border-right: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-top {
      padding: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding: 5px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: #111827;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .brand-name {
      font-size: 20px;
      font-weight: 700;
    }

    .new-chat {
      width: 100%;
      border: 1px solid #d1d5db;
      background: white;
      color: #111827;
      border-radius: 10px;
      padding: 11px 13px;
      text-align: left;
      font-size: 15px;
      font-weight: 600;
    }

    .new-chat:hover {
      background: #eeeeef;
    }

    /* =========================
       SIDEBAR CONTENT
    ========================= */

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .section-title {
      padding: 8px 9px;
      color: #6b7280;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .chat-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .chat-item {
      width: 100%;
      border: none;
      background: transparent;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      text-align: left;
      color: #374151;
      font-size: 14px;
    }

    .chat-item:hover {
      background: #e9e9eb;
    }

    .chat-item.active {
      background: #e5e7eb;
      color: #111827;
      font-weight: 600;
    }

    .chat-item-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pin-icon {
      font-size: 12px;
    }

    .empty-sidebar {
      color: #9ca3af;
      font-size: 13px;
      padding: 10px;
    }

    /* =========================
       SIDEBAR BOTTOM
    ========================= */

    .sidebar-bottom {
      padding: 12px;
      border-top: 1px solid #e5e7eb;
    }

    .sidebar-bottom button {
      width: 100%;
      border: none;
      background: transparent;
      padding: 10px;
      border-radius: 8px;
      text-align: left;
    }

    .sidebar-bottom button:hover {
      background: #e9e9eb;
    }

    /* =========================
       MAIN
    ========================= */

    .main {
      flex: 1;
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: white;
    }

    /* =========================
       TOP BAR
    ========================= */

    .topbar {
      height: 60px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      flex-shrink: 0;
    }

    .mobile-menu {
      display: none;
      border: none;
      background: transparent;
      font-size: 22px;
      padding: 5px;
    }

    .current-title {
      flex: 1;
      font-weight: 600;
      font-size: 16px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .top-actions {
      display: flex;
      gap: 5px;
    }

    .top-actions button {
      border: none;
      background: transparent;
      border-radius: 8px;
      padding: 8px;
      font-size: 18px;
    }

    .top-actions button:hover {
      background: #f3f4f6;
    }

    /* =========================
       CHAT AREA
    ========================= */

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 25px 15px 30px;
    }

    .conversation {
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
    }

    .welcome {
      min-height: 65vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .welcome-box {
      max-width: 550px;
    }

    .welcome-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .welcome h1 {
      margin: 0 0 10px;
      font-size: 32px;
    }

    .welcome p {
      margin: 0;
      color: #6b7280;
      font-size: 16px;
    }

    /* =========================
       MESSAGE
    ========================= */

    .message {
      display: flex;
      gap: 12px;
      margin: 20px 0;
      width: 100%;
    }

    .message.user {
      justify-content: flex-end;
    }

    .message-avatar {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 17px;
    }

    .message.ai .message-avatar {
      background: #111827;
      color: white;
      order: 0;
    }

    .message.user .message-avatar {
      background: #2563eb;
      color: white;
      order: 2;
    }

    .message-content {
      max-width: min(75%, 700px);
    }

    .message-name {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .message-text {
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 15px;
    }

    .message.user .message-content {
      background: #2563eb;
      color: white;
      padding: 10px 14px;
      border-radius: 15px;
    }

    .message.user .message-name {
      display: none;
    }

    .message.ai .message-text {
      color: #111827;
    }

    /* =========================
       INPUT
    ========================= */

    .input-wrapper {
      padding: 10px 15px 18px;
      background: white;
      flex-shrink: 0;
    }

    .input-box {
      width: 100%;
      max-width: 850px;
      margin: auto;
      border: 1px solid #d1d5db;
      border-radius: 16px;
      padding: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      background: white;
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 7px;
    }

    #message {
      flex: 1;
      min-height: 42px;
      max-height: 150px;
      resize: none;
      border: none;
      outline: none;
      padding: 10px 9px;
      font-size: 15px;
      font-family: inherit;
      background: transparent;
    }

    #message::placeholder {
      color: #9ca3af;
    }

    .input-button {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 11px;
      background: transparent;
      font-size: 19px;
      flex-shrink: 0;
    }

    .input-button:hover {
      background: #f3f4f6;
    }

    #mic.listening {
      background: #fee2e2;
      color: #dc2626;
    }

    #send {
      background: #111827;
      color: white;
    }

    #send:hover {
      background: #374151;
    }

    #send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .input-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 5px 0;
    }

    .voice-toggle {
      border: none;
      background: transparent;
      color: #6b7280;
      padding: 5px 7px;
      border-radius: 7px;
      font-size: 12px;
    }

    .voice-toggle:hover {
      background: #f3f4f6;
    }

    .voice-toggle.on {
      color: #16a34a;
    }

    .voice-toggle.off {
      color: #6b7280;
    }

    .input-hint {
      color: #9ca3af;
      font-size: 11px;
    }

    /* =========================
       HISTORY MENU
    ========================= */

    .history-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 1000;
    }

    .history-panel {
      position: absolute;
      right: 15px;
      top: 70px;
      width: 360px;
      max-width: calc(100vw - 30px);
      max-height: 75vh;
      overflow-y: auto;
      background: white;
      border-radius: 14px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.2);
      padding: 15px;
    }

    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .history-header h2 {
      margin: 0;
      font-size: 18px;
    }

    .close-history {
      border: none;
      background: #f3f4f6;
      border-radius: 8px;
      padding: 7px 10px;
    }

    .history-card {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 11px;
      margin-top: 8px;
    }

    .history-card.pinned {
      border-color: #facc15;
      background: #fffbeb;
    }

    .history-card-title {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .history-card-time {
      color: #9ca3af;
      font-size: 11px;
    }

    .history-card-actions {
      display: flex;
      gap: 7px;
      margin-top: 9px;
    }

    .history-card-actions button {
      border: none;
      border-radius: 7px;
      padding: 6px 9px;
      font-size: 12px;
    }

    .pin-button {
      background: #fef3c7;
    }

    .delete-button {
      background: #fee2e2;
      color: #dc2626;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      .sidebar {
        position: fixed;
        left: -290px;
        top: 0;
        bottom: 0;
        z-index: 2000;
        transition: left 0.2s ease;
      }

      .sidebar.open {
        left: 0;
      }

      .mobile-menu {
        display: block;
      }

      .message-content {
        max-width: 82%;
      }

      .input-hint {
        display: none;
      }

    }
  </style>
</head>

<body>

  <div class="app">

    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside
      class="sidebar"
      id="sidebar"
    >

      <div class="sidebar-top">

        <div class="brand">

          <div class="brand-icon">
            V
          </div>

          <div class="brand-name">
            Viggo
          </div>

        </div>


        <button
          class="new-chat"
          id="newChat"
          type="button"
        >
          ➕ New Chat
        </button>

      </div>


      <div class="sidebar-content">

        <div class="section-title">
          📌 Pinned
        </div>

        <div
          class="chat-list"
          id="pinnedList"
        >
        </div>


        <div class="section-title">
          🕘 Recent
        </div>

        <div
          class="chat-list"
          id="recentList"
        >
        </div>

      </div>


      <div class="sidebar-bottom">

        <button
          id="clearHistory"
          type="button"
        >
          🗑️ Clear History
        </button>

      </div>

    </aside>


    <!-- =========================
         MAIN
    ========================== -->

    <main class="main">

      <!-- TOP BAR -->

      <div class="topbar">

        <button
          class="mobile-menu"
          id="mobileMenu"
          type="button"
        >
          ☰
        </button>


        <div
          class="current-title"
          id="currentTitle"
        >
          New Chat
        </div>


        <div class="top-actions">

          <button
            id="saveButton"
            type="button"
            title="Save"
          >
            💾
          </button>


          <button
            id="historyButton"
            type="button"
            title="History"
          >
            📜
          </button>

        </div>

      </div>


      <!-- CHAT -->

      <div
        class="chat-area"
        id="chatArea"
      >

        <div
          class="conversation"
          id="conversation"
        >

          <div
            class="welcome"
            id="welcome"
          >

            <div class="welcome-box">

              <div class="welcome-icon">
                🤖
              </div>

              <h1>
                Welcome to Viggo
              </h1>

              <p>
                Your AI assistant. Start a new conversation.
              </p>

            </div>

          </div>

        </div>

      </div>


      <!-- INPUT -->

      <div class="input-wrapper">

        <div class="input-box">

          <div class="input-row">

            <button
              class="input-button"
              id="mic"
              type="button"
              title="Microphone"
            >
              🎤
            </button>


            <textarea
              id="message"
              rows="1"
              placeholder="Message Viggo..."
              autocomplete="off"
            ></textarea>


            <button
              class="input-button"
              id="send"
              type="button"
              title="Send"
            >
              ➤
            </button>

          </div>


          <div class="input-footer">

            <button
              class="voice-toggle on"
              id="voiceToggle"
              type="button"
            >
              🔊 Voice ON
            </button>


            <div class="input-hint">
              Enter to send · Shift + Enter for new line
            </div>

          </div>

        </div>

      </div>

    </main>

  </div>


  <!-- =========================
       HISTORY MODAL
  ========================== -->

  <div
    class="history-modal"
    id="historyModal"
  >

    <div
      class="history-panel"
      id="historyPanel"
    >

      <div class="history-header">

        <h2>
          📜 History
        </h2>

        <button
          class="close-history"
          id="closeHistory"
          type="button"
        >
          ✕
        </button>

      </div>


      <div id="historyList">
      </div>

    </div>

  </div>


  <script src="./script.js"></script>

</body>
</html>
