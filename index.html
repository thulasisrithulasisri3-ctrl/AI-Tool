</head>

<body>

                class="sidebar-btn"
                id="selectChatsBtn">

                id="deleteSelectedBtn"

                type="button"
                class="sidebar-btn"

            </button>
        </div>

    <!-- ================= MAIN ================= -->
    <main class="main">

        <!-- HEADER -->
        <header class="topbar">

                    ⋮

            </div>

        </header>


        <!-- ================= MESSAGES ================= -->
        <section
            class="messages"
            id="messages">

            <div class="welcome">

                <div class="big-logo">V</div>

                <h1>Viggo</h1>

                <p>
                    Your AI friend is ready.
                </p>

            </div>

        </section>


        <!-- ================= INPUT AREA ================= -->
        <div class="input-area">

            <div class="input-box">

                <!-- PLUS BUTTON -->
                <button
                    type="button"
                    class="input-icon"
                    id="plusBtn"
                    title="Attach">

                    ＋

                </button>

                <!-- ATTACHMENT MENU -->
                <div
                    class="attachment-menu"
                    id="attachmentMenu">

                    <button
                        type="button"
                        class="attachment-item"

                        📷

                    </button>

                    <button
                        type="button"
                        class="attachment-item"
                        id="videoBtn">

                        🎥
                        <span>Video</span>

                    </button>

                    <button
                        type="button"
                        class="attachment-item"
                        id="fileBtn">

                        📎
                        <span>File</span>

                    </button>

                </div>


                <!-- HIDDEN FILE INPUTS -->
                <input
                    type="file"
                    id="photoInput"
                    accept="image/*"
                    hidden>

                <input
                    type="file"
                    id="videoInput"
                    accept="video/*"
                    hidden>

                <input
                    type="file"
                    id="fileInput"
                    accept="*/*"
                    hidden>


                <!-- TEXT -->
                <textarea
                    id="messageInput"
                    placeholder="Message Viggo..."
                    rows="1"></textarea>


                <!-- VOICE -->
                <button
                    type="button"
                    class="input-icon"
                    id="voiceBtn"
                    title="Voice">

                    🎙️

                </button>


                <!-- SEND -->
                <button
                    type="button"
                    class="send-btn"
                    id="sendBtn"
                    title="Send">

                    ➤

                </button>

            </div>

            <div
                class="attachment-status"
                id="attachmentStatus">
            </div>

            <div class="input-note">
                Viggo AI can make mistakes. Check important information.
            </div>

        </div>

    </main>


    <!-- ================= MORE MENU ================= -->
    <div
        class="more-menu"
        id="moreMenu">

        <button
            type="button"
            id="saveBtn">
            💾 Save Chat
        </button>

        <button
            type="button"
            data-language="en">
            🇬🇧 English
        </button>

        <button
            type="button"
            data-language="ta">
            தமிழ்
        </button>

        <button
            type="button"
            data-language="hi">
            हिन्दी
        </button>

        <button
            type="button"
            data-language="ml">
            മലയാളം
        </button>

        <button

            తెలుగు
        </button>

        <button

            data-language="kn">
            ಕನ್ನಡ
        </button>

    </div>


    <!-- ================= TOAST ================= -->
    <div
        class="toast"
        id="viggoToast">
    </div>


    <!-- ================= SCRIPT ================= -->
    <script src="script.js"></script>

    <script>

        /* =========================================
           PLUS / ATTACHMENT MENU
        ========================================= */

        const plusBtn =
            document.getElementById("plusBtn");

        const attachmentMenu =
            document.getElementById("attachmentMenu");

        const photoBtn =
            document.getElementById("photoBtn");

        const videoBtn =
            document.getElementById("videoBtn");

        const fileBtn =
            document.getElementById("fileBtn");

        const photoInput =
            document.getElementById("photoInput");

        const videoInput =
            document.getElementById("videoInput");

        const fileInput =
            document.getElementById("fileInput");

        const attachmentStatus =
            document.getElementById(
                "attachmentStatus"
            );


        plusBtn?.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();

                attachmentMenu?.classList.toggle(
                    "show"
                );

            }
        );


        photoBtn?.addEventListener(
            "click",
            function() {

                photoInput?.click();

                attachmentMenu?.classList.remove(
                    "show"
                );

            }
        );


        videoBtn?.addEventListener(
            "click",
            function() {

                videoInput?.click();

                attachmentMenu?.classList.remove(
                    "show"
                );

            }
        );


        fileBtn?.addEventListener(
            "click",
            function() {

                fileInput?.click();

                attachmentMenu?.classList.remove(
                    "show"
                );

            }
        );


        function showAttachment(
            input
        ) {

            const file =
                input?.files?.[0];

            if (!file)
                return;

            attachmentStatus.textContent =
                "📎 " + file.name;

        }


        photoInput?.addEventListener(
            "change",
            function() {

                showAttachment(
                    photoInput
                );

            }
        );


        videoInput?.addEventListener(
            "change",
            function() {

                showAttachment(
                    videoInput
                );

            }
        );


        fileInput?.addEventListener(
            "change",
            function() {

                showAttachment(
                    fileInput
                );

            }
        );


        /* CLOSE ATTACHMENT MENU */

        document.addEventListener(
            "click",
            function(event) {

                if (
                    !event.target.closest(
                        ".input-box"
                    )
                ) {

                    attachmentMenu?.classList.remove(
                        "show"
                    );

                }

            }
        );


        /* =========================================
           ENTER KEY
           Enter = Send
           Shift + Enter = New line
        ========================================= */

        const messageInput =
            document.getElementById(
                "messageInput"
            );


        messageInput?.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter" &&
                    !event.shiftKey &&
                    !event.isComposing
                ) {

                    event.preventDefault();

                    if (
                        typeof sendMessage ===
                        "function"
                    ) {

                        sendMessage();

                    }

                }

            }
        );


        /* =========================================
           SIDEBAR CLOSE
        ========================================= */

        document
            .getElementById("closeSidebarBtn")
            ?.addEventListener(
                "click",
                function(event) {

                    event.preventDefault();

                    event.stopPropagation();

                    if (
                        typeof closeSidebar ===
                        "function"
                    ) {

                        closeSidebar();

                    } else {

                        document
                            .getElementById(
                                "sidebar"
                            )
                            ?.classList
                            .remove("open");

                    }

                }
            );

    </script>

</body>
</html>
