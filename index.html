<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viggo AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar" id="sidebar">

        <div class="sidebar-header">
            <div class="brand">
                <div class="brand-icon">V</div>
                <span>Viggo AI</span>
            </div>

            <button class="icon-btn close-sidebar"
                    onclick="toggleSidebar()">
                ×
            </button>
        </div>


        <!-- NEW CHAT -->

        <button class="new-chat-btn"
                onclick="createNewChat()">
            <span>＋</span>
            <span>New Chat</span>
        </button>


        <!-- SEARCH -->

        <div class="search-area">
            <span>⌕</span>

            <input
                type="text"
                id="historySearch"
                placeholder="Search chats..."
                oninput="searchChats()"
            >
        </div>


        <!-- RECENT -->

        <div class="section-title">
            RECENT
        </div>

        <div class="history-list"
             id="historyList">
        </div>


        <!-- SIDEBAR BOTTOM -->

        <div class="sidebar-bottom">

            <button class="side-option"
                    onclick="showPinnedChats()">
                <span>📌</span>
                <span>Pinned Chats</span>
            </button>

            <button class="side-option"
                    onclick="showDeletedChats()">
                <span>🗑️</span>
                <span>Deleted Chats</span>
            </button>

            <button class="side-option"
                    onclick="openLanguageMenu()">
                <span>🌐</span>
                <span>Language</span>
            </button>

            <button class="side-option"
                    onclick="openVoiceMenu()">
                <span>🎤</span>
                <span>Voice</span>
            </button>

        </div>

    </aside>


    <!-- ================= MAIN ================= -->

    <main class="main">

        <!-- TOP BAR -->

        <header class="topbar">

            <button class="top-icon"
                    onclick="toggleSidebar()">
                ☰
            </button>

            <div class="top-title">
                Viggo AI
            </div>

            <button class="top-icon"
                    onclick="shareCurrentChat()"
                    title="Share">
                🔗
            </button>

            <button class="top-icon"
                    onclick="toggleMoreMenu()"
                    title="More">
                ⋮
            </button>

        </header>


        <!-- ================= MORE MENU ================= -->

        <div class="more-menu"
             id="moreMenu">

            <button onclick="openLanguageMenu()">
                <span>🌐</span>
                <span>Language</span>
            </button>

            <button onclick="openVoiceMenu()">
                <span>🎤</span>
                <span>Voice</span>
            </button>

            <button onclick="openDeleteMenu()">
                <span>🗑️</span>
                <span>Delete Options</span>
            </button>

        </div>


        <!-- ================= CHAT ================= -->

        <section class="chat-area"
                 id="chatArea">

            <div class="welcome"
                 id="welcome">

                <div class="welcome-logo">
                    V
                </div>

                <h1>
                    Welcome to Viggo AI
                </h1>

                <p>
                    Ask me anything. I'm here to help.
                </p>

            </div>

        </section>


        <!-- ================= INPUT ================= -->

        <div class="input-section">

            <div class="input-wrapper">


                <!-- PLUS MENU -->

                <div class="plus-menu"
                     id="plusMenu">

                    <button onclick="choosePhoto()">
                        <span>📷</span>
                        <span>Photos</span>
                    </button>

                    <button onclick="chooseVideo()">
                        <span>🎥</span>
                        <span>Videos</span>
                    </button>

                    <button onclick="chooseFile()">
                        <span>📎</span>
                        <span>Files</span>
                    </button>

                </div>


                <!-- TEXT INPUT -->

                <textarea
                    id="chatInput"
                    class="chat-input"
                    placeholder="Message Viggo AI..."
                    rows="1"
                ></textarea>


                <!-- PLUS -->

                <button
                    class="plus-button"
                    onclick="togglePlusMenu()"
                    title="Attach"
                >
                    ＋
                </button>


                <!-- RIGHT BUTTONS -->

                <div class="input-actions">

                    <button
                        class="voice-button"
                        onclick="openVoiceMenu()"
                        title="Voice"
                    >
                        🎤
                    </button>

                    <button
                        class="send-button"
                        onclick="sendMessage()"
                        title="Send"
                    >
                        ➤
                    </button>

                </div>


                <!-- FILE INPUTS -->

                <input
                    type="file"
                    id="photoInput"
                    accept="image/*"
                    hidden
                >

                <input
                    type="file"
                    id="videoInput"
                    accept="video/*"
                    hidden
                >

                <input
                    type="file"
                    id="fileInput"
                    hidden
                >

            </div>

        </div>

    </main>

</div>


<!-- ================= LANGUAGE MODAL ================= -->

<div class="overlay"
     id="languageOverlay"
     onclick="closePopups(event)">

    <div class="popup-box"
         onclick="event.stopPropagation()">

        <div class="popup-header">

            <h2>🌐 Language</h2>

            <button onclick="closeAllPopups()">
                ×
            </button>

        </div>


        <div class="language-grid"
             id="languageGrid">

            <button onclick="selectLanguage('English')">
                English
            </button>

            <button onclick="selectLanguage('தமிழ்')">
                தமிழ்
            </button>

            <button onclick="selectLanguage('हिन्दी')">
                हिन्दी
            </button>

            <button onclick="selectLanguage('తెలుగు')">
                తెలుగు
            </button>

            <button onclick="selectLanguage('ಕನ್ನಡ')">
                ಕನ್ನಡ
            </button>

            <button onclick="selectLanguage('മലയാളം')">
                മലയാളം
            </button>

            <button onclick="selectLanguage('বাংলা')">
                বাংলা
            </button>

            <button onclick="selectLanguage('मराठी')">
                मराठी
            </button>

            <button onclick="selectLanguage('ગુજરાતી')">
                ગુજરાતી
            </button>

            <button onclick="selectLanguage('ਪੰਜਾਬੀ')">
                ਪੰਜਾਬੀ
            </button>

            <button onclick="selectLanguage('اردو')">
                اردو
            </button>

            <button onclick="selectLanguage('Español')">
                Español
            </button>

            <button onclick="selectLanguage('Français')">
                Français
            </button>

            <button onclick="selectLanguage('Deutsch')">
                Deutsch
            </button>

            <button onclick="selectLanguage('Italiano')">
                Italiano
            </button>

            <button onclick="selectLanguage('Português')">
                Português
            </button>

            <button onclick="selectLanguage('日本語')">
                日本語
            </button>

            <button onclick="selectLanguage('한국어')">
                한국어
            </button>

            <button onclick="selectLanguage('中文')">
                中文
            </button>

            <button onclick="selectLanguage('العربية')">
                العربية
            </button>

        </div>

        <div class="selected-language"
             id="selectedLanguage">
            Selected: English
        </div>

    </div>

</div>


<!-- ================= VOICE MODAL ================= -->

<div class="overlay"
     id="voiceOverlay"
     onclick="closePopups(event)">

    <div class="popup-box small-popup"
         onclick="event.stopPropagation()">

        <div class="popup-header">

            <h2>🎤 Voice</h2>

            <button onclick="closeAllPopups()">
                ×
            </button>

        </div>


        <p class="popup-label">
            Select voice
        </p>


        <div class="voice-options">

            <button
                class="voice-option"
                onclick="selectVoice('Male')">

                <div class="voice-icon">
                    👨
                </div>

                <div>
                    <strong>Male</strong>
                    <small>Male voice</small>
                </div>

            </button>


            <button
                class="voice-option"
                onclick="selectVoice('Female')">

                <div class="voice-icon">
                    👩
                </div>

                <div>
                    <strong>Female</strong>
                    <small>Female voice</small>
                </div>

            </button>

        </div>


        <div class="selected-language"
             id="selectedVoice">
            Selected: Female
        </div>

    </div>

</div>


<!-- ================= DELETE MODAL ================= -->

<div class="overlay"
     id="deleteOverlay"
     onclick="closePopups(event)">

    <div class="popup-box small-popup"
         onclick="event.stopPropagation()">

        <div class="popup-header">

            <h2>🗑️ Delete Options</h2>

            <button onclick="closeAllPopups()">
                ×
            </button>

        </div>


        <button class="delete-option"
                onclick="clearCurrentChat()">

            💬 Clear Chat

        </button>


        <button class="delete-option"
                onclick="clearHistory()">

            🕘 Clear History

        </button>


        <button class="delete-option danger"
                onclick="deleteSelectedChat()">

            ❌ Delete Selected

        </button>

    </div>

</div>


<!-- ================= SCRIPT ================= -->

<script src="script.js"></script>

</body>
</html>
