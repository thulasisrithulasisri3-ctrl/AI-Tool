<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Viggo AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #080810;
      --sidebar: #0d0d17;
      --card: #151522;
      --border: rgba(255,255,255,.09);
      --text: #ffffff;
      --muted: #9292a6;
      --purple: #8b5cf6;
      --blue: #3b82f6;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 10%, rgba(139,92,246,.16), transparent 30%),
        radial-gradient(circle at 90% 90%, rgba(59,130,246,.12), transparent 30%),
        var(--bg);
    }

    button,
    textarea {
      font-family: inherit;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    /* SIDEBAR */

    #sidebar {
      width: 270px;
      height: 100vh;
      padding: 18px 15px;
      background: rgba(10,10,18,.94);
      border-right: 1px solid var(--border);
      backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 100;
    }

    .brand {
      padding: 8px 10px 22px;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .brand-text {
      background: linear-gradient(90deg,#fff,#bca8ff,#7db4ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #newChat,
    #historyButton,
    #saveButton,
    #voiceToggle,
    #clearHistory {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 11px 13px;
      cursor: pointer;
      font-size: 14px;
      transition: .2s;
    }

    #newChat {
      color: white;
      text-align: left;
      margin-bottom: 18px;
      background: linear-gradient(
        135deg,
        rgba(139,92,246,.25),
        rgba(59,130,246,.12)
      );
    }

    #historyButton,
    #voiceToggle {
      color: #ddd;
      background: rgba(255,255,255,.045);
    }

    #saveButton {
      color: white;
      background: linear-gradient(135deg,#8b5cf6,#6366f1);
      border: 0;
    }

    #clearHistory {
      color: #ff9999;
      background: rgba(239,68,68,.08);
    }

    #newChat:hover,
    #historyButton:hover,
    #saveButton:hover,
    #voiceToggle:hover,
    #clearHistory:hover {
      transform: translateY(-1px);
      border-color: rgba(139,92,246,.45);
    }

    .side-title {
      padding: 8px;
      color: #737386;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }

    .chat-list {
      overflow-y: auto;
      margin-bottom: 8px;
    }

    .chat-item {
      width: 100%;
      padding: 10px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: #ccc;
      cursor: pointer;
      text-align: left;
      margin-bottom: 3px;
    }

    .chat-item:hover,
    .chat-item.active {
      background: rgba(139,92,246,.12);
      color: white;
    }

    .chat-item-title {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .empty-sidebar {
      padding: 10px;
      color: #5f5f72;
      font-size: 12px;
    }

    .sidebar-bottom {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    /* MAIN */

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 64px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      background: rgba(8,8,16,.7);
      backdrop-filter: blur(20px);
    }

    #currentTitle {
      font-size: 15px;
      font-weight: bold;
    }

    .status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 7px;
      color: #9999aa;
      font-size: 12px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 10px #22c55e;
    }

    #mobileMenu {
      display: none;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.06);
      color: white;
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
    }

    /* CHAT */

    #chatArea {
      flex: 1;
      overflow-y: auto;
      padding: 25px;
    }

    #conversation {
      max-width: 900px;
      margin: auto;
    }

    /* WELCOME */

    .welcome {
      min-height: 65vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .welcome-box {
      width: 100%;
      max-width: 650px;
    }

    /* B LOGO */

    .ai-logo {
      width: 90px;
      height: 90px;
      margin: auto;
      border-radius: 28px;
      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 45px;
      font-weight: 900;

      color: white;

      background:
        linear-gradient(
          135deg,
          #8b5cf6,
          #6366f1,
          #3b82f6
        );

      box-shadow:
        0 0 35px rgba(139,92,246,.4),
        inset 0 0 20px rgba(255,255,255,.12);

      animation: floatLogo 4s ease-in-out infinite;
    }

    @keyframes floatLogo {
      0%,100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-7px);
      }
    }

    .welcome h1 {
      margin: 24px 0 10px;
      font-size: clamp(32px,5vw,48px);
      letter-spacing: -1.5px;

      background:
        linear-gradient(
          90deg,
          #fff,
          #bda9ff,
          #7db4ff
        );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .welcome p {
      margin: 0 0 25px;
      color: var(--muted);
      line-height: 1.6;
    }

    /* SUGGESTIONS */

    .suggestions {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 10px;
    }

    .suggestion {
      padding: 15px;
      text-align: left;
      border-radius: 15px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.035);
      color: white;
      cursor: pointer;
      transition: .2s;
    }

    .suggestion:hover {
      transform: translateY(-3px);
      background: rgba(139,92,246,.1);
      border-color: rgba(139,92,246,.35);
    }

    .suggestion strong {
      display: block;
      margin-bottom: 6px;
    }

    .suggestion span {
      color: #858598;
      font-size: 12px;
    }

    /* MESSAGES */

    .message {
      display: flex;
      gap: 12px;
      padding: 17px 13px;
      margin-bottom: 8px;
      border-radius: 17px;
      animation: messageIn .2s ease;
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(7px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      background: rgba(255,255,255,.035);
      border: 1px solid rgba(255,255,255,.04);
    }

    .message.ai {
      background: rgba(139,92,246,.035);
    }

    .message-avatar {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      border-radius: 11px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg,#8b5cf6,#3b82f6);
      color: white;
      font-weight: bold;
    }

    .message.user .message-avatar {
      background: #30303e;
    }

    .message-name {
      margin-bottom: 5px;
      font-size: 13px;
      font-weight: bold;
    }

    .message-text {
      white-space: pre-wrap;
      line-height: 1.7;
      color: #dddde8;
      font-size: 14px;
    }

    /* INPUT */

    .input-area {
      padding: 12px 20px 17px;
      background: rgba(8,8,16,.94);
    }

    .input-box {
      max-width: 900px;
      margin: auto;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 8px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 17px;
      background: rgba(20,20,33,.9);
      transition: .2s;
    }

    .input-box:focus-within {
      border-color: rgba(139,92,246,.6);
      box-shadow: 0 0 0 3px rgba(139,92,246,.08);
    }

    #message {
      flex: 1;
      min-height: 40px;
      max-height: 150px;
      resize: none;
      padding: 10px;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font-size: 15px;
    }

    #message::placeholder {
      color: #77778b;
    }

    #mic,
    #send {
      width: 44px;
      height: 42px;
      border: 0;
      border-radius: 11px;
      cursor: pointer;
      transition: .2s;
    }

    #mic {
      background: rgba(255,255,255,.07);
      color: white;
      font-size: 17px;
    }

    #mic.listening {
      background: rgba(239,68,68,.2);
    }

    #send {
      color: white;
      font-size: 18px;
      font-weight: bold;
      background: linear-gradient(135deg,#8b5cf6,#6366f1,#3b82f6);
    }

    #send:hover,
    #mic:hover {
      transform: translateY(-2px);
    }

    .input-hint {
      max-width: 900px;
      margin: 7px auto 0;
      text-align: center;
      color: #555568;
      font-size: 10px;
    }

    /* HISTORY */

    #historyModal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      padding: 25px;
      background: rgba(0,0,0,.7);
      backdrop-filter: blur(8px);
    }

    .history-window {
      max-width: 800px;
      max-height: 90vh;
      overflow-y: auto;
      margin: auto;
      padding: 20px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: #11111d;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .history-header h2 {
      margin: 0;
    }

    #closeHistory {
      border: 0;
      border-radius: 8px;
      padding: 8px 12px;
      background: rgba(255,255,255,.07);
      color: white;
      cursor: pointer;
    }

    .history-card {
      padding: 14px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: rgba(255,255,255,.035);
    }

    .history-card-title {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .history-card-time {
      color: #77778b;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .history-card-actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .history-card-actions button {
      border: 0;
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
      background: rgba(255,255,255,.07);
      color: white;
    }

    /* MOBILE */

    @media (max-width: 700px) {

      #sidebar {
        position: fixed;
        left: -285px;
        top: 0;
        bottom: 0;
        transition: left .25s;
      }

      #sidebar.open {
        left: 0;
      }

      #mobileMenu {
        display: block;
      }

      .topbar {
        padding: 0 12px;
      }

      #chatArea {
        padding: 12px;
      }

      .suggestions {
        grid-template-columns: 1fr;
      }

      .welcome {
        min-height: 70vh;
      }

      .welcome h1 {
        font-size: 34px;
      }

      .input-area {
        padding: 8px 10px 12px;
      }

      .input-hint {
        display: none;
      }

      #historyModal {
        padding: 10px;
      }
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,.12);
      border-radius: 10px;
    }
  </style>
</head>

<body>

<div class="app">

  <aside id="sidebar">

    <div class="brand">
      <div class="brand-text">Viggo</div>
    </div>

    <button id="newChat">
      ＋ &nbsp; New Chat
    </button>

    <div class="side-title">Pinned</div>

    <div id="pinnedList" class="chat-list">
      <div class="empty-sidebar">
        No pinned chats
      </div>
    </div>

    <div class="side-title">Recent</div>

    <div id="recentList" class="chat-list">
      <div class="empty-sidebar">
        No recent chats
      </div>
    </div>

    <div class="sidebar-bottom">

      <button id="historyButton">
        🕘 &nbsp; History
      </button>

      <button id="saveButton">
        💾 &nbsp; Save Chat
      </button>

      <button id="voiceToggle">
        🔊 &nbsp; Voice ON
      </button>

      <button id="clearHistory">
        🗑️ &nbsp; Clear History
      </button>

    </div>

  </aside>


  <main class="main">

    <header class="topbar">

      <button id="mobileMenu">☰</button>

      <div id="currentTitle">
        New Chat
      </div>

      <div class="status">
        <span class="status-dot"></span>
        Viggo Online
      </div>

    </header>


    <section id="chatArea">

      <div id="conversation">

        <div class="welcome">

          <div class="welcome-box">

            <!-- B LOGO -->
            <div class="ai-logo">B</div>

            <h1>
              What can I help you with?
            </h1>

            <p>
              Meet Viggo — your smart AI assistant
              for learning, coding, ideas and everyday tasks.
            </p>

            <div class="suggestions">

              <button
                class="suggestion"
                data-text="Explain this concept in simple words">

                <strong>🧠 Explain</strong>

                <span>
                  Understand difficult topics easily
                </span>

              </button>

              <button
                class="suggestion"
                data-text="Help me write a program">

                <strong>💻 Code</strong>

                <span>
                  Build and debug your projects
                </span>

              </button>

              <button
                class="suggestion"
                data-text="Give me creative ideas">

                <strong>💡 Create</strong>

                <span>
                  Generate fresh ideas
                </span>

              </button>

              <button
                class="suggestion"
                data-text="Teach me something interesting">

                <strong>🚀 Learn</strong>

                <span>
                  Learn something new
                </span>

              </button>

            </div>

          </div>

        </div>

      </div>

    </section>


    <footer class="input-area">

      <div class="input-box">

        <textarea
          id="message"
          placeholder="Message Viggo..."
          rows="1"></textarea>

        <button id="mic" title="Voice input">
          🎤
        </button>

        <button id="send" title="Send message">
          ➤
        </button>

      </div>

      <div class="input-hint">
        Enter to send • Shift + Enter for new line
      </div>

    </footer>

  </main>

</div>


<!-- HISTORY -->

<div id="historyModal">

  <div class="history-window">

    <div class="history-header">

      <h2>🕘 Chat History</h2>

      <button id="closeHistory">
        ✕
      </button>

    </div>

    <div id="historyList"></div>

  </div>

</div>


<script src="script.js"></script>

</body>
</html>
