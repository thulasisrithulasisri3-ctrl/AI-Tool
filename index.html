<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viggo AI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
}

body{
    background:#07101a;
    color:#fff;
    height:100vh;
    overflow:hidden;
}

.app{
    display:flex;
    height:100vh;
}

/* SIDEBAR */
.sidebar{
    width:260px;
    min-width:260px;
    height:100vh;
    background:#050b12;
    border-right:1px solid #1d354d;
    padding:18px;
    display:flex;
    flex-direction:column;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo-icon{
    width:42px;
    height:42px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#2695ff,#07559d);
    font-size:22px;
    font-weight:bold;
}

.logo-name{
    font-size:21px;
    font-weight:600;
}

.online{
    margin-left:52px;
    margin-top:5px;
    color:#48df89;
    font-size:11px;
}

.online-dot{
    display:inline-block;
    width:6px;
    height:6px;
    border-radius:50%;
    background:#35dc79;
    margin-right:5px;
}

.new-chat{
    width:100%;
    margin-top:25px;
    padding:11px;
    border-radius:10px;
    border:1px solid #1768ae;
    background:linear-gradient(135deg,#116fc4,#073d70);
    color:#fff;
    cursor:pointer;
    text-align:left;
    font-size:14px;
}

.new-chat:hover{
    background:#116eb8;
}

.section-title{
    margin-top:24px;
    margin-bottom:8px;
    color:#718ba5;
    font-size:11px;
    font-weight:bold;
    text-transform:uppercase;
}

.chat-list{
    display:flex;
    flex-direction:column;
    gap:4px;
    overflow-y:auto;
}

.chat-item{
    width:100%;
    padding:9px 10px;
    border:none;
    border-radius:8px;
    background:transparent;
    color:#d7e7f7;
    cursor:pointer;
    text-align:left;
    font-size:13px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.chat-item:hover{
    background:#102437;
}

.empty-list{
    padding:8px 10px;
    color:#557089;
    font-size:12px;
}

/* MORE */
.more-area{
    margin-top:auto;
    position:relative;
}

.more-button{
    width:100%;
    padding:11px;
    border-radius:10px;
    border:1px solid #284761;
    background:#0b1724;
    color:#dcecff;
    cursor:pointer;
    text-align:left;
    font-size:14px;
}

.more-button:hover{
    background:#10283c;
}

.more-menu{
    display:none;
    position:absolute;
    left:0;
    right:0;
    bottom:52px;
    padding:7px;
    background:#091522;
    border:1px solid #284b67;
    border-radius:12px;
    box-shadow:0 15px 40px rgba(0,0,0,.7);
    z-index:1000;
}

.more-menu.show{
    display:block;
}

.more-menu button{
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    background:transparent;
    color:#dcecff;
    cursor:pointer;
    text-align:left;
    font-size:13px;
}

.more-menu button:hover{
    background:#10304b;
}

/* MAIN */
.main{
    flex:1;
    min-width:0;
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* HEADER */
.top-header{
    height:60px;
    display:flex;
    align-items:center;
    padding:0 20px;
    background:#050b12;
    border-bottom:1px solid #1a3046;
}

.header-title{
    font-size:14px;
}

.share-button{
    margin-left:auto;
    padding:7px 14px;
    border-radius:8px;
    border:1px solid #216ca8;
    background:#0b3154;
    color:#fff;
    cursor:pointer;
}

.share-button:hover{
    background:#12517f;
}

/* CHAT */
.chat-area{
    flex:1;
    overflow-y:auto;
    padding:25px 20px;
}

.conversation{
    width:100%;
    max-width:850px;
    margin:auto;
}

.welcome{
    min-height:100%;
    padding-top:80px;
    text-align:center;
}

.welcome-icon{
    width:70px;
    height:70px;
    margin:auto;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#2695ff,#07559d);
    font-size:34px;
    font-weight:bold;
}

.welcome h1{
    margin-top:16px;
    font-size:28px;
}

.welcome p{
    margin-top:7px;
    color:#718ba5;
    font-size:14px;
}

/* MESSAGES */
.message{
    display:flex;
    gap:11px;
    margin-bottom:22px;
}

.avatar{
    width:36px;
    height:36px;
    min-width:36px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0c63a9;
    font-size:14px;
    font-weight:bold;
}

.user-avatar{
    background:#263a50;
}

.message-content{
    min-width:0;
}

.message-name{
    margin-bottom:5px;
    color:#6d9bc5;
    font-size:11px;
}

.message-text{
    color:#e7f1fa;
    font-size:14px;
    line-height:1.65;
    white-space:pre-wrap;
    word-break:break-word;
}

.message-actions{
    display:flex;
    gap:6px;
    margin-top:9px;
}

.message-actions button{
    padding:5px 8px;
    border-radius:7px;
    border:1px solid #24445f;
    background:#0a1724;
    color:#9db9d2;
    cursor:pointer;
    font-size:11px;
}

.message-actions button:hover{
    background:#10304b;
    color:#fff;
}

/* INPUT */
.input-area{
    padding:12px 20px 18px;
    border-top:1px solid #1a3046;
    background:#060c14;
}

.input-wrapper{
    max-width:850px;
    margin:auto;
    display:flex;
    align-items:center;
    gap:8px;
    padding:7px 8px 7px 14px;
    border-radius:20px;
    background:#151b24;
    border:1px solid #26394d;
}

.message-input{
    flex:1;
    min-width:0;
    padding:8px 3px;
    border:none;
    outline:none;
    background:transparent;
    color:#fff;
    font-size:14px;
}

.message-input::placeholder{
    color:#61758a;
}

.mic-button,
.send-button{
    width:38px;
    height:38px;
    min-width:38px;
    border-radius:50%;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
}

.mic-button{
    border:1px solid #31536f;
    background:#10283e;
    color:#fff;
}

.mic-button.recording{
    background:#b52d3a;
}

.send-button{
    border:none;
    background:linear-gradient(135deg,#2695ff,#07559d);
    color:#fff;
}

/* MODAL */
.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:5000;
    background:rgba(0,0,0,.75);
    padding:30px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:700px;
    max-height:80vh;
    overflow-y:auto;
    margin:auto;
    padding:20px;
    border-radius:15px;
    border:1px solid #274b68;
    background:#0a1623;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.close-button{
    border:none;
    background:transparent;
    color:#fff;
    font-size:25px;
    cursor:pointer;
}

/* HISTORY */
.history-item{
    padding:12px;
    margin-bottom:8px;
    border-radius:10px;
    border:1px solid #203b53;
    background:#0d1c2b;
}

.history-main{
    display:flex;
    align-items:center;
    gap:10px;
}

.history-checkbox{
    width:18px;
    height:18px;
    cursor:pointer;
    accent-color:#2695ff;
    display:none;
}

.history-item.selection-mode .history-checkbox{
    display:block;
}

.history-info{
    flex:1;
    cursor:pointer;
    min-width:0;
}

.history-info:hover{
    color:#55adff;
}

.history-time{
    margin-top:5px;
    color:#637d95;
    font-size:10px;
}

.history-delete-area{
    margin-top:9px;
    padding-left:28px;
}

.history-delete-btn{
    padding:5px 10px;
    border-radius:7px;
    border:1px solid #63313a;
    background:#241218;
    color:#ff7885;
    cursor:pointer;
    font-size:11px;
}

.history-delete-btn:hover{
    background:#5a2029;
    color:#fff;
}

.history-controls{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.history-controls button{
    flex:1;
    padding:11px;
    border-radius:9px;
    border:1px solid #284b67;
    background:#0d1c2b;
    color:#dcecff;
    cursor:pointer;
}

.delete-selected{
    border-color:#63313a !important;
    color:#ff7885 !important;
}

@media(max-width:700px){
    .sidebar{
        width:220px;
        min-width:220px;
        padding:13px;
    }

    .chat-area{
        padding:18px 12px;
    }

    .input-area{
        padding:10px;
    }

    .top-header{
        padding:0 12px;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- ================= SIDEBAR ================= -->

<aside class="sidebar">

    <div class="logo">
        <div class="logo-icon">B</div>
        <div class="logo-name">Viggo</div>
    </div>

    <div class="online">
        <span class="online-dot"></span>
        Online
    </div>

    <button class="new-chat" id="newChat">
        ＋ New Chat
    </button>

    <div class="section-title">
        Pinned
    </div>

    <div class="chat-list" id="pinnedList"></div>

    <div class="section-title">
        Recent
    </div>

    <div class="chat-list" id="recentList"></div>

    <div class="more-area">

        <button class="more-button" id="moreButton">
            ⋮ More
        </button>

        <div class="more-menu" id="moreMenu">

            <button id="saveButton">
                💾 Save
            </button>

            <button id="historyButton">
                🕘 History
            </button>

            <button id="pinButton">
                📌 Pin Chat
            </button>

            <button id="voiceToggle">
                🔊 Voice ON
            </button>

            <button id="femaleVoice">
                🎙️ Female Voice
            </button>

            <button id="maleVoice">
                🎙️ Male Voice
            </button>

            <button id="clearHistory">
                🗑️ Clear History
            </button>

        </div>
    </div>

</aside>


<!-- ================= MAIN ================= -->

<main class="main">

    <header class="top-header">

        <div class="header-title" id="headerTitle">
            New Chat
        </div>

        <button class="share-button" id="shareButton">
            ↗ Share
        </button>

    </header>


    <section class="chat-area" id="chatArea">

        <div class="conversation" id="conversation">

            <div class="welcome" id="welcome">

                <div class="welcome-icon">
                    B
                </div>

                <h1>Viggo</h1>

                <p>
                    Your AI friend is ready.
                </p>

            </div>

        </div>

    </section>


    <div class="input-area">

        <div class="input-wrapper">

            <input
                type="text"
                id="messageInput"
                class="message-input"
                placeholder="Message Viggo..."
                autocomplete="off"
            >

            <button
                id="micButton"
                class="mic-button"
                title="Voice Input">
                🎤
            </button>

            <button
                id="sendButton"
                class="send-button"
                title="Send">
                ➤
            </button>

        </div>

    </div>

</main>

</div>


<!-- ================= HISTORY MODAL ================= -->

<div class="modal" id="historyModal">

    <div class="modal-box">

        <div class="modal-header">

            <h3>
                🕘 Chat History
            </h3>

            <button
                class="close-button"
                id="closeHistory">
                ×
            </button>

        </div>

        <div id="historyList"></div>

    </div>

</div>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");

const conversation =
    document.getElementById("conversation");

const newChat =
    document.getElementById("newChat");

const moreButton =
    document.getElementById("moreButton");

const moreMenu =
    document.getElementById("moreMenu");

const pinnedList =
    document.getElementById("pinnedList");

const recentList =
    document.getElementById("recentList");

const historyModal =
    document.getElementById("historyModal");

const historyList =
    document.getElementById("historyList");

const closeHistory =
    document.getElementById("closeHistory");

const shareButton =
    document.getElementById("shareButton");

const headerTitle =
    document.getElementById("headerTitle");


/* =====================================================
   VARIABLES
===================================================== */

let chats = [];

let currentMessages = [];

let currentChatId = null;

let voiceEnabled = true;

let currentVoice = "female";


/* =====================================================
   LOAD
===================================================== */

try {

    const stored =
        localStorage.getItem("viggoChats");

    chats =
        stored
            ? JSON.parse(stored)
            : [];

    if (!Array.isArray(chats)) {
        chats = [];
    }

} catch(error) {

    console.error(error);

    chats = [];

}


/* =====================================================
   SAVE DATABASE
===================================================== */

function saveChats() {

    localStorage.setItem(
        "viggoChats",
        JSON.stringify(chats)
    );

}


/* =====================================================
   MORE MENU
===================================================== */

moreButton.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        moreMenu.classList.toggle("show");

    }
);

moreMenu.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

    }
);

document.addEventListener(
    "click",
    function() {

        moreMenu.classList.remove("show");

    }
);


/* =====================================================
   ADD MESSAGE TO SCREEN
===================================================== */

function addMessage(
    text,
    sender,
    shouldStore = true
) {

    if (
        text === undefined ||
        text === null ||
        !String(text).trim()
    ) {
        return;
    }


    const welcome =
        document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }


    const message =
        document.createElement("div");

    message.className = "message";


    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar " +
        (
            sender === "user"
                ? "user-avatar"
                : ""
        );

    avatar.textContent =
        sender === "user"
            ? "U"
            : "B";


    const content =
        document.createElement("div");

    content.className =
        "message-content";


    const name =
        document.createElement("div");

    name.className =
        "message-name";

    name.textContent =
        sender === "user"
            ? "You"
            : "Viggo";


    const textDiv =
        document.createElement("div");

    textDiv.className =
        "message-text";

    textDiv.textContent =
        String(text);


    content.appendChild(name);

    content.appendChild(textDiv);


    /* ASSISTANT BUTTONS */

    if (sender === "assistant") {

        const actions =
            document.createElement("div");

        actions.className =
            "message-actions";


        const copy =
            document.createElement("button");

        copy.textContent =
            "📋 Copy";

        copy.onclick =
            async function() {

                try {

                    await navigator.clipboard.writeText(
                        String(text)
                    );

                    copy.textContent =
                        "✓ Copied";

                    setTimeout(
                        function() {
                            copy.textContent =
                                "📋 Copy";
                        },
                        1200
                    );

                } catch(error) {}

            };


        const speaker =
            document.createElement("button");

        speaker.textContent =
            "🔊 Speaker";

        speaker.onclick =
            function() {

                speakText(text);

            };


        const like =
            document.createElement("button");

        like.textContent =
            "👍 Like";

        like.onclick =
            function() {

                like.textContent =
                    "❤️ Liked";

            };


        actions.appendChild(copy);
        actions.appendChild(speaker);
        actions.appendChild(like);

        content.appendChild(actions);

    }


    message.appendChild(avatar);

    message.appendChild(content);

    conversation.appendChild(message);


    /* STORE CURRENT CHAT */

    if (shouldStore) {

        currentMessages.push({
            sender: sender,
            text: String(text)
        });

    }


    scrollChat();

}


/* =====================================================
   SCROLL
===================================================== */

function scrollChat() {

    const area =
        document.getElementById("chatArea");

    area.scrollTop =
        area.scrollHeight;

}


/* =====================================================
   SEND MESSAGE
===================================================== */

function sendMessage() {

    const text =
        messageInput.value.trim();

    if (!text) {
        return;
    }


    addMessage(
        text,
        "user",
        true
    );


    messageInput.value = "";


    /*
       IMPORTANT:
       Do NOT automatically create
       a new history item here.
    */


    setTimeout(
        function() {

            const reply =
                "Okay friend, I received your message: " +
                text;


            addMessage(
                reply,
                "assistant",
                true
            );


            if (voiceEnabled) {
                speakText(reply);
            }

        },
        500
    );

}


/* =====================================================
   SEND
===================================================== */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* =====================================================
   ENTER
===================================================== */

messageInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
   NEW CHAT
===================================================== */

newChat.addEventListener(
    "click",
    function() {


        /*
           If current chat has messages,
           keep it available only when
           user explicitly presses Save.
        */


        currentMessages = [];

        currentChatId = null;


        conversation.innerHTML = `

            <div class="welcome" id="welcome">

                <div class="welcome-icon">
                    B
                </div>

                <h1>
                    Viggo
                </h1>

                <p>
                    Your AI friend is ready.
                </p>

            </div>

        `;


        headerTitle.textContent =
            "New Chat";


        messageInput.value = "";

        speechSynthesis.cancel();

    }
);


/* =====================================================
   SAVE CURRENT FULL CHAT
===================================================== */

document
.getElementById("saveButton")
.addEventListener(
    "click",
    function() {


        /* Nothing to save */

        if (
            currentMessages.length === 0
        ) {

            alert(
                "No chat to save."
            );

            moreMenu.classList.remove(
                "show"
            );

            return;

        }


        /*
           If already saved,
           update the same chat.
        */

        if (currentChatId !== null) {


            const existing =
                chats.find(
                    function(chat) {

                        return String(
                            chat.id
                        ) === String(
                            currentChatId
                        );

                    }
                );


            if (existing) {

                existing.messages =
                    [...currentMessages];

                existing.message =
                    currentMessages[0].text;

                existing.title =
                    currentMessages[0].text
                        .substring(0,35);

                existing.time =
                    new Date()
                        .toLocaleString();

                saveChats();

                renderRecent();

                renderPinned();

                showSaveSuccess();

                return;

            }

        }


        /*
           CREATE NEW SAVED CHAT
        */

        const firstUserMessage =
            currentMessages.find(
                function(message) {

                    return message.sender === "user";

                }
            );


        const title =
            firstUserMessage
                ? firstUserMessage.text
                : "Viggo Chat";


        const savedChat = {

            id:
                Date.now() +
                Math.random(),

            title:
                title.length > 35
                    ? title.substring(
                        0,
                        35
                    ) + "..."
                    : title,

            message:
                title,

            messages:
                [...currentMessages],

            time:
                new Date()
                    .toLocaleString(),

            pinned:
                false

        };


        chats.push(savedChat);


        currentChatId =
            savedChat.id;


        saveChats();


        renderRecent();

        renderPinned();


        showSaveSuccess();

    }
);


/* =====================================================
   SAVE SUCCESS
===================================================== */

function showSaveSuccess() {

    const saveButton =
        document.getElementById(
            "saveButton"
        );


    saveButton.textContent =
        "✓ Saved";


    setTimeout(
        function() {

            saveButton.textContent =
                "💾 Save";

        },
        1200
    );


    moreMenu.classList.remove(
        "show"
    );

}


/* =====================================================
   RECENT
===================================================== */

function renderRecent() {

    recentList.innerHTML = "";


    if (chats.length === 0) {

        recentList.innerHTML = `
            <div class="empty-list">
                No recent chats
            </div>
        `;

        return;

    }


    chats
        .slice()
        .reverse()
        .slice(0,8)
        .forEach(
            function(chat) {


                const button =
                    document.createElement(
                        "button"
                    );


                button.className =
                    "chat-item";


                button.textContent =
                    "💬 " +
                    (
                        chat.title ||
                        "Viggo Chat"
                    );


                button.onclick =
                    function() {

                        loadChat(
                            chat.id
                        );

                    };


                recentList.appendChild(
                    button
                );

            }
        );

}


/* =====================================================
   PINNED
===================================================== */

function renderPinned() {

    pinnedList.innerHTML = "";


    const pinned =
        chats.filter(
            function(chat) {

                return chat.pinned === true;

            }
        );


    if (pinned.length === 0) {

        pinnedList.innerHTML = `
            <div class="empty-list">
                No pinned chats
            </div>
        `;

        return;

    }


    pinned
        .slice()
        .reverse()
        .forEach(
            function(chat) {


                const button =
                    document.createElement(
                        "button"
                    );


                button.className =
                    "chat-item";


                button.textContent =
                    "📌 " +
                    (
                        chat.title ||
                        "Pinned Chat"
                    );


                button.onclick =
                    function() {

                        loadChat(
                            chat.id
                        );

                    };


                pinnedList.appendChild(
                    button
                );

            }
        );

}


/* =====================================================
   LOAD SAVED CHAT
===================================================== */

function loadChat(id) {

    const chat =
        chats.find(
            function(item) {

                return String(
                    item.id
                ) === String(id);

            }
        );


    if (!chat) {
        return;
    }


    currentChatId =
        chat.id;


    currentMessages =
        Array.isArray(
            chat.messages
        )
            ? [...chat.messages]
            : [];


    conversation.innerHTML = "";


    currentMessages.forEach(
        function(message) {

            addMessage(
                message.text,
                message.sender,
                false
            );

        }
    );


    headerTitle.textContent =
        chat.title ||
        "Saved Chat";


    scrollChat();

}


/* =====================================================
   PIN CHAT
===================================================== */

document
.getElementById("pinButton")
.addEventListener(
    "click",
    function() {


        if (currentChatId === null) {

            alert(
                "Save the chat first."
            );

            moreMenu.classList.remove(
                "show"
            );

            return;

        }


        const chat =
            chats.find(
                function(item) {

                    return String(
                        item.id
                    ) === String(
                        currentChatId
                    );

                }
            );


        if (chat) {

            chat.pinned =
                !chat.pinned;

            saveChats();

            renderPinned();

            renderRecent();

        }


        moreMenu.classList.remove(
            "show"
        );

    }
);


/* =====================================================
   HISTORY
===================================================== */

function renderHistory() {

    historyList.innerHTML = "";


    if (
        !chats ||
        chats.length === 0
    ) {

        historyList.innerHTML = `
            <div class="empty-list">
                No chat history
            </div>
        `;

        return;

    }


    chats
        .slice()
        .reverse()
        .forEach(
            function(chat) {


                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "history-item";


                item.dataset.id =
                    String(chat.id);


                item.innerHTML = `

                    <div class="history-main">

                        <input
                            type="checkbox"
                            class="history-checkbox"
                            data-id="${chat.id}"
                        >

                        <div class="history-info">

                            <div>
                                💬 ${
                                    chat.title ||
                                    "Viggo Chat"
                                }
                            </div>

                            <div class="history-time">
                                ${
                                    chat.time || ""
                                }
                            </div>

                        </div>

                    </div>

                    <div class="history-delete-area">

                        <button
                            class="history-delete-btn"
                            data-id="${chat.id}">
                            🗑 Delete
                        </button>

                    </div>
                `;


                historyList.appendChild(
                    item
                );

            }
        );


    /* SINGLE DELETE */

    document
        .querySelectorAll(
            ".history-delete-btn"
        )
        .forEach(
            function(button) {


                button.addEventListener(
                    "click",
                    function(event) {

                        event.preventDefault();

                        event.stopPropagation();


                        const id =
                            String(
                                this.dataset.id
                            );


                        chats =
                            chats.filter(
                                function(chat) {

                                    return String(
                                        chat.id
                                    ) !== id;

                                }
                            );


                        if (
                            String(
                                currentChatId
                            ) === id
                        ) {

                            currentChatId =
                                null;

                            currentMessages =
                                [];

                        }


                        saveChats();

                        renderRecent();

                        renderPinned();

                        renderHistory();

                    }
                );

            }
        );


    /* DOUBLE CLICK */

    document
        .querySelectorAll(
            ".history-item"
        )
        .forEach(
            function(item) {


                item.addEventListener(
                    "dblclick",
                    function(event) {


                        event.preventDefault();


                        this.classList.toggle(
                            "selection-mode"
                        );


                        const checkbox =
                            this.querySelector(
                                ".history-checkbox"
                            );


                        checkbox.checked =
                            this.classList.contains(
                                "selection-mode"
                            );

                    }
                );

            }
        );


    /* CONTROLS */

    const controls =
        document.createElement(
            "div"
        );


    controls.className =
        "history-controls";


    controls.innerHTML = `

        <button id="selectAllHistory">
            ☑ Select All
        </button>

        <button
            id="deleteSelectedHistory"
            class="delete-selected">
            🗑 Delete Selected
        </button>
    `;


    historyList.appendChild(
        controls
    );


    /* SELECT ALL */

    document
        .getElementById(
            "selectAllHistory"
        )
        .onclick =
        function() {


            document
                .querySelectorAll(
                    ".history-checkbox"
                )
                .forEach(
                    function(box) {

                        box.checked =
                            true;

                        box
                            .closest(
                                ".history-item"
                            )
                            .classList.add(
                                "selection-mode"
                            );

                    }
                );

        };


    /* DELETE SELECTED */

    document
        .getElementById(
            "deleteSelectedHistory"
        )
        .onclick =
        function() {


            const selected =
                Array.from(
                    document.querySelectorAll(
                        ".history-checkbox:checked"
                    )
                )
                .map(
                    function(box) {

                        return String(
                            box.dataset.id
                        );

                    }
                );


            if (
                selected.length === 0
            ) {

                alert(
                    "Select at least one chat."
                );

                return;

            }


            chats =
                chats.filter(
                    function(chat) {

                        return !selected.includes(
                            String(chat.id)
                        );

                    }
                );


            if (
                selected.includes(
                    String(currentChatId)
                )
            ) {

                currentChatId =
                    null;

                currentMessages =
                    [];

            }


            saveChats();

            renderRecent();

            renderPinned();

            renderHistory();

        };

}


/* =====================================================
   HISTORY OPEN
===================================================== */

document
.getElementById("historyButton")
.addEventListener(
    "click",
    function() {

        renderHistory();

        historyModal.classList.add(

        moreMenu.classList.remove(

/* =====================================================

===================================================== */

closeHistory.addEventListener(

/* =====================================================
   CLEAR HISTORY
===================================================== */

document
.getElementById("clearHistory")
.addEventListener(
    "click",
    function() {


        chats = [];

        saveChats();

        renderRecent();

        renderPinned();

        historyList.innerHTML = `
            <div class="empty-list">
                No chat history
            </div>
        `;


        currentChatId =
            null;


        moreMenu.classList.remove(
            "show"
        );

    }
);


/* =====================================================
   SHARE CHAT AS LINK
===================================================== */

shareButton.addEventListener(
    "click",
    async function() {


        /*
           For now create a unique
           share URL.
        */

        let shareId =
            currentChatId;


        if (!shareId) {

            shareId =
                Date.now();

        }


        const shareURL =
            window.location.origin +
            window.location.pathname +
            "?chat=" +
            encodeURIComponent(
                shareId
            );


        try {


            if (
                navigator.share
            ) {


                await navigator.share({

                    title:
                        "Viggo AI Chat",

                    text:
                        "View my Viggo AI conversation",

                    url:
                        shareURL

                });


            } else {


                await navigator
                    .clipboard
                    .writeText(
                        shareURL
                    );


                shareButton.textContent =
                    "✓ Link Copied";


                setTimeout(
                    function() {

                        shareButton.textContent =
                            "↗ Share";

                    },
                    1500
                );

            }


        } catch(error) {

            console.log(
                "Share cancelled"
            );

        }

    }
);

/* =====================================================
   TEXT TO SPEECH
===================================================== */

function speakText(text) {


    if (!voiceEnabled) {
        return;
    }


    if (
        !("speechSynthesis" in window)
    ) {
        return;
    }


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            String(text)
        );


    const voices =
        speechSynthesis.getVoices();


    let selected = null;


    if (
        currentVoice === "female"
    ) {

        selected =
            voices.find(
                function(voice) {

                    return /female|zira|samantha|karen|susan|google us english/i
                        .test(
                            voice.name
                        );

                }
            );

    } else {

        selected =
            voices.find(
                function(voice) {

                    return /male|david|alex|daniel|google uk english/i
                        .test(
                            voice.name
                        );

                }
            );

    }


    if (selected) {

        utterance.voice =
            selected;

    }


    utterance.rate = 1;

    utterance.pitch = 1;


    speechSynthesis.speak(
        utterance
    );

}


/* =====================================================
   MICROPHONE
===================================================== */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition = null;


if (SpeechRecognition) {


    recognition =
        new SpeechRecognition();


    recognition.lang =
        "en-IN";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.onstart =
        function() {

            micButton.classList.add(
                "recording"
            );

            micButton.textContent =
                "🔴";

        };


    recognition.onend =
        function() {

            micButton.classList.remove(
                "recording"
            );

            micButton.textContent =
                "🎤";

        };


    recognition.onresult =
        function(event) {

            messageInput.value =
                event
                    .results[0][0]
                    .transcript;

            messageInput.focus();

        };

}


/* =====================================================
   MIC
===================================================== */

micButton.addEventListener(
    "click",
    function() {


        if (!recognition) {

            alert(
                "Voice input is not supported in this browser."
            );

            return;

        }


        try {

            recognition.start();

        } catch(error) {}

    }
);


/* =====================================================
   LOAD SHARED CHAT
===================================================== */

function loadSharedChat() {


    const params =
        new URLSearchParams(
            window.location.search
        );


    const id =
        params.get("chat");


    if (!id) {
        return;
    }


    const chat =
        chats.find(
            function(item) {

                return String(
                    item.id
                ) === String(id);

            }
        );


    if (!chat) {
        return;
    }


    loadChat(chat.id);

}


/* =====================================================
   INITIAL
===================================================== */

renderRecent();

renderPinned();

loadSharedChat();

</script>
