<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viggo AI Assistant</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef2f7;
    }

    .app {
      width: 100%;
      max-width: 850px;
      height: 100vh;
      margin: auto;
      background: white;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #111827;
      color: white;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
    }

    button {
      border: none;
      cursor: pointer;
    }

    #historyButton {
      background: #374151;
      color: white;
      padding: 9px 12px;
      border-radius: 8px;
    }

    .save-bar {
      padding: 10px;
      text-align: right;
      border-bottom: 1px solid #ddd;
    }

    #saveButton {
      background: #16a34a;
      color: white;
      padding: 9px 14px;
      border-radius: 8px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      max-width: 80%;
      padding: 12px 15px;
      margin-bottom: 10px;
      border-radius: 14px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user {
      margin-left: auto;
      background: #2563eb;
      color: white;
    }

    .ai {
      margin-right: auto;
      background: #e5e7eb;
      color: #111;
    }

    .input-area {
      padding: 12px;
      border-top: 1px solid #ddd;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    #message {
      flex: 1;
      resize: none;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    #send {
      width: 75px;
      background: #2563eb;
      color: white;
      border-radius: 10px;
      font-weight: bold;
    }

    #send:disabled {
      opacity: 0.6;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
    }

    #mic {
      background: #16a34a;
      color: white;
      width: 55px;
      height: 45px;
      border-radius: 10px;
      font-size: 20px;
    }

    #mic.listening {
      background: #dc2626;
    }

    #voiceToggle {
      background: #16a34a;
      color: white;
      padding: 10px 15px;
      border-radius: 10px;
    }

    #voiceToggle.off {
      background: #6b7280;
    }

    /* HISTORY */

    #historyPanel {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 1000;
    }

    .history-box {
      width: 92%;
      max-width: 600px;
      height: 82vh;
      margin: 7vh auto;
      background: white;
      border-radius: 15px;
      padding: 18px;
      overflow-y: auto;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-header h2 {
      margin: 0;
    }

    #closeHistory {
      background: #ef4444;
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
    }

    .history-item {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 12px;
      margin-top: 12px;
    }

    .history-item.pinned {
      border: 2px solid #facc15;
      background: #fffbea;
    }

    .history-user {
      color: #2563eb;
      margin: 8px 0;
      white-space: pre-wrap;
    }

    .history-ai {
      margin: 8px 0;
      white-space: pre-wrap;
    }

    .history-time {
      color: #777;
      font-size: 12px;
    }

    .history-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .pin-btn {
      background: #facc15;
      padding: 8px 11px;
      border-radius: 8px;
    }

    .delete-btn {
      background: #ef4444;
      color: white;
      padding: 8px 11px;
      border-radius: 8px;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 30px;
    }

    @media (max-width: 600px) {
      .message {
        max-width: 90%;
      }

      #send {
        width: 70px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <h1>🤖 Viggo AI Assistant</h1>

      <button id="historyButton" type="button">
        📜 History
      </button>
    </header>


    <div class="save-bar">

      <button id="saveButton" type="button">
        💾 Save
      </button>

    </div>


    <div id="chat">

      <div class="message ai">
        Hello! 👋
        I am Viggo AI Assistant.
        How can I help you?
      </div>

    </div>


    <div class="input-area">

      <div class="input-row">

        <textarea
          id="message"
          rows="2"
          placeholder="Type your message..."
        ></textarea>

        <button id="send" type="button">
          Send
        </button>

      </div>


      <div class="controls">

        <button id="mic" type="button">
          🎤
        </button>

        <button id="voiceToggle" type="button">
          🔊 Voice ON
        </button>

      </div>

    </div>

  </div>


  <!-- HISTORY -->

  <div id="historyPanel">

    <div class="history-box">

      <div class="history-header">

        <h2>📜 History</h2>

        <button id="closeHistory" type="button">
          Close
        </button>

      </div>

      <div id="historyList"></div>

    </div>

  </div>


  <script src="./script.js"></script>

</body>
</html>
