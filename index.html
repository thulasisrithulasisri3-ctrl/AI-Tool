<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Viggo AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar" id="sidebar">

        <div class="sidebar-top">

            <div class="logo">
                <div class="logo-icon">V</div>

                <div>
                    <div class="logo-title">
                        Viggo AI
                    </div>

                    <div class="logo-subtitle">
                        Your AI Assistant
                    </div>
                </div>
            </div>

            <button
                class="close-sidebar"
                id="closeSidebar">
                ×
            </button>

        </div>


        <!-- NEW CHAT -->

        <button
            class="new-chat-btn"
            id="newChatBtn">

            <span>＋</span>

            <span>
                New Chat
            </span>

        </button>


        <!-- RECENT -->

        <div class="section-title">

            <span>Recent</span>

            <span id="recentCount">
                0
            </span>

        </div>


        <div
            class="recent-list"
            id="recentList">

            <!-- Recent chats -->

        </div>


        <!-- SIDEBAR MORE -->

        <div class="sidebar-bottom">

            <button
                class="sidebar-more"
                id="sidebarMoreBtn">

                <span>•••</span>

                <span>More</span>

            </button>


            <div
                class="sidebar-menu"
                id="sidebarMenu">

                <button
                    id="languageBtn">

                    🌐 Language

                </button>

                <button
                    id="voiceBtn">

                    🎤 Voice

                </button>

                <button
                    id="deleteChatBtn">

                    🗑 Delete Chat

                </button>

            </div>

        </div>

    </aside>


    <!-- ================= MAIN ================= -->

    <main class="main">


        <!-- HEADER -->

        <header class="header">

            <div class="header-left">

                <button
                    class="menu-btn"
                    id="menuBtn">

                    ☰

                </button>


                <div>

                    <div class="header-title">
                        Viggo AI
                    </div>

                    <div class="online">

                        <span></span>

                        Online

                    </div>

                </div>

            </div>


            <div class="header-right">

                <button
                    class="header-share"
                    id="headerShareBtn">

                    🔗 Share

                </button>

            </div>

        </header>


        <!-- CHAT -->

        <section
            class="chat-area"
            id="chatArea">

            <div
                class="welcome"
                id="welcome">

                <div class="welcome-icon">
                    V
                </div>

                <h1>
                    Hello! I'm Viggo AI
                </h1>

                <p>
                    Your friendly AI assistant.
                    Ask me anything.
                </p>

            </div>

        </section>


        <!-- INPUT -->

        <div class="input-area">

            <div class="input-box">


                <!-- PLUS -->

                <button
                    class="input-btn plus-btn"
                    id="plusBtn">

                    ＋

                </button>


                <!-- MESSAGE -->

                <textarea
                    id="messageInput"
                    class="message-input"
                    placeholder="Message Viggo AI..."
                    rows="1"></textarea>


                <!-- VOICE -->

                <button
                    class="input-btn"
                    id="voiceInputBtn">

                    🎤

                </button>


                <!-- SEND -->

                <button
                    class="send-btn"
                    id="sendBtn">

                    ➤

                </button>

            </div>


            <div class="input-note">

                Viggo AI can make mistakes.
                Check important information.

            </div>

        </div>


    </main>


    <!-- ================= PLUS MENU ================= -->

    <div
        class="popup plus-menu"
        id="plusMenu">

        <button id="photoBtn">

            📷
            <span>Photos</span>

        </button>

        <button id="videoBtn">

            🎥
            <span>Videos</span>

        </button>

        <button id="fileBtn">

            📎
            <span>Files</span>

        </button>

    </div>


    <!-- ================= LANGUAGE MENU ================= -->

    <div
        class="popup language-menu"
        id="languageMenu">

        <div class="popup-title">

            🌐 Language

        </div>


        <button
            data-language="en">

            English

        </button>

        <button
            data-language="ta">

            தமிழ்

        </button>

        <button
            data-language="hi">

            हिन्दी

        </button>

        <button
            data-language="ml">

            മലയാളം

        </button>

        <button
            data-language="te">

            తెలుగు

        </button>

        <button
            data-language="kn">

            ಕನ್ನಡ

        </button>


        <button
            id="moreLanguageBtn">

            + More Languages

        </button>


        <div
            class="more-languages"
            id="moreLanguages">

            <button data-language="bn">
                Bengali
            </button>

            <button data-language="mr">
                Marathi
            </button>

            <button data-language="gu">
                Gujarati
            </button>

            <button data-language="pa">
                Punjabi
            </button>

            <button data-language="ur">
                Urdu
            </button>

            <button data-language="es">
                Spanish
            </button>

            <button data-language="fr">
                French
            </button>

            <button data-language="de">
                German
            </button>

            <button data-language="ja">
                Japanese
            </button>

            <button data-language="ko">
                Korean
            </button>

            <button data-language="zh">
                Chinese
            </button>

            <button data-language="ar">
                Arabic
            </button>

        </div>

    </div>


    <!-- ================= VOICE MENU ================= -->

    <div
        class="popup voice-menu"
        id="voiceMenu">

        <div class="popup-title">

            🎤 Voice

        </div>


        <button
            class="voice-option"
            data-voice="female">

            👩 Female Voice

        </button>


        <button
            class="voice-option"
            data-voice="male">

            👨 Male Voice

        </button>


        <div class="voice-status"
             id="voiceStatus">

            Female Voice

        </div>

    </div>


    <!-- ================= DELETE MENU ================= -->

    <div
        class="popup delete-menu"
        id="deleteMenu">

        <div class="popup-title">

            🗑 Delete Chat

        </div>


        <button id="selectDeleteBtn">

            ☑ Select Chats

        </button>


        <button id="clearAllBtn">

            🧹 Clear All Chats

        </button>

    </div>


    <!-- FILE INPUTS -->

    <input
        type="file"
        id="photoInput"
        accept="image/*"
        multiple
        hidden>


    <input
        type="file"
        id="videoInput"
        accept="video/*"
        multiple
        hidden>


    <input
        type="file"
        id="fileInput"
        multiple
        hidden>


    <!-- SHARE -->

    <div
        class="share-popup"
        id="sharePopup">

        <div class="share-card">

            <h3>
                🔗 Share Chat
            </h3>

            <input
                id="shareLink"
                readonly>

            <button
                id="copyShareLink">

                📋 Copy Link

            </button>

            <button
                id="nativeShareBtn">

                ↗ Share

            </button>

            <button
                id="closeShare">

                Close

            </button>

        </div>

    </div>


</div>


<script src="script.js"></script>

</body>
</html>
