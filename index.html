<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viggo AI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#07101a;
    color:#fff;
    height:100vh;
    overflow:hidden;
}

.app{
    display:flex;
    height:100vh;
}

/* SIDEBAR */
.sidebar{
    width:260px;
    min-width:260px;
    height:100vh;
    background:#050b12;
    border-right:1px solid #1d354d;
    padding:18px;
    display:flex;
    flex-direction:column;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo-icon{
    width:42px;
    height:42px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#2695ff,#07559d);
    font-size:22px;
    font-weight:bold;
}

.logo-name{
    font-size:21px;
    font-weight:600;
}

.online{
    margin-left:52px;
    margin-top:5px;
    color:#48df89;
    font-size:11px;
}

.online-dot{
    display:inline-block;
    width:6px;
    height:6px;
    border-radius:50%;
    background:#35dc79;
    margin-right:5px;
}

.new-chat{
    width:100%;
    margin-top:25px;
    padding:11px;
    border-radius:10px;
    border:1px solid #1768ae;
    background:linear-gradient(135deg,#116fc4,#073d70);
    color:white;
    cursor:pointer;
    text-align:left;
    font-size:14px;
}

.new-chat:hover{
    background:#116eb8;
}

.section-title{
    margin-top:24px;
    margin-bottom:8px;
    color:#718ba5;
    font-size:11px;
    font-weight:bold;
    text-transform:uppercase;
}

.chat-list{
    display:flex;
    flex-direction:column;
    gap:4px;
    overflow-y:auto;
}

.chat-item{
    width:100%;
    padding:9px 10px;
    border:none;
    border-radius:8px;
    background:transparent;
    color:#d7e7f7;
    cursor:pointer;
    text-align:left;
    font-size:13px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.chat-item:hover{
    background:#102437;
}

.empty-list{
    padding:8px 10px;
    color:#557089;
    font-size:12px;
}

/* MORE */
.more-area{
    margin-top:auto;
    position:relative;
}

.more-button{
    width:100%;
    padding:11px;
    border-radius:10px;
    border:1px solid #284761;
    background:#0b1724;
    color:#dcecff;
    cursor:pointer;
    text-align:left;
    font-size:14px;
}

.more-menu{
    display:none;
    position:absolute;
    left:0;
    right:0;
    bottom:52px;
    padding:7px;
    background:#091522;
    border:1px solid #284b67;
    border-radius:12px;
    box-shadow:0 15px 40px rgba(0,0,0,.7);
    z-index:1000;
}

.more-menu.show{
    display:block;
}

.more-menu button{
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    background:transparent;
    color:#dcecff;
    cursor:pointer;
    text-align:left;
    font-size:13px;
}

.more-menu button:hover{
    background:#10304b;
}

/* MAIN */
.main{
    flex:1;
    min-width:0;
    height:100vh;
    display:flex;
    flex-direction:column;
}

.top-header{
    height:60px;
    display:flex;
    align-items:center;
    padding:0 20px;
    background:#050b12;
    border-bottom:1px solid #1a3046;
}

.header-title{
    font-size:14px;
}

.share-button{
    margin-left:auto;
    padding:7px 14px;
    border-radius:8px;
    border:1px solid #216ca8;
    background:#0b3154;
    color:white;
    cursor:pointer;
}

.share-button:hover{
    background:#12517f;
}

/* CHAT */
.chat-area{
    flex:1;
    overflow-y:auto;
    padding:25px 20px;
}

.conversation{
    width:100%;
    max-width:850px;
    margin:auto;
}

.welcome{
    min-height:100%;
    padding-top:80px;
    text-align:center;
}

.welcome-icon{
    width:70px;
    height:70px;
    margin:auto;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#2695ff,#07559d);
    font-size:34px;
    font-weight:bold;
}

.welcome h1{
    margin-top:16px;
    font-size:28px;
}

.welcome p{
    margin-top:7px;
    color:#718ba5;
    font-size:14px;
}

/* MESSAGE */
.message{
    display:flex;
    gap:11px;
    margin-bottom:22px;
}

.avatar{
    width:36px;
    height:36px;
    min-width:36px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0c63a9;
    font-size:14px;
    font-weight:bold;
}

.user-avatar{
    background:#263a50;
}

.message-content{
    min-width:0;
}

.message-name{
    margin-bottom:5px;
    color:#6d9bc5;
    font-size:11px;
}

.message-text{
    color:#e7f1fa;
    font-size:14px;
    line-height:1.65;
    white-space:pre-wrap;
    word-break:break-word;
}

.message-actions{
    display:flex;
    gap:6px;
    margin-top:9px;
}

.message-actions button{
    padding:5px 8px;
    border-radius:7px;
    border:1px solid #24445f;
    background:#0a1724;
    color:#9db9d2;
    cursor:pointer;
    font-size:11px;
}

.message-actions button:hover{
    background:#10304b;
    color:white;
}

/* INPUT */
.input-area{
    padding:12px 20px 18px;
    border-top:1px solid #1a3046;
    background:#060c14;
}

.input-wrapper{
    max-width:850px;
    margin:auto;
    display:flex;
    align-items:center;
    gap:8px;
    padding:7px 8px 7px 14px;
    border-radius:20px;
    background:#151b24;
    border:1px solid #26394d;
}

.message-input{
    flex:1;
    min-width:0;
    padding:8px 3px;
    border:none;
    outline:none;
    background:transparent;
    color:white;
    font-size:14px;
}

.message-input::placeholder{
    color:#61758a;
}

.mic-button,
.send-button{
    width:38px;
    height:38px;
    min-width:38px;
    border-radius:50%;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
}

.mic-button{
    border:1px solid #31536f;
    background:#10283e;
    color:white;
}

.mic-button.recording{
    background:#b52d3a;
}

.send-button{
    border:none;
    background:linear-gradient(135deg,#2695ff,#07559d);
    color:white;
}

/* HISTORY MODAL */
.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:5000;
    background:rgba(0,0,0,.75);
    padding:30px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:700px;
    max-height:80vh;
    overflow-y:auto;
    margin:auto;
    padding:20px;
    border-radius:15px;
    border:1px solid #274b68;
    background:#0a1623;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.close-button{
    border:none;
    background:transparent;
    color:white;
    font-size:25px;
    cursor:pointer;
}

/* HISTORY ITEM */
.history-item{
    padding:12px;
    margin-bottom:8px;
    border-radius:9px;
    border:1px solid #203b53;
    background:#0d1c2b;
}

.history-row{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
}

.history-checkbox{
    width:18px;
    height:18px;
    flex-shrink:0;
    cursor:pointer;
    accent-color:#2695ff;
}

.history-info{
    flex:1;
    min-width:0;
    cursor:pointer;
}

.history-time{
    margin-top:5px;
    color:#637d95;
    font-size:10px;
}

/* SINGLE DELETE */
.single-delete{
    width:34px;
    height:34px;
    min-width:34px;
    flex-shrink:0;
    border:1px solid #63313a;
    border-radius:8px;
    background:#241218;
    color:#ff7885;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:15px;
}

.single-delete:hover{
    background:#5a2029;
    color:white;
}

/* HISTORY CONTROLS */
.history-controls{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.history-controls button{
    flex:1;
    padding:11px;
    border-radius:9px;
    border:1px solid #284b67;
    background:#0d1c2b;
    color:#dcecff;
    cursor:pointer;
}

.history-controls button:hover{
    background:#123752;
}

.delete-selected{
    color:#ff7885 !important;
    border-color:#63313a !important;
}

/* MOBILE */
@media(max-width:700px){

    .sidebar{
        width:220px;
        min-width:220px;
        padding:13px;
    }

    .chat-area{
        padding:18px 12px;
    }

    .input-area{
        padding:10px;
    }

    .top-header{
        padding:0 12px;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- ================= SIDEBAR ================= -->

<aside class="sidebar">

    <div class="logo">

        <div class="logo-icon">
            B
        </div>

        <div class="logo-name">
            Viggo
        </div>

    </div>

    <div class="online">
        <span class="online-dot"></span>
        Online
    </div>

    <button
        class="new-chat"
        id="newChat">
        ＋ New Chat
    </button>

    <div class="section-title">
        Pinned
    </div>

    <div
        class="chat-list"
        id="pinnedList">
    </div>

    <div class="section-title">
        Recent
    </div>

    <div
        class="chat-list"
        id="recentList">
    </div>

    <!-- MORE -->

    <div class="more-area">

        <button
            class="more-button"
            id="moreButton">
            ⋮ More
        </button>

        <div
            class="more-menu"
            id="moreMenu">

            <button id="saveButton">
                💾 Save
            </button>

            <button id="historyButton">
                🕘 History
            </button>

            <button id="pinButton">
                📌 Pin Chat
            </button>

            <button id="voiceToggle">
                🔊 Voice ON
            </button>

            <button id="femaleVoice">
                🎙️ Female Voice
            </button>

            <button id="maleVoice">
                🎙️ Male Voice
            </button>

            <button id="clearHistory">
                🗑️ Clear History
            </button>

        </div>

    </div>

</aside>


<!-- ================= MAIN ================= -->

<main class="main">

    <header class="top-header">

        <div
            class="header-title"
            id="headerTitle">
            New Chat
        </div>

        <button
            class="share-button"
            id="shareButton">
            ↗ Share
        </button>

    </header>


    <section
        class="chat-area"
        id="chatArea">

        <div
            class="conversation"
            id="conversation">

            <div
                class="welcome"
                id="welcome">

                <div class="welcome-icon">
                    B
                </div>

                <h1>
                    Viggo
                </h1>

                <p>
                    Your AI friend is ready.
                </p>

            </div>

        </div>

    </section>


    <!-- INPUT -->

    <div class="input-area">

        <div class="input-wrapper">

            <input
                type="text"
                id="messageInput"
                class="message-input"
                placeholder="Message Viggo..."
                autocomplete="off"
            >

            <button
                id="micButton"
                class="mic-button"
                title="Voice Input">
                🎤
            </button>

            <button
                id="sendButton"
                class="send-button"
                title="Send">
                ➤
            </button>

        </div>

    </div>

</main>

</div>


<!-- ================= HISTORY MODAL ================= -->

<div
    class="modal"
    id="historyModal">

    <div class="modal-box">

        <div class="modal-header">

            <h3>
                🕘 Chat History
            </h3>

            <button
                class="close-button"
                id="closeHistory">
                ×
            </button>

        </div>

        <div id="historyList"></div>

    </div>

</div>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");

const conversation =
    document.getElementById("conversation");

const newChat =
    document.getElementById("newChat");

const moreButton =
    document.getElementById("moreButton");

const moreMenu =
    document.getElementById("moreMenu");

const pinnedList =
    document.getElementById("pinnedList");

const recentList =
    document.getElementById("recentList");

const historyModal =
    document.getElementById("historyModal");

const historyList =
    document.getElementById("historyList");

const closeHistory =
    document.getElementById("closeHistory");

const shareButton =
    document.getElementById("shareButton");


/* =====================================================
   DATA
===================================================== */

let chats = [];

let voiceEnabled = true;

let currentVoice = "female";


try{

    const saved =
        localStorage.getItem("viggoChats");

    chats =
        saved
            ? JSON.parse(saved)
            : [];

    if(!Array.isArray(chats)){
        chats = [];
    }

}catch(error){

    chats = [];

}


/* =====================================================
   STORAGE
===================================================== */

function saveChats(){

    localStorage.setItem(
        "viggoChats",
        JSON.stringify(chats)
    );

}


/* =====================================================
   MORE MENU
===================================================== */

moreButton.addEventListener(
    "click",
    function(event){

        event.stopPropagation();

        moreMenu.classList.toggle("show");

    }
);

moreMenu.addEventListener(
    "click",
    function(event){

        event.stopPropagation();

    }
);

document.addEventListener(
    "click",
    function(){

        moreMenu.classList.remove("show");

    }
);


/* =====================================================
   ADD MESSAGE
===================================================== */

function addMessage(text, sender){

    if(
        text === undefined ||
        text === null ||
        !String(text).trim()
    ){
        return;
    }

    const welcome =
        document.getElementById("welcome");

    if(welcome){
        welcome.style.display = "none";
    }


    const message =
        document.createElement("div");

    message.className = "message";


    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar " +
        (
            sender === "user"
                ? "user-avatar"
                : ""
        );

    avatar.textContent =
        sender === "user"
            ? "U"
            : "B";


    const content =
        document.createElement("div");

    content.className =
        "message-content";


    const name =
        document.createElement("div");

    name.className =
        "message-name";

    name.textContent =
        sender === "user"
            ? "You"
            : "Viggo";


    const textDiv =
        document.createElement("div");

    textDiv.className =
        "message-text";

    textDiv.textContent =
        String(text);


    content.appendChild(name);
    content.appendChild(textDiv);


    if(sender === "assistant"){

        const actions =
            document.createElement("div");

        actions.className =
            "message-actions";


        const copy =
            document.createElement("button");

        copy.textContent = "📋 Copy";

        copy.onclick = function(){

            navigator.clipboard.writeText(
                String(text)
            );

            copy.textContent = "✓ Copied";

            setTimeout(
                function(){
                    copy.textContent = "📋 Copy";
                },
                1200
            );

        };


        const speaker =
            document.createElement("button");

        speaker.textContent =
            "🔊 Speaker";

        speaker.onclick = function(){

            speakText(text);

        };


        const like =
            document.createElement("button");

        like.textContent =
            "👍 Like";

        like.onclick = function(){

            like.textContent =
                "❤️ Liked";

        };


        actions.appendChild(copy);
        actions.appendChild(speaker);
        actions.appendChild(like);

        content.appendChild(actions);

    }


    message.appendChild(avatar);
    message.appendChild(content);

    conversation.appendChild(message);

    scrollChat();

}


/* =====================================================
   SCROLL
===================================================== */

function scrollChat(){

    const area =
        document.getElementById("chatArea");

    area.scrollTop =
        area.scrollHeight;

}


/* =====================================================
   SAVE CHAT
===================================================== */

function saveChat(text){

    if(
        !text ||
        !String(text).trim()
    ){
        return;
    }


    const chat = {

        id:
            Date.now() +
            Math.random(),

        title:
            String(text).length > 35
                ? String(text).substring(0,35) + "..."
                : String(text),

        message:
            String(text),

        time:
            new Date().toLocaleString(),

        pinned:false

    };


    chats.push(chat);

    saveChats();

    renderRecent();

    renderPinned();

}


/* =====================================================
   SEND
===================================================== */

function sendMessage(){

    const text =
        messageInput.value.trim();

    if(!text){
        return;
    }


    addMessage(
        text,
        "user"
    );


    saveChat(text);

    messageInput.value = "";


    setTimeout(
        function(){

            const reply =
                "Okay friend, I received your message: " +
                text;

            addMessage(
                reply,
                "assistant"
            );

            speakText(reply);

        },
        500
    );

}


/* =====================================================
   SEND BUTTON
===================================================== */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* =====================================================
   ENTER
===================================================== */

messageInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
   NEW CHAT
===================================================== */

newChat.addEventListener(
    "click",
    function(){

        conversation.innerHTML = `

            <div
                class="welcome"
                id="welcome">

                <div class="welcome-icon">
                    B
                </div>

                <h1>
                    Viggo
                </h1>

                <p>
                    Your AI friend is ready.
                </p>

            </div>

        `;

        document.getElementById(
            "headerTitle"
        ).textContent =
            "New Chat";

        messageInput.value = "";

        speechSynthesis.cancel();

    }
);


/* =====================================================
   RECENT
===================================================== */

function renderRecent(){

    recentList.innerHTML = "";

    if(chats.length === 0){

        recentList.innerHTML =
            `<div class="empty-list">
                No recent chats
            </div>`;

        return;
    }


    chats
        .slice()
        .reverse()
        .slice(0,8)
        .forEach(
            function(chat){

                const button =
                    document.createElement("button");

                button.className =
                    "chat-item";

                button.textContent =
                    "💬 " +
                    (
                        chat.title ||
                        chat.message ||
                        "New Chat"
                    );


                button.onclick =
                    function(){

                        messageInput.value =
                            chat.message || "";

                        messageInput.focus();

                    };


                recentList.appendChild(button);

            }
        );

}


/* =====================================================
   PINNED
===================================================== */

function renderPinned(){

    pinnedList.innerHTML = "";

    const pinned =
        chats.filter(
            function(chat){
                return chat.pinned === true;
            }
        );


    if(pinned.length === 0){

        pinnedList.innerHTML =
            `<div class="empty-list">
                No pinned chats
            </div>`;

        return;
    }


    pinned
        .slice()
        .reverse()
        .forEach(
            function(chat){

                const button =
                    document.createElement("button");

                button.className =
                    "chat-item";

                button.textContent =
                    "📌 " +
                    (
                        chat.title ||
                        chat.message ||
                        "Pinned Chat"
                    );


                button.onclick =
                    function(){

                        messageInput.value =
                            chat.message || "";

                        messageInput.focus();

                    };


                pinnedList.appendChild(button);

            }
        );

}


/* =====================================================
   PIN CHAT
===================================================== */

document
.getElementById("pinButton")
.addEventListener(
    "click",
    function(){

        if(chats.length === 0){

            moreMenu.classList.remove("show");

            return;
        }


        chats[
            chats.length - 1
        ].pinned = true;


        saveChats();

        renderPinned();

        renderRecent();

        moreMenu.classList.remove("show");

    }
);


/* =====================================================
   HISTORY
===================================================== */

function renderHistory(){

    historyList.innerHTML = "";


    if(!chats || chats.length === 0){

        historyList.innerHTML = `

            <div class="empty-list">
                No chat history
            </div>

        `;

        return;
    }


    chats
    .slice()
    .reverse()
    .forEach(
        function(chat){

            const item =
                document.createElement("div");

            item.className =
                "history-item";


            const row =
                document.createElement("div");

            row.className =
                "history-row";


            /* CHECKBOX */

            const checkbox =
                document.createElement("input");

            checkbox.type =
                "checkbox";

            checkbox.className =
                "history-checkbox";

            checkbox.dataset.id =
                String(chat.id);


            /* INFO */

            const info =
                document.createElement("div");

            info.className =
                "history-info";


            const title =
                document.createElement("div");

            title.textContent =
                "💬 " +
                (
                    chat.title ||
                    chat.message ||
                    "New Chat"
                );


            const time =
                document.createElement("div");

            time.className =
                "history-time";

            time.textContent =
                chat.time || "";


            info.appendChild(title);
            info.appendChild(time);


            /* DELETE BUTTON */

            const deleteButton =
                document.createElement("button");

            deleteButton.className =
                "single-delete";

            deleteButton.textContent =
                "🗑";

            deleteButton.title =
                "Delete this chat";


            deleteButton.addEventListener(
                "click",
                function(event){

                    event.preventDefault();
                    event.stopPropagation();


                    const id =
                        String(
                            chat.id
                        );


                    chats =
                        chats.filter(
                            function(c){

                                return String(c.id) !== id;

                            }
                        );


                    saveChats();

                    renderRecent();

                    renderPinned();

                    renderHistory();

                }
            );


            /* OPEN CHAT */

            info.addEventListener(
                "click",
                function(){

                    messageInput.value =
                        chat.message || "";

                    historyModal.classList.remove(
                        "show"
                    );

                    messageInput.focus();

                }
            );


            row.appendChild(
                checkbox
            );

            row.appendChild(
                info
            );

            row.appendChild(
                deleteButton
            );


            item.appendChild(row);

            historyList.appendChild(item);

        }
    );


    /* CONTROLS */

    const controls =
        document.createElement("div");

    controls.className =
        "history-controls";


    const selectAll =
        document.createElement("button");

    selectAll.textContent =
        "☑ Select All";


    const deleteSelected =
        document.createElement("button");

    deleteSelected.className =
        "delete-selected";

    deleteSelected.textContent =
        "🗑 Delete Selected";


    controls.appendChild(selectAll);

    controls.appendChild(deleteSelected);

    historyList.appendChild(controls);


    /* SELECT ALL */

    selectAll.onclick =
        function(){

            const boxes =
                document.querySelectorAll(
                    ".history-checkbox"
                );


            const allSelected =
                [...boxes].every(
                    function(box){
                        return box.checked;
                    }
                );


            boxes.forEach(
                function(box){

                    box.checked =
                        !allSelected;

                }
            );


            selectAll.textContent =
                allSelected
                    ? "☑ Select All"
                    : "☐ Unselect All";

        };


    /* DELETE SELECTED */

    deleteSelected.onclick =
        function(){

            const selected =
                [
                    ...document.querySelectorAll(
                        ".history-checkbox:checked"
                    )
                ]
                .map(
                    function(box){

                        return String(
                            box.dataset.id
                        );

                    }
                );


            if(selected.length === 0){

                return;

            }


            chats =
                chats.filter(
                    function(chat){

                        return !selected.includes(
                            String(chat.id)
                        );

                    }
                );


            saveChats();

            renderRecent();

            renderPinned();

            renderHistory();

        };

}

/* =====================================================
   SHARE
===================================================== */

shareButton.addEventListener(
    "click",
    async function(){

        let text =
            "Viggo AI Chat\n\n";


        document
        .querySelectorAll(".message")
        .forEach(
            function(message){

                const name =
                    message.querySelector(
                        ".message-name"
                    );

                const content =
                    message.querySelector(
                        ".message-text"
                    );


                if(name && content){

                    text +=
                        name.textContent +
                        ": " +
                        content.textContent +
                        "\n\n";

                }

            }
        );


        if(navigator.share){

            try{

                await navigator.share({
                    title:"Viggo AI",
                    text:text
                });

            }catch(error){}

        }else{

            navigator.clipboard.writeText(text);

            shareButton.textContent =
                "✓ Copied";

            setTimeout(
                function(){

                    shareButton.textContent =
                        "↗ Share";

                },
                1500
            );

        }

    }
);

/* =====================================================
   SPEECH
===================================================== */

function speakText(text){

    if(!voiceEnabled){
        return;
    }

    if(!("speechSynthesis" in window)){
        return;
    }


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            String(text)
        );


    const voices =
        speechSynthesis.getVoices();


    let selected = null;


    if(currentVoice === "female"){

        selected =
            voices.find(
                function(v){

                    return /female|zira|samantha|karen|susan|google us english/i
                    .test(v.name);

                }
            );

    }else{

        selected =
            voices.find(
                function(v){

                    return /male|david|alex|daniel|google uk english/i
                    .test(v.name);

                }
            );

    }


    if(selected){
        utterance.voice = selected;
    }


    utterance.rate = 1;
    utterance.pitch = 1;

    speechSynthesis.speak(
        utterance
    );

}


/* =====================================================
   MICROPHONE
===================================================== */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition = null;


if(SpeechRecognition){

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "en-IN";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;


    recognition.onstart =
        function(){

            micButton.classList.add(
                "recording"
            );

            micButton.textContent =
                "🔴";

        };


    recognition.onend =
        function(){

            micButton.classList.remove(
                "recording"
            );

            micButton.textContent =
                "🎤";

        };


    recognition.onresult =
        function(event){

            messageInput.value =
                event.results[0][0]
                .transcript;

            messageInput.focus();

        };

}


micButton.addEventListener(
    "click",
    function(){

        if(!recognition){
            return;
        }

        try{
            recognition.start();
        }catch(error){}

    }
);


/* =====================================================
   INITIAL
===================================================== */

renderRecent();

renderPinned();

</script>
