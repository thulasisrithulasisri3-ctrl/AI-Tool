<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Viggo AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- =====================================================
     SIDEBAR
===================================================== -->

<aside class="sidebar" id="sidebar">

    <div class="sidebar-header">
        <h2>Viggo AI</h2>

        <button
            class="icon-btn"
            id="closeSidebar"
            type="button"
            aria-label="Close sidebar">
            ✕
        </button>
    </div>


    <!-- NEW CHAT -->

    <button
        class="new-chat"
        id="newChat"
        type="button">
        ＋ New Chat
    </button>


    <!-- SEARCH -->

    <div class="search-box">

        <span>🔍</span>

        <input
            type="text"
            id="searchChat"
            placeholder="Search chats..."
            autocomplete="off">

    </div>


    <!-- HISTORY TITLE -->

    <div class="history-title">
        CHAT HISTORY
    </div>


    <!-- CHAT HISTORY -->

    <div
        class="chat-history"
        id="chatHistory">
    </div>


    <!-- MORE -->

    <div class="sidebar-more">

        <div
            class="more-menu"
            id="moreMenu">

            <button
                id="voiceMenuBtn"
                type="button">
                🎤 Voice
            </button>

            <button
                id="languageBtn"
                type="button">
                🌐 Language
            </button>

            <button
                id="selectChatsBtn"
                type="button">
                ☑️ Select Chat
            </button>

            <button
                id="deleteSelectedBtn"
                type="button">
                🗑️ Delete Selected
            </button>

            <button
                id="clearChatBtn"
                type="button">
                🧹 Clear Chat
            </button>

        </div>


        <button
            class="more-button"
            id="moreBtn"
            type="button">

            <span class="more-dots">⋯</span>

            <span>More</span>

        </button>

    </div>

</aside>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="main">


    <!-- =================================================
         TOP BAR
    ================================================= -->

    <header class="topbar">

        <div class="top-left">

            <button
                class="menu-btn"
                id="openSidebar"
                type="button"
                aria-label="Open sidebar">
                ☰
            </button>

            <div class="brand">
                Viggo AI
            </div>

        </div>


        <button
            class="share-btn"
            id="shareBtn"
            type="button">
            ↗ Share
        </button>

    </header>


    <!-- =================================================
         CHAT AREA
    ================================================= -->

    <section class="chat-area">

        <div
            class="conversation"
            id="conversation">
        </div>

    </section>


    <!-- =================================================
         INPUT AREA
    ================================================= -->

    <div class="input-area">


        <!-- PLUS -->

        <button
            class="input-plus"
            id="plusBtn"
            type="button"
            aria-label="Add">
            ＋
        </button>


        <!-- PLUS MENU -->

        <div
            class="plus-menu"
            id="plusMenu">


            <!-- PHOTO -->

            <button
                id="photoBtn"
                type="button">
                📷 Photo
            </button>


            <!-- VIDEO -->

            <button
                id="videoBtn"
                type="button">
                🎥 Video
            </button>


            <!-- FILE -->

            <button
                id="fileBtn"
                type="button">
                📎 File
            </button>


            <!-- VOICE -->

            <button
                id="plusVoiceBtn"
                type="button">
                🎤 Voice
            </button>

        </div>


        <!-- MESSAGE -->

        <textarea
            id="message"
            placeholder="Message Viggo AI..."
            rows="1"></textarea>


        <!-- MICROPHONE -->

        <button
            class="input-icon"
            id="mic"
            type="button"
            aria-label="Voice input">
            🎤
        </button>


        <!-- SEND -->

        <button
            class="send-btn"
            id="send"
            type="button"
            aria-label="Send">
            ➤
        </button>

    </div>

</main>


<!-- =====================================================
     VOICE MODAL
===================================================== -->

<div
    class="modal"
    id="voiceModal">

    <div class="modal-box">

        <button
            class="modal-close"
            id="closeVoice"
            type="button">
            ✕
        </button>

        <h3>
            🎤 Voice Settings
        </h3>

        <select id="voiceSelect">
            <option value="en-IN">
                English
            </option>

            <option value="ta-IN">
                தமிழ்
            </option>

            <option value="hi-IN">
                हिन्दी
            </option>
        </select>

        <button
            class="modal-button"
            id="startVoice"
            type="button">
            Start Voice
        </button>

    </div>

</div>


<!-- =====================================================
     LANGUAGE MODAL
===================================================== -->

<div
    class="modal"
    id="languageModal">

    <div class="modal-box">

        <button
            class="modal-close"
            id="closeLanguage"
            type="button">
            ✕
        </button>

        <h3>
            🌐 Select Language
        </h3>

        <select id="languageSelect">

            <option value="en-IN">
                English
            </option>

            <option value="ta-IN">
                தமிழ்
            </option>

            <option value="hi-IN">
                हिन्दी
            </option>

        </select>

        <button
            class="modal-button"
            id="saveLanguage"
            type="button">
            Save Language
        </button>

    </div>

</div>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script src="script.js"></script>

</body>
</html>
