<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viggo AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #07101a;
    color: white;
    height: 100vh;
    overflow: hidden;
}

.app {
    display: flex;
    height: 100vh;
    background:
        radial-gradient(circle at top right,
        #123b68,
        #07101a 48%,
        #03070c);
}

/* ================= SIDEBAR ================= */

.sidebar {
    width: 260px;
    min-width: 260px;
    height: 100vh;

    background: rgba(5, 11, 18, .97);

    border-right: 1px solid #1d354d;

    padding: 18px;

    display: flex;
    flex-direction: column;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo-icon {
    width: 42px;
    height: 42px;

    border-radius: 12px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: linear-gradient(
        135deg,
        #2695ff,
        #07559d
    );

    font-size: 22px;
    font-weight: bold;
}

.logo-name {
    font-size: 21px;
    font-weight: 600;
}

.online {
    margin-left: 52px;
    margin-top: 5px;

    color: #48df89;
    font-size: 11px;
}

.online-dot {
    display: inline-block;

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #35dc79;

    margin-right: 5px;
}

/* ================= NEW CHAT ================= */

.new-chat {
    width: 100%;

    margin-top: 25px;

    padding: 11px;

    border-radius: 10px;

    border: 1px solid #1768ae;

    background: linear-gradient(
        135deg,
        #116fc4,
        #073d70
    );

    color: white;

    cursor: pointer;

    text-align: left;

    font-size: 14px;
}

.new-chat:hover {
    background: #116eb8;
}

/* ================= SECTIONS ================= */

.section-title {
    margin-top: 24px;
    margin-bottom: 8px;

    color: #718ba5;

    font-size: 11px;
    font-weight: bold;

    text-transform: uppercase;
}

.chat-list {
    display: flex;
    flex-direction: column;
    gap: 4px;

    overflow-y: auto;
}

.chat-item {
    width: 100%;

    padding: 9px 10px;

    border: none;

    border-radius: 8px;

    background: transparent;

    color: #d7e7f7;

    cursor: pointer;

    text-align: left;

    font-size: 13px;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.chat-item:hover {
    background: #102437;
}

.empty-list {
    padding: 8px 10px;

    color: #557089;

    font-size: 12px;
}

/* ================= MORE ================= */

.more-area {
    margin-top: auto;
    position: relative;
}

.more-button {
    width: 100%;

    padding: 11px;

    border-radius: 10px;

    border: 1px solid #284761;

    background: #0b1724;

    color: #dcecff;

    cursor: pointer;

    text-align: left;

    font-size: 14px;
}

.more-button:hover {
    background: #102b42;
}

.more-menu {
    display: none;

    position: absolute;

    left: 0;
    right: 0;
    bottom: 52px;

    padding: 7px;

    background: #091522;

    border: 1px solid #284b67;

    border-radius: 12px;

    box-shadow:
        0 15px 40px rgba(0,0,0,.7);

    z-index: 1000;
}

.more-menu.show {
    display: block;
}

.more-menu button {
    width: 100%;

    padding: 10px;

    border: none;

    border-radius: 8px;

    background: transparent;

    color: #dcecff;

    cursor: pointer;

    text-align: left;

    font-size: 13px;
}

.more-menu button:hover {
    background: #10304b;
}

/* ================= MAIN ================= */

.main {
    flex: 1;

    min-width: 0;

    height: 100vh;

    display: flex;
    flex-direction: column;
}

/* ================= HEADER ================= */

.top-header {
    height: 60px;

    display: flex;
    align-items: center;

    padding: 0 20px;

    background: rgba(5,11,18,.9);

    border-bottom: 1px solid #1a3046;
}

.header-title {
    font-size: 14px;
    color: #e6f1fc;
}

.share-button {
    margin-left: auto;

    padding: 7px 14px;

    border-radius: 8px;

    border: 1px solid #216ca8;

    background: #0b3154;

    color: white;

    cursor: pointer;

    font-size: 13px;
}

.share-button:hover {
    background: #12517f;
}

/* ================= CHAT AREA ================= */

.chat-area {
    flex: 1;

    overflow-y: auto;

    padding: 25px 20px;
}

.conversation {
    width: 100%;
    max-width: 850px;

    margin: auto;
}

/* ================= WELCOME ================= */

.welcome {
    min-height: 100%;

    padding-top: 80px;

    text-align: center;
}

.welcome-icon {
    width: 70px;
    height: 70px;

    margin: auto;

    border-radius: 18px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: linear-gradient(
        135deg,
        #2695ff,
        #07559d
    );

    font-size: 34px;
    font-weight: bold;

    box-shadow:
        0 10px 35px rgba(0,120,255,.3);
}

.welcome h1 {
    margin-top: 16px;
    font-size: 28px;
}

.welcome p {
    margin-top: 7px;

    color: #718ba5;

    font-size: 14px;
}

/* ================= MESSAGE ================= */

.message {
    display: flex;

    gap: 11px;

    margin-bottom: 22px;
}

.avatar {
    width: 36px;
    height: 36px;

    min-width: 36px;

    border-radius: 10px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #0c63a9;

    font-size: 14px;
    font-weight: bold;
}

.user-avatar {
    background: #263a50;
}

.message-content {
    min-width: 0;
}

.message-name {
    margin-bottom: 5px;

    color: #6d9bc5;

    font-size: 11px;
}

.message-text {
    color: #e7f1fa;

    font-size: 14px;

    line-height: 1.65;

    white-space: pre-wrap;

    word-break: break-word;
}

/* ================= MESSAGE BUTTONS ================= */

.message-actions {
    display: flex;

    gap: 6px;

    margin-top: 9px;
}

.message-actions button {
    padding: 5px 8px;

    border-radius: 7px;

    border: 1px solid #24445f;

    background: #0a1724;

    color: #9db9d2;

    cursor: pointer;

    font-size: 11px;
}

.message-actions button:hover {
    background: #10304b;

    color: white;
}

/* ================= INPUT ================= */

.input-area {
    padding: 12px 20px 18px;

    border-top: 1px solid #1a3046;

    background: #060c14;
}

.input-wrapper {
    max-width: 850px;

    margin: auto;

    display: flex;

    align-items: center;

    gap: 8px;

    padding: 7px 8px 7px 14px;

    border-radius: 20px;

    background: #151b24;

    border: 1px solid #26394d;
}

.message-input {
    flex: 1;

    min-width: 0;

    padding: 8px 3px;

    border: none;

    outline: none;

    background: transparent;

    color: white;

    font-size: 14px;
}

.message-input::placeholder {
    color: #61758a;
}

/* ================= MIC ================= */

.mic-button {
    width: 38px;
    height: 38px;

    min-width: 38px;

    border-radius: 50%;

    border: 1px solid #31536f;

    background: #10283e;

    color: white;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;
}

.mic-button:hover {
    background: #16476d;
}

.mic-button.recording {
    background: #b52d3a;

    border-color: #ef5967;
}

/* ================= SEND ================= */

.send-button {
    width: 38px;
    height: 38px;

    min-width: 38px;

    border: none;

    border-radius: 50%;

    background: linear-gradient(
        135deg,
        #2695ff,
        #07559d
    );

    color: white;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 16px;
}

.send-button:hover {
    transform: scale(1.05);
}

/* ================= HISTORY MODAL ================= */

.modal {
    display: none;

    position: fixed;

    inset: 0;

    z-index: 5000;

    background: rgba(0,0,0,.72);

    padding: 30px;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: 100%;
    max-width: 700px;

    max-height: 80vh;

    overflow-y: auto;

    margin: auto;

    padding: 20px;

    border-radius: 15px;

    border: 1px solid #274b68;

    background: #0a1623;
}

.modal-header {
    display: flex;

    justify-content: space-between;
    align-items: center;

    margin-bottom: 15px;
}

.close-button {
    border: none;

    background: transparent;

    color: white;

    font-size: 25px;

    cursor: pointer;
}

.history-item {
    padding: 12px;

    margin-bottom: 8px;

    border-radius: 9px;

    border: 1px solid #203b53;

    background: #0d1c2b;

    cursor: pointer;
}

.history-item:hover {
    background: #102b42;
}

.history-time {
    margin-top: 5px;

    color: #637d95;

    font-size: 10px;
}

/* ================= MOBILE ================= */

@media(max-width:700px) {

    .sidebar {
        width: 220px;
        min-width: 220px;

        padding: 13px;
    }

    .chat-area {
        padding: 18px 12px;
    }

    .input-area {
        padding: 10px;
    }

    .top-header {
        padding: 0 12px;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- ==================================================
     SIDEBAR
================================================== -->

<aside class="sidebar">

    <div class="logo">

        <div class="logo-icon">
            B
        </div>

        <div class="logo-name">
            Viggo
        </div>

    </div>

    <div class="online">
        <span class="online-dot"></span>
        Online
    </div>


    <!-- NEW CHAT -->

    <button
        class="new-chat"
        id="newChat">

        ＋ New Chat

    </button>


    <!-- PINNED -->

    <div class="section-title">
        Pinned
    </div>

    <div
        class="chat-list"
        id="pinnedList">

        <div class="empty-list">
            No pinned chats
        </div>

    </div>


    <!-- RECENT -->

    <div class="section-title">
        Recent
    </div>

    <div
        class="chat-list"
        id="recentList">

        <div class="empty-list">
            No recent chats
        </div>

    </div>


    <!-- MORE -->

    <div class="more-area">

        <button
            class="more-button"
            id="moreButton">

            ⋮ More

        </button>


        <div
            class="more-menu"
            id="moreMenu">

            <button id="saveButton">
                💾 Save
            </button>

            <button id="historyButton">
                🕘 History
            </button>

            <button id="pinButton">
                📌 Pin Chat
            </button>

            <button id="voiceToggle">
                🔊 Voice ON
            </button>

            <button id="femaleVoice">
                🎙️ Female Voice
            </button>

            <button id="maleVoice">
                🎙️ Male Voice
            </button>

            <button id="clearHistory">
                🗑️ Clear History
            </button>

        </div>

    </div>

</aside>


<!-- ==================================================
     MAIN
================================================== -->

<main class="main">

    <!-- HEADER -->

    <header class="top-header">

        <div
            class="header-title"
            id="headerTitle">

            New Chat

        </div>

        <!-- SHARE ONLY -->

        <button
            class="share-button"
            id="shareButton">

            ↗ Share

        </button>

    </header>


    <!-- CHAT -->

    <section
        class="chat-area"
        id="chatArea">

        <div
            class="conversation"
            id="conversation">

            <div
                class="welcome"
                id="welcome">

                <div class="welcome-icon">
                    B
                </div>

                <h1>
                    Viggo
                </h1>

                <p>
                    Your AI friend is ready.
                </p>

            </div>

        </div>

    </section>


    <!-- INPUT -->

    <div class="input-area">

        <div class="input-wrapper">

            <input
                type="text"
                id="messageInput"
                class="message-input"
                placeholder="Message Viggo..."
                autocomplete="off"
            >


            <button
                id="micButton"
                class="mic-button"
                title="Voice Input">

                🎤

            </button>


            <button
                id="sendButton"
                class="send-button"
                title="Send">

                ➤

            </button>

        </div>

    </div>

</main>

</div>


<!-- ==================================================
     HISTORY MODAL
================================================== -->

<div
    class="modal"
    id="historyModal">

    <div class="modal-box">

        <div class="modal-header">

            <h3>
                🕘 Chat History
            </h3>

            <button
                class="close-button"
                id="closeHistory">

                ×

            </button>

        </div>

        <div id="historyList"></div>

    </div>

</div>


<script>

/* ==================================================
   API
================================================== */

/*
   உங்கள் real Viggo server URL இருந்தால் இங்கே போடவும்.

   Example:

   const API_URL = "https://your-viggo-server.onrender.com/chat";

   இப்போது blank ஆக இருப்பதால் demo response வரும்.
*/

const API_URL = "";


/* ==================================================
   ELEMENTS
================================================== */

const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");

const conversation =
    document.getElementById("conversation");

const welcome =
    document.getElementById("welcome");

const newChat =
    document.getElementById("newChat");

const moreButton =
    document.getElementById("moreButton");

const moreMenu =
    document.getElementById("moreMenu");

const shareButton =
    document.getElementById("shareButton");

const pinnedList =
    document.getElementById("pinnedList");

const recentList =
    document.getElementById("recentList");

const historyModal =
    document.getElementById("historyModal");

const historyList =
    document.getElementById("historyList");

const closeHistory =
    document.getElementById("closeHistory");


/* ==================================================
   STATE
================================================== */

let chats =
    JSON.parse(
        localStorage.getItem("viggoChats") || "[]"
    );

let voiceEnabled = true;

let currentVoice = "female";


/* ==================================================
   CLEAN OLD / INVALID DATA
================================================== */

chats = chats
    .filter(chat => chat && typeof chat === "object")
    .map(chat => {

        return {

            id:
                chat.id ||
                Date.now() +
                Math.random(),

            title:
                chat.title ||
                chat.message ||
                "New Chat",

            message:
                chat.message ||
                chat.text ||
                "",

            time:
                chat.time ||
                new Date().toLocaleString(),

            pinned:
                chat.pinned === true

        };

    })
    .filter(chat => chat.message);


saveChats();


/* ==================================================
   MORE MENU
================================================== */

moreButton.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        moreMenu.classList.toggle("show");

    }
);


moreMenu.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

    }
);


document.addEventListener(
    "click",
    function() {

        moreMenu.classList.remove("show");

    }
);


/* ==================================================
   ADD MESSAGE
================================================== */

function addMessage(
    text,
    sender
) {

    if (!text) {
        return;
    }


    welcome.style.display = "none";


    const message =
        document.createElement("div");

    message.className =
        "message";


    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar " +
        (
            sender === "user"
                ? "user-avatar"
                : ""
        );

    avatar.textContent =
        sender === "user"
            ? "U"
            : "B";


    const content =
        document.createElement("div");

    content.className =
        "message-content";


    const name =
        document.createElement("div");

    name.className =
        "message-name";

    name.textContent =
        sender === "user"
            ? "You"
            : "Viggo";


    const textDiv =
        document.createElement("div");

    textDiv.className =
        "message-text";

    textDiv.textContent =
        String(text);


    content.appendChild(name);

    content.appendChild(textDiv);


    /* AI ACTION BUTTONS */

    if (sender === "assistant") {

        const actions =
            document.createElement("div");

        actions.className =
            "message-actions";


        const copy =
            document.createElement("button");

        copy.textContent =
            "📋 Copy";

        copy.onclick =
            function() {

                navigator.clipboard.writeText(
                    String(text)
                );

                copy.textContent =
                    "✓ Copied";

                setTimeout(
                    () => {
                        copy.textContent =
                            "📋 Copy";
                    },
                    1200
                );

            };


        const speaker =
            document.createElement("button");

        speaker.textContent =
            "🔊 Speaker";

        speaker.onclick =
            function() {

                speakText(
                    String(text)
                );

            };


        const like =
            document.createElement("button");

        like.textContent =
            "👍 Like";

        like.onclick =
            function() {

                like.textContent =
                    "❤️ Liked";

            };


        actions.appendChild(copy);

        actions.appendChild(speaker);

        actions.appendChild(like);

        content.appendChild(actions);

    }


    message.appendChild(avatar);

    message.appendChild(content);

    conversation.appendChild(message);


    scrollChat();

}


/* ==================================================
   SCROLL
================================================== */

function scrollChat() {

    const area =
        document.getElementById(
            "chatArea"
        );

    area.scrollTop =
        area.scrollHeight;

}


/* ==================================================
   SAVE CHAT
================================================== */

function saveChat(text) {

    if (!text) {
        return;
    }


    const cleanText =
        String(text).trim();


    if (!cleanText) {
        return;
    }


    const chat = {

        id:
            Date.now(),

        title:
            cleanText.length > 35
                ? cleanText.substring(
                    0,
                    35
                ) + "..."
                : cleanText,

        message:
            cleanText,

        time:
            new Date().toLocaleString(),

        pinned:
            false

    };


    chats.push(chat);


    saveChats();

    renderRecent();

    renderPinned();

}


/* ==================================================
   LOCAL STORAGE
================================================== */

function saveChats() {

    localStorage.setItem(
        "viggoChats",
        JSON.stringify(chats)
    );

}


/* ==================================================
   SEND MESSAGE
================================================== */

async function sendMessage() {

    const text =
        messageInput.value.trim();


    if (!text) {
        return;
    }


    /* Show user */

    addMessage(
        text,
        "user"
    );


    /* Save Recent */

    saveChat(text);


    /* Clear input */

    messageInput.value = "";


    /* Real API */

    if (API_URL) {

        try {

            const response =
                await fetch(
                    API_URL,
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                message: text
                            })

                    }
                );


            if (!response.ok) {
                throw new Error(
                    "Server error"
                );
            }


            const data =
                await response.json();


            const reply =
                data.reply ||
                data.response ||
                data.message ||
                data.answer;


            if (
                reply !== undefined &&
                reply !== null
            ) {

                addMessage(
                    String(reply),
                    "assistant"
                );

                speakText(
                    String(reply)
                );

            } else {

                addMessage(
                    "Viggo server connected, but no reply was returned.",
                    "assistant"
                );

            }

            return;

        } catch(error) {

            console.error(
                "Viggo API Error:",
                error
            );


            addMessage(
                "Sorry friend, I couldn't connect to Viggo AI right now.",
                "assistant"
            );

            return;
        }

    }


    /* Demo response */

    setTimeout(
        function() {

            const reply =
                "Okay friend, I received your message: " +
                text;


            addMessage(
                reply,
                "assistant"
            );


            speakText(reply);

        },
        500
    );

}


/* ==================================================
   SEND BUTTON
================================================== */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* ==================================================
   ENTER KEY
================================================== */

messageInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* ==================================================
   NEW CHAT
================================================== */

newChat.addEventListener(
    "click",
    function() {

        conversation.innerHTML = "";


        const newWelcome =
            document.createElement(
                "div"
            );

        newWelcome.className =
            "welcome";

        newWelcome.innerHTML = `
            <div class="welcome-icon">B</div>
            <h1>Viggo</h1>
            <p>Your AI friend is ready.</p>
        `;


        conversation.appendChild(
            newWelcome
        );


        document.getElementById(
            "headerTitle"
        ).textContent =
            "New Chat";


        messageInput.value = "";


        speechSynthesis.cancel();

    }
);


/* ==================================================
   RECENT
================================================== */

function renderRecent() {

    recentList.innerHTML = "";


    if (
        !chats ||
        chats.length === 0
    ) {

        recentList.innerHTML =
            '<div class="empty-list">No recent chats</div>';

        return;
    }


    chats
        .slice()
        .reverse()
        .slice(0, 8)
        .forEach(
            function(chat) {

                const item =
                    document.createElement(
                        "button"
                    );

                item.className =
                    "chat-item";


                const title =
                    chat.title ||
                    chat.message ||
                    "New Chat";


                item.textContent =
                    "💬 " +
                    title;


                item.onclick =
                    function() {

                        messageInput.value =
                            chat.message || "";

                        messageInput.focus();

                    };


                recentList.appendChild(
                    item
                );

            }
        );

}


/* ==================================================
   PINNED
================================================== */

function renderPinned() {

    pinnedList.innerHTML = "";


    const pinned =
        chats.filter(
            chat =>
                chat &&
                chat.pinned === true
        );


    if (
        pinned.length === 0
    ) {

        pinnedList.innerHTML =
            '<div class="empty-list">No pinned chats</div>';

        return;
    }


    pinned
        .slice()
        .reverse()
        .forEach(
            function(chat) {

                const item =
                    document.createElement(
                        "button"
                    );

                item.className =
                    "chat-item";


                item.textContent =
                    "📌 " +
                    (
                        chat.title ||
                        chat.message ||
                        "Pinned Chat"
                    );


                item.onclick =
                    function() {

                        messageInput.value =
                            chat.message || "";

                        messageInput.focus();

                    };


                pinnedList.appendChild(
                    item
                );

            }
        );

}


/* ==================================================
   PIN LAST CHAT
================================================== */

document
    .getElementById("pinButton")
    .addEventListener(
        "click",
        function() {

            if (
                chats.length === 0
            ) {

                moreMenu.classList.remove(
                    "show"
                );

                return;

            }


            chats[
                chats.length - 1
            ].pinned = true;


            saveChats();

            renderPinned();


            moreMenu.classList.remove(
                "show"
            );

        }
    );


/* ==================================================
   HISTORY
================================================== */

function renderHistory() {

    historyList.innerHTML = "";


    if (
        !chats ||
        chats.length === 0
    ) {

        historyList.innerHTML =
            "<p style='color:#718ba5'>No chat history.</p>";

        return;
    }


    chats
        .slice()
        .reverse()
        .forEach(
            function(chat) {

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "history-item";


                const title =
                    chat.title ||
                    chat.message ||
                    "New Chat";


                const time =
                    chat.time ||
                    "";


                item.innerHTML = `
                    <div>
                        💬 ${escapeHTML(title)}
                    </div>

                    <div class="history-time">
                        ${escapeHTML(time)}
                    </div>
                `;


                item.onclick =
                    function() {

                        messageInput.value =
                            chat.message || "";

                        historyModal.classList.remove(
                            "show"
                        );

                    };


                historyList.appendChild(
                    item
                );

            }
        );

}


document
    .getElementById("historyButton")
    .addEventListener(
        "click",
        function() {

            renderHistory();

            historyModal.classList.add(
                "show"
            );

            moreMenu.classList.remove(
                "show"
            );

        }
    );


/* ==================================================
   CLOSE HISTORY
================================================== */

closeHistory.addEventListener(
    "click",
    function() {

        historyModal.classList.remove(
            "show"
        );

    }
);


/* ==================================================
   CLEAR HISTORY
================================================== */

document
    .getElementById("clearHistory")
    .addEventListener(
        "click",
        function() {

            chats = [];

            saveChats();

            renderRecent();

            renderPinned();

            historyList.innerHTML = "";

            moreMenu.classList.remove(
                "show"
            );

        }
    );


/* ==================================================
   SAVE
================================================== */

document
    .getElementById("saveButton")
    .addEventListener(
        "click",
        function() {

            saveChats();

            moreMenu.classList.remove(
                "show"
            );

        }
    );


/* ==================================================
   SHARE
================================================== */

shareButton.addEventListener(
    "click",
    async function() {

        const messages =
            [
                ...document.querySelectorAll(
                    ".message"
                )
            ];


        if (
            messages.length === 0
        ) {

            return;

        }


        let shareText =
            "Viggo AI Chat\n\n";


        messages.forEach(
            function(message) {

                const name =
                    message.querySelector(
                        ".message-name"
                    );

                const text =
                    message.querySelector(
                        ".message-text"
                    );


                if (
                    name &&
                    text
                ) {

                    shareText +=
                        name.textContent +
                        ": " +
                        text.textContent +
                        "\n\n";

                }

            }
        );


        if (
            navigator.share
        ) {

            try {

                await navigator.share({

                    title:
                        "Viggo AI",

                    text:
                        shareText

                });

            } catch(error) {

                console.log(
                    "Share cancelled"
                );

            }

        } else {

            await navigator.clipboard.writeText(
                shareText
            );

            shareButton.textContent =
                "✓ Copied";

            setTimeout(
                function() {

                    shareButton.textContent =
                        "↗ Share";

                },
                1500
            );

        }

    }
);


/* ==================================================
   VOICE ON/OFF
================================================== */

document
    .getElementById("voiceToggle")
    .addEventListener(
        "click",
        function() {

            voiceEnabled =
                !voiceEnabled;


            this.textContent =
                voiceEnabled
                    ? "🔊 Voice ON"
                    : "🔇 Voice OFF";

        }
    );


/* ==================================================
   FEMALE VOICE
================================================== */

document
    .getElementById("femaleVoice")

            currentVoice =
                "female";

            voiceEnabled =

/* ==================================================
   MALE VOICE
================================================== */

document
    .getElementById("maleVoice")

            currentVoice =
                "male";

            voiceEnabled =
                true;


            speakText(

            );


            moreMenu.classList.remove(

        }

/* ==================================================
   SPEECH OUTPUT
================================================== */

function speakText(text) {

    if (
        !voiceEnabled
    ) {
        return;
    }


    if (
        !("speechSynthesis" in window)
    ) {
        return;
    }


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            String(text)
        );


    const voices =
        speechSynthesis.getVoices();


    let selectedVoice =
        null;


    if (
        currentVoice === "female"
    ) {

        selectedVoice =
            voices.find(
                voice =>
                    /female|zira|samantha|karen|susan|google us english/i
                    .test(
                        voice.name
                    )
            );

    } else {

        selectedVoice =
            voices.find(
                voice =>
                    /male|david|alex|daniel|google uk english/i
                    .test(
                        voice.name
                    )
            );

    }


    if (
        selectedVoice
    ) {

        utterance.voice =
            selectedVoice;

    }


    utterance.rate =
        1;

    utterance.pitch =
        1;


    speechSynthesis.speak(
        utterance
    );

}


/* ==================================================
   MIC
================================================== */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition = null;


if (
    SpeechRecognition
) {

    recognition =
        new SpeechRecognition();


    recognition.lang =
        "en-IN";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.onstart =
        function() {

            micButton.classList.add(
                "recording"
            );

            micButton.textContent =
                "🔴";

        };


    recognition.onend =
        function() {

            micButton.classList.remove(
                "recording"
            );

            micButton.textContent =
                "🎤";

        };


    recognition.onerror =
        function() {

            micButton.classList.remove(
                "recording"
            );

            micButton.textContent =
                "🎤";

        };


    recognition.onresult =
        function(event) {

            const result =
                event.results[0][0]
                    .transcript;


            messageInput.value =
                result;


            messageInput.focus();

        };

}


micButton.addEventListener(
    "click",
    function() {

        if (
            !recognition
        ) {

            return;

        }


        try {

            recognition.start();

        } catch(error) {

            console.log(
                "Microphone already running"
            );

        }

    }
);


/* ==================================================
   ESCAPE HTML
================================================== */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        String(text);

    return div.innerHTML;
}


/* ==================================================
   INITIAL LOAD
================================================== */

renderRecent();

renderPinned();

</script>
