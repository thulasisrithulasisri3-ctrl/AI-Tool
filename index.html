<!DOCTYPE html>
<html lang="en">

<head>

  <link rel="icon" type="image/png" href="icon.png?v=2">

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Viggo AI</title>

  <link
    rel="stylesheet"
    href="style.css?v=5"
  >

</head>


<body>


  <!-- =========================================
       SIDEBAR
  ========================================== -->

  <aside
    class="sidebar"
    id="sidebar"
  >

    <div class="sidebar-header">

      <h2>Viggo AI</h2>

      <button
        id="closeSidebar"
        class="icon-btn"
        type="button"
      >
        ✕
      </button>

    </div>


    <!-- NEW CHAT -->

    <button
      id="newChat"
      class="new-chat"
      type="button"
    >
      ＋ New Chat
    </button>


    <!-- SEARCH -->

    <div class="search-box">

      <span>🔎</span>

      <input
        id="searchChat"
        type="text"
        placeholder="Search Chat"
        autocomplete="off"
      >

    </div>


    <div class="history-title">
      CHAT HISTORY
    </div>


    <div
      id="chatHistory"
      class="chat-history"
    ></div>


    <!-- MORE -->

    <div class="sidebar-more">

      <button
        id="moreBtn"
        class="more-button"
        type="button"
      >

        <span class="more-dots">⋮</span>

        <span>More</span>

      </button>


      <!-- MORE MENU -->

      <div
        id="moreMenu"
        class="more-menu"
      >

        <button
          id="voiceMenuBtn"
          type="button"
        >
          🎤 Voice
        </button>


        <button
          id="languageBtn"
          type="button"
        >
          🌐 Language
        </button>


        <button
          id="clearChatBtn"
          type="button"
        >
          🗑 Clear Chat
        </button>


        <button
          id="showHistoryBtn"
          type="button"
        >
          🕘 Show History
        </button>


        <button
          id="savedChatsBtn"
          type="button"
        >
          💾 Saved Chats
        </button>


        <button
          id="selectChatsBtn"
          type="button"
        >
          ☑ Select Chats
        </button>


        <button
          id="deleteSelectedBtn"
          type="button"
        >
          🗑 Delete Selected
        </button>

      </div>

    </div>

  </aside>



  <!-- =========================================
       MAIN
  ========================================== -->

  <main class="main">


    <!-- TOP BAR -->

    <header class="topbar">

      <div class="top-left">

        <button
          id="openSidebar"
          class="menu-btn"
          type="button"
        >
          ☰
        </button>


        <div class="brand">
          Viggo AI
        </div>

      </div>


      <button
        id="shareBtn"
        class="share-btn"
        type="button"
      >
        🔗 Share
      </button>

    </header>



    <!-- CHAT -->

    <section class="chat-area">

      <div
        id="conversation"
        class="conversation"
      ></div>

    </section>



    <!-- INPUT -->

    <div class="input-area">


      <button
        id="plusBtn"
        class="input-plus"
        type="button"
      >
        ＋
      </button>


      <textarea
        id="message"
        rows="1"
        placeholder="Message Viggo AI..."
        autocomplete="off"
      ></textarea>


      <button
        id="mic"
        class="input-icon"
        type="button"
        title="Voice input"
      >
        🎤
      </button>


      <button
        id="send"
        class="send-btn"
        type="button"
        title="Send"
      >
        ➤
      </button>

    </div>

  </main>



  <!-- =========================================
       PLUS MENU
  ========================================== -->

  <div
    id="plusMenu"
    class="plus-menu"
  >

    <button
      type="button"
      data-action="photo"
    >
      📷 Photo
    </button>


    <button
      type="button"
      data-action="video"
    >
      🎥 Video
    </button>


    <button
      type="button"
      data-action="file"
    >
      📎 File
    </button>


    <button
      id="plusVoiceBtn"
      type="button"
      data-action="voice"
    >
      🎤 Voice
    </button>

  </div>



  <!-- =========================================
       VOICE MODAL
  ========================================== -->

  <div
    id="voiceModal"
    class="modal"
  >

    <div class="modal-box">

      <button
        id="closeVoice"
        class="modal-close"
        type="button"
      >
        ✕
      </button>


      <h3>
        Voice Settings
      </h3>


      <select id="voiceSelect">

        <option value="female">
          Female Voice
        </option>

        <option value="male">
          Male Voice
        </option>

      </select>


      <button
        id="voiceTest"
        class="modal-button"
        type="button"
      >
        🔊 Test Voice
      </button>

    </div>

  </div>



  <!-- =========================================
       LANGUAGE MODAL
  ========================================== -->

  <div
    id="languageModal"
    class="modal"
  >

    <div class="modal-box">

      <button
        id="closeLanguage"
        class="modal-close"
        type="button"
      >
        ✕
      </button>


      <h3>
        Select Language
      </h3>


      <select id="languageSelect">

        <option value="en-IN">
          🇮🇳 English
        </option>

        <option value="ta-IN">
          🇮🇳 தமிழ்
        </option>

        <option value="hi-IN">
          🇮🇳 हिन्दी
        </option>

        <option value="ml-IN">
          🇮🇳 മലയാളം
        </option>

        <option value="te-IN">
          🇮🇳 తెలుగు
        </option>

        <option value="kn-IN">
          🇮🇳 ಕನ್ನಡ
        </option>

      </select>


      <button
        id="saveLanguage"
        class="modal-button"
        type="button"
      >
        ✓ Save Language
      </button>

    </div>

  </div>



  <!-- =========================================
       SCRIPT
  ========================================== -->

  <script src="script.js?v=5"></script>

</body>

</html>
