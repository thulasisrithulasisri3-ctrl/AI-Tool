```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viggo AI</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ================= SIDEBAR ================= -->
<aside id="sidebar" class="sidebar">

    <div class="sidebar-header">
        <div class="brand">
            <div class="logo">V</div>
            <span>Viggo AI</span>
        </div>

        <button id="closeSidebarBtn" class="icon-btn" title="Close">
            ✕
        </button>
    </div>

    <button id="newChatBtn" class="new-chat-btn">
        ＋ New Chat
    </button>

    <div class="history-top">
        <span>Chat History</span>

        <button id="selectChatsBtn" class="small-btn">
            ☑ Select
        </button>
    </div>

    <div id="historyList" class="history-list"></div>

    <button id="deleteSelectedBtn"
            class="delete-selected-btn"
            style="display:none;">
        🗑 Delete Selected
    </button>

</aside>


<!-- ================= MAIN ================= -->
<main class="main">

    <!-- TOP BAR -->
    <header class="topbar">

        <button id="mobileMenuBtn"
                class="icon-btn"
                title="Menu">
            ☰
        </button>

        <div class="chat-title-area">
            <span id="chatTitle">New Chat</span>
        </div>

        <div class="top-actions">

            <button id="shareBtn"
                    class="icon-btn"
                    title="Share">
                ↗
            </button>

            <button id="moreBtn"
                    class="icon-btn"
                    title="More">
                ⋮
            </button>

        </div>

    </header>


    <!-- ================= MORE MENU ================= -->
    <div id="moreMenu" class="more-menu">

        <button id="saveBtn" class="menu-item">
            💾 Save Chat
        </button>

        <button id="selectChatsMenuBtn"
                class="menu-item">
            ☑ Select Chats
        </button>

        <button id="pinnedChatsBtn"
                class="menu-item">
            📌 Pinned Chats
        </button>

        <button id="deletedChatsBtn"
                class="menu-item">
            🗑 Delete / Clear History
        </button>

        <div class="menu-divider"></div>

        <div class="menu-label">
            🌐 Language
        </div>

        <button class="language-item"
                data-language="en">
            English
        </button>

        <button class="language-item"
                data-language="ta">
            தமிழ்
        </button>

        <button class="language-item"
                data-language="hi">
            हिन्दी
        </button>

        <button class="language-item"
                data-language="ml">
            മലയാളം
        </button>

        <button class="language-item"
                data-language="te">
            తెలుగు
        </button>

        <button class="language-item"
                data-language="kn">
            ಕನ್ನಡ
        </button>

        <div class="menu-divider"></div>

        <button id="voiceSettingsBtn"
                class="menu-item">
            🎤 Voice
        </button>

    </div>


    <!-- ================= MESSAGE AREA ================= -->
    <section id="messages" class="messages">

        <div class="welcome">

            <div class="big-logo">V</div>

            <h1>Viggo</h1>

            <p>
                Your AI friend is ready.
            </p>

        </div>

    </section>


    <!-- ================= INPUT ================= -->
    <footer class="input-area">

        <!-- PLUS -->
        <div class="plus-wrapper">

            <button id="plusBtn"
                    class="input-btn"
                    title="Attach">
                ＋
            </button>

            <div id="attachmentMenu"
                 class="attachment-menu">

                <button id="photoBtn"
                        class="attachment-item">
                    📷 Photo
                </button>

                <button id="videoBtn"
                        class="attachment-item">
                    🎥 Video
                </button>

                <button id="fileBtn"
                        class="attachment-item">
                    📎 File
                </button>

            </div>

        </div>


        <!-- HIDDEN FILE INPUTS -->
        <input id="photoInput"
               type="file"
               accept="image/*"
               hidden>

        <input id="videoInput"
               type="file"
               accept="video/*"
               hidden>

        <input id="fileInput"
               type="file"
               hidden>


        <!-- MESSAGE -->
        <textarea id="messageInput"
                  placeholder="Message Viggo..."
                  rows="1"></textarea>


        <!-- VOICE -->
        <button id="voiceBtn"
                class="input-btn"
                title="Voice">
            🎤
        </button>


        <!-- SEND -->
        <button id="sendBtn"
                class="send-btn"
                title="Send">
            ➤
        </button>

    </footer>

</main>


<!-- TOAST -->
<div id="viggoToast" class="toast"></div>


<script src="script.js"></script>

</body>
</html>
```
