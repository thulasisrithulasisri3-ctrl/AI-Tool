<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Viggo AI</title>

    <!-- PWA -->
    <link
        rel="manifest"
        href="manifest.json"
    >

    <link
        rel="icon"
        type="image/png"
        sizes="192x192"
        href="icon-192.png"
    >

    <link
        rel="apple-touch-icon"
        href="icon-192.png"
    >

    <meta
        name="theme-color"
        content="#050b16"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>

    <!-- =================================================
         SIDEBAR
    ================================================== -->

    <aside
        class="sidebar"
        id="sidebar"
    >

        <!-- LOGO -->

        <div class="logo">

            <div class="logo-icon">
                V
            </div>

            <div class="logo-text">

                <strong>
                    Viggo
                </strong>

                <small>
                    AI Friend
                </small>

            </div>

        </div>


        <!-- NEW CHAT -->

        <button
            class="new-chat"
            id="newChatBtn"
            type="button"
        >
            ＋ New Chat
        </button>


        <!-- HISTORY -->

        <div
            class="history"
            id="historyList"
        ></div>


        <!-- MORE -->

        <div class="sidebar-more">

            <button
                class="more-button"
                id="moreBtn"
                type="button"
            >
                ⋮ More
            </button>


            <div
                class="more-menu"
                id="moreMenu"
            >

                <!-- SAVE -->

                <button
                    id="saveBtn"
                    type="button"
                >
                    💾 Save
                </button>


                <!-- SELECT -->

                <button
                    id="selectChatsBtn"
                    type="button"
                >
                    ☑ Select Chats
                </button>


                <!-- DELETE SELECTED -->

                <button
                    id="deleteSelectedBtn"
                    type="button"
                    class="danger-button"
                    style="display:none;"
                >
                    🗑 Delete Selected
                </button>


                <!-- CLEAR HISTORY -->

                <button
                    id="clearHistoryBtn"
                    type="button"
                    class="danger-button"
                >
                    🗑 Clear History
                </button>


                <div class="menu-divider"></div>


                <!-- LANGUAGE -->

                <div class="language-title">
                    🌐 Select Language
                </div>


                <button
                    type="button"
                    data-language="en"
                >
                    🇬🇧 English
                </button>


                <button
                    type="button"
                    data-language="ta"
                >
                    🇮🇳 தமிழ்
                </button>


                <button
                    type="button"
                    data-language="hi"
                >
                    🇮🇳 हिन्दी
                </button>


                <button
                    type="button"
                    data-language="ml"
                >
                    🇮🇳 മലയാളം
                </button>


                <button
                    type="button"
                    data-language="te"
                >
                    🇮🇳 తెలుగు
                </button>


                <button
                    type="button"
                    data-language="kn"
                >
                    🇮🇳 ಕನ್ನಡ
                </button>


                <div class="menu-divider"></div>


                <!-- VOICE SETTINGS -->

                <button
                    id="voiceSettingsButton"
                    type="button"
                >
                    🔊 Voice Settings
                </button>


                <div
                    id="voiceSettingsPanel"
                    class="voice-settings-panel"
                >

                    <div class="voice-setting-title">
                        Voice
                    </div>


                    <button
                        id="femaleVoiceBtn"
                        class="voice-choice"
                        type="button"
                    >
                        👩 Female
                    </button>


                    <button
                        id="maleVoiceBtn"
                        class="voice-choice"
                        type="button"
                    >
                        👨 Male
                    </button>


                    <div
                        id="voiceLanguageStatus"
                        class="voice-language-status"
                    ></div>

                </div>

            </div>

        </div>

    </aside>



    <!-- =================================================
         MAIN
    ================================================== -->

    <main class="main">


        <!-- HEADER -->

        <header class="header">


            <!-- MOBILE MENU -->

            <button
                class="mobile-menu"
                id="mobileMenuBtn"
                type="button"
                aria-label="Open menu"
            >
                ☰
            </button>


            <!-- CHAT TITLE -->

            <div
                class="chat-title"
                id="chatTitle"
            >
                New Chat
            </div>


            <!-- SHARE -->

            <button
                class="share-btn"
                id="shareBtn"
                type="button"
            >
                ↗ Share
            </button>

        </header>



        <!-- =================================================
             MESSAGES
        ================================================== -->

        <section
            class="messages"
            id="messages"
        ></section>



        <!-- =================================================
             INPUT AREA
        ================================================== -->

        <footer class="input-area">


            <div class="input-box">


                <!-- =================================================
                     PLUS BUTTON
                ================================================== -->

                <div class="plus-container">


                    <button
                        class="input-icon plus-btn"
                        id="plusBtn"
                        type="button"
                        title="Add"
                        aria-label="Add"
                    >
                        ＋
                    </button>


                    <!-- PLUS MENU -->

                    <div
                        class="plus-menu"
                        id="plusMenu"
                    >


                        <!-- CAMERA -->

                        <button
                            type="button"
                            id="cameraBtn"
                            class="plus-menu-item"
                        >

                            <span class="plus-menu-icon">
                                📷
                            </span>

                            <span>
                                Camera
                            </span>

                        </button>


                        <!-- PHOTO -->

                        <button
                            type="button"
                            id="photoBtn"
                            class="plus-menu-item"
                        >

                            <span class="plus-menu-icon">
                                🖼️
                            </span>

                            <span>
                                Photo
                            </span>

                        </button>


                        <!-- FILE -->

                        <button
                            type="button"
                            id="fileBtn"
                            class="plus-menu-item"
                        >

                            <span class="plus-menu-icon">
                                📁
                            </span>

                            <span>
                                File
                            </span>

                        </button>

                    </div>

                </div>



                <!-- =================================================
                     HIDDEN FILE INPUT
                ================================================== -->


                <!-- PHOTO -->

                <input
                    type="file"
                    id="photoInput"
                    accept="image/*"
                    hidden
                >


                <!-- CAMERA -->

                <input
                    type="file"
                    id="cameraInput"
                    accept="image/*"
                    capture="environment"
                    hidden
                >


                <!-- FILE -->

                <input
                    type="file"
                    id="fileInput"
                    hidden
                >



                <!-- =================================================
                     MESSAGE INPUT
                ================================================== -->

                <input
                    type="text"
                    id="messageInput"
                    placeholder="Message Viggo..."
                    autocomplete="off"
                >



                <!-- =================================================
                     VOICE
                ================================================== -->

                <button
                    class="input-icon"
                    id="voiceBtn"
                    type="button"
                    title="Voice input"
                    aria-label="Voice input"
                >
                    🎤
                </button>



                <!-- =================================================
                     SEND
                ================================================== -->

                <button
                    class="send-btn"
                    id="sendBtn"
                    type="button"
                    title="Send"
                    aria-label="Send"
                >
                    ➤
                </button>


            </div>


            <!-- INPUT HINT -->

            <div class="input-hint">

                Viggo AI can make mistakes.
                Check important information.

            </div>


        </footer>

    </main>



    <!-- =================================================
         TOAST
    ================================================== -->

    <div
        id="viggoToast"
        class="toast"
    ></div>



    <!-- =================================================
         JAVASCRIPT
    ================================================== -->

    <script src="script.js"></script>



    <!-- =================================================
         PLUS BUTTON SCRIPT
         This makes:
         ＋ → Camera / Photo / File
    ================================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {


                const plusBtn =
                    document.getElementById(
                        "plusBtn"
                    );


                const plusMenu =
                    document.getElementById(
                        "plusMenu"
                    );


                const cameraBtn =
                    document.getElementById(
                        "cameraBtn"
                    );


                const photoBtn =
                    document.getElementById(
                        "photoBtn"
                    );


                const fileBtn =
                    document.getElementById(
                        "fileBtn"
                    );


                const cameraInput =
                    document.getElementById(
                        "cameraInput"
                    );


                const photoInput =
                    document.getElementById(
                        "photoInput"
                    );


                const fileInput =
                    document.getElementById(
                        "fileInput"
                    );



                /* =================================
                   PLUS OPEN / CLOSE
                ================================= */

                if (plusBtn && plusMenu) {

                    plusBtn.addEventListener(
                        "click",
                        function (event) {

                            event.stopPropagation();

                            plusMenu.classList.toggle(
                                "show"
                            );

                        }
                    );

                }



                /* =================================
                   CAMERA
                ================================= */

                if (cameraBtn && cameraInput) {

                    cameraBtn.addEventListener(
                        "click",
                        function () {

                            cameraInput.click();

                            plusMenu?.classList.remove(
                                "show"
                            );

                        }
                    );

                }



                /* =================================
                   PHOTO
                ================================= */

                if (photoBtn && photoInput) {

                    photoBtn.addEventListener(
                        "click",
                        function () {

                            photoInput.click();

                            plusMenu?.classList.remove(
                                "show"
                            );

                        }
                    );

                }



                /* =================================
                   FILE
                ================================= */

                if (fileBtn && fileInput) {

                    fileBtn.addEventListener(
                        "click",
                        function () {

                            fileInput.click();

                            plusMenu?.classList.remove(
                                "show"
                            );

                        }
                    );

                }



                /* =================================
                   PHOTO SELECTED
                ================================= */

                if (photoInput) {

                    photoInput.addEventListener(
                        "change",
                        function () {

                            if (
                                this.files &&
                                this.files.length
                            ) {

                                const file =
                                    this.files[0];


                                showSelectedFile(
                                    file
                                );

                            }

                        }
                    );

                }



                /* =================================
                   CAMERA PHOTO
                ================================= */

                if (cameraInput) {

                    cameraInput.addEventListener(
                        "change",
                        function () {

                            if (
                                this.files &&
                                this.files.length
                            ) {

                                const file =
                                    this.files[0];


                                showSelectedFile(
                                    file
                                );

                            }

                        }
                    );

                }



                /* =================================
                   FILE SELECTED
                ================================= */

                if (fileInput) {

                    fileInput.addEventListener(
                        "change",
                        function () {

                            if (
                                this.files &&
                                this.files.length
                            ) {

                                const file =
                                    this.files[0];


                                showSelectedFile(
                                    file
                                );

                            }

                        }
                    );

                }



                /* =================================
                   CLOSE PLUS MENU
                ================================= */

                document.addEventListener(
                    "click",
                    function (event) {

                        if (
                            !event.target.closest(
                                ".plus-container"
                            )
                        ) {

                            plusMenu?.classList.remove(
                                "show"
                            );

                        }

                    }
                );



                /* =================================
                   SHOW SELECTED FILE
                ================================= */

                window.showSelectedFile =
                    function (file) {

                        if (!file) return;


                        const input =
                            document.getElementById(
                                "messageInput"
                            );


                        if (!input) return;


                        /*
                         * For now the selected
                         * file name is shown
                         * in the message box.
                         *
                         * Actual AI image/file
                         * upload needs backend
                         * support.
                         */

                        input.value =
                            "📎 " +
                            file.name;


                        input.focus();


                        const toast =
                            document.getElementById(
                                "viggoToast"
                            );


                        if (toast) {

                            toast.textContent =
                                "📎 " +
                                file.name +
                                " selected";


                            toast.classList.add(
                                "show"
                            );


                            clearTimeout(
                                window.viggoFileToastTimer
                            );


                            window.viggoFileToastTimer =
                                setTimeout(
                                    function () {

                                        toast.classList.remove(
                                            "show"
                                        );

                                    },
                                    2500
                                );

                        }

                    };

            }

        );

    </script>



    <!-- =================================================
         SERVICE WORKER
    ================================================== -->

    <script>

        if (
            "serviceWorker" in navigator
        ) {

            window.addEventListener(
                "load",
                function () {

                    navigator.serviceWorker
                        .register(
                            "service-worker.js"
                        )

                        .then(
                            function () {

                                console.log(
                                    "Viggo Service Worker registered successfully."
                                );

                            }
                        )

                        .catch(
                            function (error) {

                                console.log(
                                    "Viggo Service Worker registration failed:",
                                    error
                                );

                            }
                        );

                }
            );

        }

    </script>


</body>

</html>
