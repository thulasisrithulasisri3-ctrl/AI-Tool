<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Viggo AI</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<!-- =====================================================
     APP
===================================================== -->

<div id="app">


    <!-- =================================================
         SIDEBAR
    ================================================== -->

    <aside
        id="sidebar"
        class="sidebar"
    >

        <!-- SIDEBAR HEADER -->

        <div class="sidebar-header">

            <div class="logo-area">

                <div class="logo">
                    V
                </div>

                <span>
                    Viggo AI
                </span>

            </div>


            <!-- SIDEBAR CLOSE -->

            <button
                id="closeSidebarButton"
                class="close-sidebar-button"
                type="button"
                aria-label="Close Sidebar"
            >
                ✕
            </button>

        </div>


        <!-- NEW CHAT -->

        <button
            id="newChatButton"
            class="new-chat-button"
            type="button"
        >
            ＋ New Chat
        </button>


        <!-- SEARCH -->

        <div class="history-search">

            <span>🔍</span>

            <input
                id="historySearchInput"
                type="text"
                placeholder="Search chats..."
                autocomplete="off"
            >

        </div>


        <!-- CHAT HISTORY TITLE -->

        <div class="section-title">

            <span>
                Chat History
            </span>

            <button
                id="selectChatsButton"
                type="button"
                class="select-button"
            >
                ☑ Select
            </button>

        </div>


        <!-- CHAT HISTORY -->

        <div
            id="historyContainer"
            class="history-container"
        >
        </div>


        <!-- SELECTED DELETE -->

        <button
            id="deleteSelectedButton"
            class="delete-selected-button"
            type="button"
            disabled
        >
            🗑 Delete Selected
        </button>


        <!-- DELETED CHATS -->

        <button
            id="deletedChatsButton"
            class="deleted-chats-button"
            type="button"
        >
            🗑 Deleted Chats
        </button>


        <div
            id="deletedChatsContainer"
            class="deleted-chats-container"
        >
        </div>


    </aside>


    <!-- =================================================
         MAIN AREA
    ================================================== -->

    <main class="main-area">


        <!-- =================================================
             TOP BAR
        ================================================== -->

        <header class="topbar">


            <!-- MOBILE SIDEBAR BUTTON -->

            <button
                id="mobileMenuButton"
                class="mobile-menu-button"
                type="button"
                aria-label="Open Sidebar"
            >
                ☰
            </button>


            <!-- CHAT TITLE -->

            <div
                id="currentChatTitle"
                class="current-chat-title"
            >
                Viggo AI
            </div>


            <!-- TOP ACTIONS -->

            <div class="top-actions">


                <!-- LANGUAGE -->

                <button
                    id="languageButton"
                    class="top-button"
                    type="button"
                    title="Language"
                >
                    🌐
                </button>


                <!-- MORE -->

                <button
                    id="moreButton"
                    class="top-button"
                    type="button"
                    title="More"
                >
                    ⋮
                </button>


            </div>


        </header>


        <!-- =================================================
             MORE MENU
        ================================================== -->

        <div
            id="moreMenu"
            class="popup-menu more-menu"
        >

            <button
                id="voiceToggleButton"
                type="button"
            >
                🔊 Voice ON/OFF
            </button>


            <button
                id="clearAllButton"
                type="button"
            >
                🗑 Clear All Chats
            </button>


            <button
                id="aboutButton"
                type="button"
            >
                ℹ About Viggo
            </button>

        </div>


        <!-- =================================================
             MESSAGE AREA
        ================================================== -->

        <section
            id="messageContainer"
            class="message-container"
        >

            <!-- WELCOME -->

            <div
                id="welcomeScreen"
                class="welcome-screen"
            >

                <div class="welcome-logo">
                    V
                </div>

                <h1>
                    Hello, I'm Viggo AI
                </h1>

                <p>
                    How can I help you today?
                </p>

            </div>

        </section>


        <!-- =================================================
             INPUT AREA
        ================================================== -->

        <footer class="input-area">


            <!-- PLUS MENU -->

            <div
                id="plusMenu"
                class="popup-menu plus-menu"
            >

                <button
                    id="photoButton"
                    type="button"
                >
                    📷 Photo
                </button>


                <button
                    id="videoButton"
                    type="button"
                >
                    🎥 Video
                </button>


                <button
                    id="fileButton"
                    type="button"
                >
                    📎 File
                </button>

            </div>


            <!-- INPUT BOX -->

            <div class="input-box">


                <!-- PLUS -->

                <button
                    id="plusButton"
                    class="input-button"
                    type="button"
                    title="Attach"
                >
                    ＋
                </button>


                <!-- TEXTAREA -->

                <textarea
                    id="messageInput"
                    rows="1"
                    placeholder="Message Viggo AI..."
                    autocomplete="off"
                ></textarea>


                <!-- VOICE -->

                <button
                    id="voiceInputButton"
                    class="input-button voice-button"
                    type="button"
                    title="Voice"
                >
                    🎤
                </button>


                <!-- SEND -->

                <button
                    id="sendButton"
                    class="send-button"
                    type="button"
                    title="Send"
                >
                    ➤
                </button>


            </div>


            <div class="input-hint">
                Press Enter to send • Shift + Enter for new line
            </div>


        </footer>


    </main>


</div>


<!-- =====================================================
     HIDDEN FILE INPUTS
===================================================== -->

<input
    id="photoInput"
    type="file"
    accept="image/*"
    hidden
>


<input
    id="videoInput"
    type="file"
    accept="video/*"
    hidden
>


<input
    id="fileInput"
    type="file"
    hidden
>


<!-- =====================================================
     LANGUAGE MODAL
===================================================== -->

<div
    id="languageModal"
    class="modal"
>

    <div class="modal-box">

        <button
            id="closeLanguageModal"
            class="modal-close"
            type="button"
        >
            ✕
        </button>


        <h2>
            Select Language
        </h2>


        <select
            id="languageSelect"
        >

            <option value="en">
                English
            </option>

            <option value="ta">
                தமிழ்
            </option>

            <option value="hi">
                हिन्दी
            </option>

            <option value="ml">
                മലയാളം
            </option>

            <option value="te">
                తెలుగు
            </option>

            <option value="kn">
                ಕನ್ನಡ
            </option>

        </select>


        <button
            id="saveLanguageButton"
            class="save-language-button"
            type="button"
        >
            Save
        </button>


    </div>

</div>


<!-- =====================================================
     ABOUT MODAL
===================================================== -->

<div
    id="aboutModal"
    class="modal"
>

    <div class="modal-box">

        <button
            id="closeAboutModal"
            class="modal-close"
            type="button"
        >
            ✕
        </button>


        <div class="about-logo">
            V
        </div>


        <h2>
            Viggo AI
        </h2>


        <p>
            Your friendly AI assistant.
        </p>


        <p class="version">
            Version 1.0
        </p>

    </div>

</div>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script src="script.js"></script>

</body>

</html>
