<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viggo AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 Roboto, Arial, sans-serif;
}

body {
    background: #080d14;
    color: #fff;
    height: 100vh;
    overflow: hidden;
}

/* =========================
   APP
========================= */

.app {
    display: flex;
    height: 100vh;

    background:
        radial-gradient(
            circle at top right,
            #123b68 0%,
            #080f18 45%,
            #03070c 100%
        );
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
    width: 260px;
    min-width: 260px;
    height: 100vh;

    background: rgba(5, 10, 17, .96);

    border-right: 1px solid #1b3047;

    padding: 18px;

    display: flex;
    flex-direction: column;
}

/* Logo */

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo-icon {
    width: 42px;
    height: 42px;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #258fff,
            #07539c
        );

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 22px;
    font-weight: 700;

    box-shadow:
        0 5px 20px rgba(0, 120, 255, .3);
}

.logo-name {
    font-size: 21px;
    font-weight: 600;
}

.online {
    margin-left: 52px;
    margin-top: 5px;

    font-size: 11px;
    color: #4ee58b;
}

.online-dot {
    display: inline-block;

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #35dc79;

    margin-right: 5px;

    box-shadow: 0 0 7px #35dc79;
}

/* =========================
   NEW CHAT
========================= */

.new-chat {
    width: 100%;

    margin-top: 25px;

    padding: 11px 13px;

    border-radius: 10px;

    border: 1px solid #1768ae;

    background:
        linear-gradient(
            135deg,
            #116fc4,
            #073d70
        );

    color: white;

    cursor: pointer;

    text-align: left;

    font-size: 14px;
}

.new-chat:hover {
    background:
        linear-gradient(
            135deg,
            #1688ed,
            #075397
        );
}

/* =========================
   SIDEBAR SECTIONS
========================= */

.section-title {
    margin-top: 25px;
    margin-bottom: 8px;

    color: #718ba5;

    font-size: 11px;
    font-weight: 600;

    text-transform: uppercase;
    letter-spacing: .6px;
}

.chat-list {
    display: flex;
    flex-direction: column;

    gap: 4px;

    overflow-y: auto;
}

.chat-item {
    width: 100%;

    border: none;

    background: transparent;

    color: #d7e7f7;

    padding: 9px 10px;

    border-radius: 8px;

    cursor: pointer;

    text-align: left;

    font-size: 13px;

    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.chat-item:hover {
    background: #102033;
}

.empty-list {
    padding: 8px 10px;

    color: #506a84;

    font-size: 12px;
}

/* =========================
   MORE
========================= */

.more-area {
    margin-top: auto;

    position: relative;
}

.more-button {
    width: 100%;

    padding: 11px 12px;

    border-radius: 10px;

    border: 1px solid #25445f;

    background: #0b1724;

    color: #dcecff;

    cursor: pointer;

    text-align: left;

    font-size: 14px;
}

.more-button:hover {
    background: #10273d;
}

.more-menu {
    display: none;

    position: absolute;

    left: 0;
    right: 0;

    bottom: 50px;

    padding: 7px;

    background: #0a1623;

    border: 1px solid #274a68;

    border-radius: 12px;

    box-shadow:
        0 15px 40px rgba(0,0,0,.6);

    z-index: 1000;
}

.more-menu.show {
    display: block;
}

.more-menu button {
    width: 100%;

    padding: 10px;

    border: none;

    border-radius: 8px;

    background: transparent;

    color: #dcecff;

    cursor: pointer;

    text-align: left;

    font-size: 13px;
}

.more-menu button:hover {
    background: #10304b;
}

/* =========================
   MAIN
========================= */

.main {
    flex: 1;

    min-width: 0;

    height: 100vh;

    display: flex;
    flex-direction: column;
}

/* =========================
   TOP HEADER
========================= */

.top-header {
    height: 60px;

    padding: 0 20px;

    display: flex;
    align-items: center;

    border-bottom: 1px solid #1a3046;

    background: rgba(5, 11, 18, .9);

    backdrop-filter: blur(10px);
}

.header-title {
    color: #e6f1fc;

    font-size: 14px;

    font-weight: 500;
}

.share-button {
    margin-left: auto;

    padding: 7px 13px;

    border-radius: 8px;

    border: 1px solid #216ca8;

    background: #0b3154;

    color: white;

    cursor: pointer;

    font-size: 13px;
}

.share-button:hover {
    background: #104a79;
}

/* =========================
   CHAT AREA
========================= */

.chat-area {
    flex: 1;

    overflow-y: auto;

    padding: 25px 20px;
}

.conversation {
    width: 100%;
    max-width: 850px;

    margin: auto;
}

/* =========================
   WELCOME
========================= */

.welcome {
    min-height: 100%;

    padding-top: 80px;

    text-align: center;
}

.welcome-icon {
    width: 70px;
    height: 70px;

    margin: auto;

    border-radius: 18px;

    background:
        linear-gradient(
            135deg,
            #258fff,
            #07539c
        );

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 34px;
    font-weight: bold;

    box-shadow:
        0 10px 35px rgba(0,120,255,.3);
}

.welcome h1 {
    margin-top: 16px;

    font-size: 28px;
}

.welcome p {
    margin-top: 7px;

    color: #718ba5;

    font-size: 14px;
}

/* =========================
   MESSAGES
========================= */

.message {
    display: flex;

    gap: 11px;

    margin-bottom: 22px;
}

.avatar {
    width: 36px;
    height: 36px;

    min-width: 36px;

    border-radius: 10px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #0c63a9;

    font-size: 14px;
    font-weight: bold;
}

.user-avatar {
    background: #263a50;
}

.message-content {
    min-width: 0;
}

.message-name {
    margin-bottom: 5px;

    color: #6d9bc5;

    font-size: 11px;
}

.message-text {
    color: #e7f1fa;

    font-size: 14px;

    line-height: 1.65;

    white-space: pre-wrap;

    word-wrap: break-word;
}

/* =========================
   MESSAGE ACTIONS
========================= */

.message-actions {
    display: flex;

    gap: 6px;

    margin-top: 9px;
}

.message-actions button {
    padding: 5px 8px;

    border-radius: 7px;

    border: 1px solid #24445f;

    background: #0a1724;

    color: #9db9d2;

    cursor: pointer;

    font-size: 11px;
}

.message-actions button:hover {
    background: #10304b;

    color: white;
}

/* =========================
   INPUT AREA
========================= */

.input-area {
    padding: 12px 20px 18px;

    border-top: 1px solid #1a3046;

    background: #060c14;
}

.input-wrapper {
    max-width: 850px;

    margin: auto;

    display: flex;
    align-items: center;

    gap: 8px;

    padding: 7px 8px 7px 14px;

    border-radius: 20px;

    background: #151b24;

    border: 1px solid #26394d;
}

.message-input {
    flex: 1;

    min-width: 0;

    border: none;

    outline: none;

    background: transparent;

    color: white;

    padding: 8px 3px;

    font-size: 14px;
}

.message-input::placeholder {
    color: #61758a;
}

/* =========================
   MIC BUTTON
========================= */

.mic-button {
    width: 38px;
    height: 38px;

    min-width: 38px;

    border-radius: 50%;

    border: 1px solid #31536f;

    background: #10283e;

    color: white;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;
}

.mic-button:hover {
    background: #16476d;
}

.mic-button.recording {
    background: #b52d3a;

    border-color: #ef5967;
}

/* =========================
   SEND
========================= */

.send-button {
    width: 38px;
    height: 38px;

    min-width: 38px;

    border: none;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #258fff,
            #07539c
        );

    color: white;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 16px;
}

.send-button:hover {
    background:
        linear-gradient(
            135deg,
            #3b9cff,
            #0865b7
        );
}

/* =========================
   MODAL
========================= */

.modal {
    display: none;

    position: fixed;

    inset: 0;

    z-index: 5000;

    padding: 30px;

    background: rgba(0,0,0,.7);
}

.modal.show {
    display: flex;
}

.modal-box {
    width: 100%;
    max-width: 700px;

    max-height: 80vh;

    overflow-y: auto;

    margin: auto;

    padding: 20px;

    border-radius: 15px;

    border: 1px solid #274b68;

    background: #0a1623;

    box-shadow:
        0 20px 60px rgba(0,0,0,.7);
}

.modal-header {
    display: flex;

    align-items: center;
    justify-content: space-between;

    margin-bottom: 15px;
}

.close-button {
    border: none;

    background: transparent;

    color: white;

    font-size: 24px;

    cursor: pointer;
}

.history-item {
    padding: 12px;

    margin-bottom: 8px;

    border-radius: 9px;

    border: 1px solid #203b53;

    background: #0d1c2b;

    cursor: pointer;
}

.history-item:hover {
    background: #102b42;
}

.history-time {
    margin-top: 5px;

    color: #637d95;

    font-size: 10px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .sidebar {
        width: 220px;
        min-width: 220px;

        padding: 14px;
    }

    .chat-area {
        padding: 18px 12px;
    }

    .input-area {
        padding: 10px;
    }

    .top-header {
        padding: 0 12px;
    }

    .welcome {
        padding-top: 50px;
    }
}

</style>
</head>


<body>

<div class="app">


<!-- =================================
     SIDEBAR
================================= -->

<aside class="sidebar">


    <!-- LOGO -->

    <div class="logo">

        <div class="logo-icon">
            B
        </div>

        <div class="logo-name">
            Viggo
        </div>

    </div>


    <div class="online">
        <span class="online-dot"></span>
        Online
    </div>


    <!-- NEW CHAT -->

    <button
        class="new-chat"
        id="newChat">

        ＋ New Chat

    </button>


    <!-- PINNED -->

    <div class="section-title">
        Pinned
    </div>

    <div
        class="chat-list"
        id="pinnedList">

        <div class="empty-list">
            No pinned chats
        </div>

    </div>


    <!-- RECENT -->

    <div class="section-title">
        Recent
    </div>

    <div
        class="chat-list"
        id="recentList">

        <div class="empty-list">
            No recent chats
        </div>

    </div>


    <!-- MORE -->

    <div class="more-area">

        <button
            class="more-button"
            id="moreButton">

            ⋮ More

        </button>


        <div
            class="more-menu"
            id="moreMenu">


            <button id="saveButton">
                💾 Save
            </button>


            <button id="historyButton">
                🕘 History
            </button>


            <button id="pinButton">
                📌 Pin Chat
            </button>


            <button id="voiceToggle">
                🔊 Voice ON
            </button>


            <button id="femaleVoice">
                🎙️ Female Voice
            </button>


            <button id="maleVoice">
                🎙️ Male Voice
            </button>


            <button id="clearHistory">
                🗑️ Clear History
            </button>


        </div>

    </div>

</aside>


<!-- =================================
     MAIN
================================= -->

<main class="main">


    <!-- HEADER -->

    <header class="top-header">

        <div
            class="header-title"
            id="headerTitle">

            New Chat

        </div>


        <!-- SHARE ONLY -->

        <button
            class="share-button"
            id="shareButton">

            ↗ Share

        </button>

    </header>


    <!-- =================================
         CHAT
    ================================= -->

    <section
        class="chat-area"
        id="chatArea">


        <div
            class="conversation"
            id="conversation">


            <div
                class="welcome"
                id="welcome">

                <div class="welcome-icon">
                    B
                </div>

                <h1>
                    Viggo
                </h1>

                <p>
                    Your AI friend is ready.
                </p>

            </div>


        </div>

    </section>


    <!-- =================================
         INPUT
    ================================= -->

    <div class="input-area">

        <div class="input-wrapper">


            <input
                type="text"
                class="message-input"
                id="messageInput"
                placeholder="Message Viggo..."
                autocomplete="off"
            />


            <!-- MIC -->

            <button
                class="mic-button"
                id="micButton"
                title="Voice Input">

                🎤

            </button>


            <!-- SEND -->

            <button
                class="send-button"
                id="sendButton"
                title="Send">

                ➤

            </button>


        </div>

    </div>


</main>

</div>


<!-- =================================
     HISTORY MODAL
================================= -->

<div
    class="modal"
    id="historyModal">


    <div class="modal-box">


        <div class="modal-header">

            <h3>
                🕘 Chat History
            </h3>

            <button
                class="close-button"
                id="closeHistory">

                ×

            </button>

        </div>


        <div id="historyList"></div>


    </div>

</div>


<script>

/* =================================
   ELEMENTS
================================= */

const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");

const conversation =
    document.getElementById("conversation");

const welcome =
    document.getElementById("welcome");

const newChat =
    document.getElementById("newChat");

const moreButton =
    document.getElementById("moreButton");

const moreMenu =
    document.getElementById("moreMenu");

const shareButton =
    document.getElementById("shareButton");

const pinnedList =
    document.getElementById("pinnedList");

const recentList =
    document.getElementById("recentList");

const historyModal =
    document.getElementById("historyModal");

const historyList =
    document.getElementById("historyList");

const closeHistory =
    document.getElementById("closeHistory");

let voiceEnabled = true;

let currentVoice = "female";


/* =================================
   STORAGE
================================= */

let chats =
    JSON.parse(
        localStorage.getItem("viggoChats") || "[]"
    );


/* =================================
   MORE MENU
================================= */

moreButton.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        moreMenu.classList.toggle("show");

    }
);

moreMenu.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

    }
);

document.addEventListener(
    "click",
    function() {

        moreMenu.classList.remove("show");

    }
);


/* =================================
   ADD MESSAGE
================================= */

function addMessage(
    text,
    sender
) {

    if (welcome) {
        welcome.style.display = "none";
    }

    const message =
        document.createElement("div");

    message.className =
        "message " +
        sender;


    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar " +
        (
            sender === "user"
            ? "user-avatar"
            : ""
        );

    avatar.textContent =
        sender === "user"
        ? "U"
        : "B";


    const content =
        document.createElement("div");

    content.className =
        "message-content";


    const name =
        document.createElement("div");

    name.className =
        "message-name";

    name.textContent =
        sender === "user"
        ? "You"
        : "Viggo";


    const textDiv =
        document.createElement("div");

    textDiv.className =
        "message-text";

    textDiv.textContent =
        text;


    content.appendChild(name);

    content.appendChild(textDiv);


    /* ACTIONS */

    if (sender === "assistant") {

        const actions =
            document.createElement("div");

        actions.className =
            "message-actions";


        const copy =
            document.createElement("button");

        copy.textContent =
            "📋 Copy";

        copy.onclick =
            function() {

                navigator.clipboard.writeText(
                    text
                );

            };


        const speak =
            document.createElement("button");

        speak.textContent =
            "🔊 Speaker";

        speak.onclick =
            function() {

                speakText(text);

            };


        const like =
            document.createElement("button");

        like.textContent =
            "👍 Like";

        like.onclick =
            function() {

                like.textContent =
                    "❤️ Liked";

            };


        actions.appendChild(copy);

        actions.appendChild(speak);

        actions.appendChild(like);

        content.appendChild(actions);

    }


    message.appendChild(avatar);

    message.appendChild(content);

    conversation.appendChild(message);


    document.getElementById("chatArea")
        .scrollTop =
        document.getElementById("chatArea")
        .scrollHeight;
}


/* =================================
   SEND MESSAGE
================================= */

function sendMessage() {

    const text =
        messageInput.value.trim();

    if (!text) {
        return;
    }


    addMessage(
        text,
        "user"
    );


    messageInput.value = "";


    /* Save recent */

    chats.push({

        text: text,

        time:
            new Date().toLocaleString(),

        pinned: false

    });


    saveChats();

    renderRecent();


    /*
      AI RESPONSE PLACEHOLDER

      உங்கள் existing server/API code
      இங்கே connect செய்யலாம்.
    */

    setTimeout(
        function() {

            const reply =
                "Okay friend, I received your message: " +
                text;

            addMessage(
                reply,
                "assistant"
            );

            speakText(reply);

        },
        500
    );
}


/* =================================
   SEND BUTTON
================================= */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* =================================
   ENTER
================================= */

messageInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =================================
   NEW CHAT
================================= */

newChat.addEventListener(
    "click",
    function() {

        conversation.innerHTML = "";

        conversation.appendChild(
            welcome
        );

        welcome.style.display =
            "block";

        document.getElementById(
            "headerTitle"
        ).textContent =
            "New Chat";

        messageInput.value = "";

    }
);


/* =================================
   SPEECH
================================= */

function speakText(text) {

    if (!voiceEnabled) {
        return;
    }

    if (
        !("speechSynthesis" in window)
    ) {
        return;
    }


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    const voices =
        speechSynthesis.getVoices();


    let selected;


    if (
        currentVoice === "female"
    ) {

        selected =
            voices.find(
                voice =>
                    /female|zira|samantha|karen|google us english/i
                    .test(voice.name)
            );

    } else {

        selected =
            voices.find(
                voice =>
                    /male|david|alex|daniel|google uk english/i
                    .test(voice.name)
            );

    }


    if (selected) {

        utterance.voice =
            selected;

    }


    utterance.rate = 1;

    utterance.pitch = 1;


    speechSynthesis.speak(
        utterance
    );
}


/* =================================
   VOICE ON / OFF
================================= */

document
    .getElementById("voiceToggle")
    .addEventListener(
        "click",
        function() {

            voiceEnabled =
                !voiceEnabled;

            this.textContent =
                voiceEnabled
                ? "🔊 Voice ON"
                : "🔇 Voice OFF";

        }
    );


/* =================================
   FEMALE VOICE
================================= */

document
    .getElementById("femaleVoice")
    .addEventListener(
        "click",
        function() {

            currentVoice =
                "female";

            voiceEnabled =
                true;

            speakText(
                "Okay friend, female voice selected."
            );

            moreMenu.classList.remove(
                "show"
            );

        }
    );


/* =================================
   MALE VOICE
================================= */

document
    .getElementById("maleVoice")
    .addEventListener(
        "click",
        function() {

            currentVoice =
                "male";

            voiceEnabled =
                true;

            speakText(
                "Okay friend, male voice selected."
            );

            moreMenu.classList.remove(
                "show"
            );

        }
    );


/* =================================
   SAVE CHATS
================================= */

function saveChats() {

    localStorage.setItem(
        "viggoChats",
        JSON.stringify(chats)
    );

}


/* =================================
   RENDER RECENT
================================= */

function renderRecent() {

    recentList.innerHTML = "";

    if (!chats.length) {

        recentList.innerHTML =
            '<div class="empty-list">No recent chats</div>';

        return;
    }


    chats
        .slice(-6)
        .reverse()
        .forEach(
            function(chat) {

                const item =
                    document.createElement(
                        "button"
                    );

                item.className =
                    "chat-item";

                item.textContent =
                    "💬 " +
                    chat.text;

                item.onclick =
                    function() {

                        messageInput.value =
                            chat.text;

                    };

                recentList.appendChild(
                    item
                );

            }
        );
}


/* =================================
   PIN CHAT
================================= */

document
    .getElementById("pinButton")
    .addEventListener(
        "click",
        function() {

            if (!chats.length) {

                alert(
                    "No chat to pin."
                );

                return;

            }


            chats[
                chats.length - 1
            ].pinned = true;


            saveChats();

            renderPinned();

            moreMenu.classList.remove(
                "show"
            );

        }
    );


/* =================================
   RENDER PINNED
================================= */

function renderPinned() {

    pinnedList.innerHTML = "";


    const pinned =
        chats.filter(
            chat =>
                chat.pinned
        );


    if (!pinned.length) {

        pinnedList.innerHTML =
            '<div class="empty-list">No pinned chats</div>';

        return;

    }


    pinned.forEach(
        function(chat) {

            const item =
                document.createElement(
                    "button"
                );

            item.className =
                "chat-item";

            item.textContent =
                "📌 " +
                chat.text;

            pinnedList.appendChild(
                item
            );

        }
    );
}


/* =================================
   HISTORY
================================= */

document
    .getElementById("historyButton")
    .addEventListener(
        "click",
        function() {

            historyList.innerHTML = "";


            if (!chats.length) {

                historyList.innerHTML =
                    "<p>No chat history.</p>";

            } else {

                chats
                    .slice()
                    .reverse()
                    .forEach(
                        function(chat) {

                            const item =
                                document.createElement(
                                    "div"
                                );

                            item.className =
                                "history-item";


                            item.innerHTML =
                                `
                                <div>
                                    ${escapeHTML(chat.text)}
                                </div>

                                <div class="history-time">
                                    ${escapeHTML(chat.time)}
                                </div>
                                `;


                            historyList.appendChild(
                                item
                            );

                        }
                    );

            }


            historyModal.classList.add(
                "show"
            );

            moreMenu.classList.remove(
                "show"
            );

        }
    );


/* =================================
   CLOSE HISTORY
================================= */

closeHistory.addEventListener(
    "click",
    function() {

        historyModal.classList.remove(
            "show"
        );

    }
);


/* =================================
   CLEAR HISTORY
================================= */

document
    .getElementById("clearHistory")
    .addEventListener(
        "click",
        function() {

            chats = [];

            saveChats();

            renderRecent();

            renderPinned();

            moreMenu.classList.remove(
                "show"
            );

        }
    );


/* =================================
   SAVE
================================= */

document
    .getElementById("saveButton")
    .addEventListener(
        "click",
        function() {

            if (!chats.length) {

                alert(
                    "No chat to save."
                );

                return;

            }


            saveChats();

            moreMenu.classList.remove(
                "show"
            );

        }
    );


/* =================================
   SHARE WHOLE CHAT
================================= */

shareButton.addEventListener(
    "click",
    async function() {

        const messages =
            [...document.querySelectorAll(
                ".message"
            )];


        if (!messages.length) {

            alert(
                "No chat to share yet."
            );

            return;

        }


        let shareText =
            "Viggo AI Chat\n\n";


        messages.forEach(
            function(message) {

                const name =
                    message.querySelector(
                        ".message-name"
                    );

                const text =
                    message.querySelector(
                        ".message-text"
                    );

                if (name && text) {

                    shareText +=
                        name.textContent +
                        ": " +
                        text.textContent +
                        "\n\n";

                }

            }
        );


        if (
            navigator.share
        ) {

            try {

                await navigator.share({

                    title:
                        "Viggo AI Chat",

                    text:
                        shareText

                });

            } catch(error) {

                console.log(
                    "Share cancelled."
                );

            }

        } else {

            await navigator.clipboard.writeText(
                shareText
            );

            alert(
                "Full chat copied. You can share it now."
            );

        }

    }
);


/* =================================
   MIC / VOICE INPUT
================================= */

let recognition = null;

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "en-IN";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;


    recognition.onstart =
        function() {

            micButton.classList.add(
                "recording"
            );

            micButton.textContent =
                "🔴";

        };


    recognition.onend =
        function() {

            micButton.classList.remove(
                "recording"
            );

            micButton.textContent =
                "🎤";

        };


    recognition.onresult =
        function(event) {

            const result =
                event.results[0][0]
                    .transcript;

            messageInput.value =
                result;

        };

}


micButton.addEventListener(
    "click",
    function() {

        if (!recognition) {

            alert(
                "Voice input is not supported in this browser."
            );

            return;

        }


        recognition.start();

    }
);


/* =================================
   ESCAPE HTML
================================= */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;
}


/* =================================
   INITIAL LOAD
================================= */

renderRecent();

renderPinned();

</script>

</body>
</html>
