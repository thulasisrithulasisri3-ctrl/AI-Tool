<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viggo AI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    height:100vh;
    background:#f5f7fb;
    overflow:hidden;
}

.app{
    display:flex;
    height:100vh;
}

/* SIDEBAR */

.sidebar{
    width:280px;
    background:#fff;
    border-right:1px solid #ddd;
    display:flex;
    flex-direction:column;
    transition:.3s;
}

.sidebar-header{
    padding:15px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #eee;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.close-sidebar{
    border:0;
    background:none;
    font-size:22px;
    cursor:pointer;
}

.new-chat{
    margin:15px;
    padding:12px;
    border:0;
    border-radius:10px;
    cursor:pointer;
    font-size:15px;
    background:#eee;
}

.search-box{
    margin:0 15px 10px;
    padding:10px;
    border:1px solid #ddd;
    border-radius:9px;
    outline:none;
}

.history{
    flex:1;
    overflow-y:auto;
    padding:8px;
}

.history-title{
    font-size:13px;
    color:#777;
    padding:8px;
}

.history-item{
    display:flex;
    align-items:center;
    gap:6px;
    padding:10px;
    border-radius:9px;
    margin-bottom:4px;
}

.history-item:hover{
    background:#f1f1f1;
}

.chat-name{
    flex:1;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    cursor:pointer;
}

.history-btn{
    width:30px;
    height:30px;
    border:0;
    background:transparent;
    cursor:pointer;
    border-radius:6px;
}

.history-btn:hover{
    background:#ddd;
}

/* MAIN */

.main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
}

.topbar{
    height:65px;
    display:flex;
    align-items:center;
    padding:0 15px;
    border-bottom:1px solid #ddd;
    background:#fff;
}

.menu-btn{
    border:0;
    background:none;
    font-size:24px;
    cursor:pointer;
    margin-right:12px;
}

.title{
    flex:1;
    font-size:20px;
    font-weight:bold;
}

.hint-btn{
    border:0;
    background:none;
    font-size:20px;
    cursor:pointer;
    margin-right:8px;
}

.more-btn{
    border:0;
    background:none;
    font-size:25px;
    cursor:pointer;
}

/* MORE MENU */

.more-menu{
    position:absolute;
    right:15px;
    top:55px;
    width:245px;
    background:white;
    border:1px solid #ddd;
    border-radius:12px;
    box-shadow:0 5px 25px rgba(0,0,0,.15);
    display:none;
    z-index:1000;
    overflow:hidden;
}

.more-menu.show{
    display:block;
}

.more-item{
    padding:13px 15px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:12px;
    font-size:14px;
}

.more-item:hover{
    background:#f2f2f2;
}

.more-item span:first-child{
    width:22px;
    text-align:center;
}

/* CHAT */

.chat-area{
    flex:1;
    overflow-y:auto;
    padding:25px;
}

.welcome{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.welcome h1{
    font-size:30px;
}

.message{
    max-width:80%;
    margin:12px 0;
    padding:13px 15px;
    border-radius:14px;
    line-height:1.5;
}

.user{
    margin-left:auto;
    background:#e9eefc;
}

.ai{
    margin-right:auto;
    background:white;
    border:1px solid #ddd;
}

.message-actions{
    display:flex;
    gap:7px;
    margin-top:7px;
}

.message-actions button{
    border:0;
    background:#eee;
    padding:6px 9px;
    border-radius:7px;
    cursor:pointer;
}

.message-actions button:hover{
    background:#ddd;
}

/* INPUT */

.input-area{
    padding:12px 15px;
    border-top:1px solid #ddd;
    background:white;
}

.input-box{
    display:flex;
    align-items:center;
    gap:8px;
    border:1px solid #ccc;
    border-radius:15px;
    padding:7px;
}

.plus-btn,
.photo-btn,
.video-btn,
.file-btn,
.voice-btn,
.send-btn{
    border:0;
    background:transparent;
    cursor:pointer;
    font-size:19px;
    width:38px;
    height:38px;
    border-radius:9px;
}

.plus-btn:hover,
.photo-btn:hover,
.video-btn:hover,
.file-btn:hover,
.voice-btn:hover,
.send-btn:hover{
    background:#eee;
}

.message-input{
    flex:1;
    border:0;
    outline:none;
    resize:none;
    min-height:38px;
    max-height:120px;
    padding:9px;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:2000;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(420px,90%);
    max-height:80vh;
    overflow-y:auto;
    background:white;
    border-radius:15px;
    padding:20px;
}

.modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:15px;
}

.modal-close{
    border:0;
    background:none;
    font-size:22px;
    cursor:pointer;
}

.option{
    padding:13px;
    border:1px solid #ddd;
    border-radius:9px;
    margin:8px 0;
    cursor:pointer;
}

.option:hover{
    background:#f2f2f2;
}

.saved-item{
    padding:10px;
    border-bottom:1px solid #eee;
}

/* MOBILE */

@media(max-width:700px){

    .sidebar{
        position:fixed;
        left:-290px;
        top:0;
        bottom:0;
        z-index:1500;
    }

    .sidebar.open{
        left:0;
    }

    .chat-area{
        padding:15px;
    }

    .message{
        max-width:90%;
    }

    .title{
        font-size:18px;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->

<aside class="sidebar" id="sidebar">

    <div class="sidebar-header">
        <div class="logo">Viggo AI</div>

        <button
            class="close-sidebar"
            onclick="closeSidebar()">
            ✕
        </button>
    </div>

    <button
        class="new-chat"
        onclick="newChat()">
        ＋ New Chat
    </button>

    <input
        id="searchChat"
        class="search-box"
        type="text"
        placeholder="🔎 Search Chat"
        oninput="searchChats()"
    >

    <div class="history">

        <div class="history-title">
            CHAT HISTORY
        </div>

        <div id="historyList"></div>

    </div>

</aside>


<!-- MAIN -->

<main class="main">

    <div class="topbar">

        <button
            class="menu-btn"
            onclick="openSidebar()">
            ☰
        </button>

        <div class="title">
            Viggo AI
        </div>

        <button
            class="hint-btn"
            onclick="showHint()">
            💡
        </button>

        <button
            class="more-btn"
            onclick="toggleMore()">
            ⋮
        </button>


        <!-- MORE -->

        <div
            class="more-menu"
            id="moreMenu">

            <div
                class="more-item"
                onclick="openVoiceSettings()">

                <span>🎤</span>
                <span>Voice</span>

            </div>

            <div
                class="more-item"
                onclick="openVoiceGender()">

                <span>👩</span>
                <span>Voice / Female - Male</span>

            </div>

            <div
                class="more-item"
                onclick="openLanguages()">

                <span>🌐</span>
                <span>Language</span>

            </div>

            <div
                class="more-item"
                onclick="clearCurrentChat()">

                <span>🗑️</span>
                <span>Clear Chat</span>

            </div>

            <div
                class="more-item"
                onclick="showHistory()">

                <span>📜</span>
                <span>Show History</span>

            </div>

            <div
                class="more-item"
                onclick="showSavedChats()">

                <span>💾</span>
                <span>Saved Chats</span>

            </div>

            <div
                class="more-item"
                onclick="selectChats()">

                <span>☑️</span>
                <span>Select Chats</span>

            </div>

            <div
                class="more-item"
                onclick="deleteSelectedChats()">

                <span>🗑️</span>
                <span>Delete Selected</span>

            </div>

        </div>

    </div>


    <!-- CHAT -->

    <section
        class="chat-area"
        id="chatArea">

        <div
            class="welcome"
            id="welcome">

            <div>

                <h1>Viggo AI</h1>

                <p>
                    How can I help you?
                </p>

            </div>

        </div>

    </section>


    <!-- INPUT -->

    <div class="input-area">

        <div class="input-box">


            <!-- PLUS BUTTON -->

            <button
                class="plus-btn"
                onclick="togglePlus()">

                ＋

            </button>


            <!-- PHOTO -->

            <button
                class="photo-btn"
                onclick="photoInput.click()">

                📷

            </button>


            <!-- VIDEO -->

            <button
                class="video-btn"
                onclick="videoInput.click()">

                🎥

            </button>


            <!-- FILE -->

            <button
                class="file-btn"
                onclick="fileInput.click()">

                📎

            </button>


            <!-- MESSAGE -->

            <textarea
                id="messageInput"
                class="message-input"
                placeholder="Message Viggo AI..."
                onkeydown="handleEnter(event)">
            </textarea>


            <!-- VOICE -->

            <button
                class="voice-btn"
                onclick="startVoice()">

                🎤

            </button>


            <!-- SEND -->

            <button
                class="send-btn"
                onclick="sendMessage()">

                ➤

            </button>

        </div>

    </div>

</main>

</div>


<!-- FILE INPUTS -->

<input
    type="file"
    id="photoInput"
    accept="image/*"
    hidden>

<input
    type="file"
    id="videoInput"
    accept="video/*"
    hidden>

<input
    type="file"
    id="fileInput"
    hidden>


<!-- MODAL -->

<div
    class="modal"
    id="modal">

    <div class="modal-box">

        <div class="modal-header">

            <h3 id="modalTitle">
                Options
            </h3>

            <button
                class="modal-close"
                onclick="closeModal()">

                ✕

            </button>

        </div>

        <div id="modalContent"></div>

    </div>

</div>

}
