<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Viggo AI</title>

<style>

/* =========================
   RESET
========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #07101a;
    color: white;
    height: 100vh;
    overflow: hidden;
}


/* =========================
   APP
========================= */

.app {
    display: flex;
    height: 100vh;
}


/* =========================
   SIDEBAR
========================= */

.sidebar {
    width: 260px;
    min-width: 260px;
    height: 100vh;

    background: #050b12;

    border-right: 1px solid #1d354d;

    padding: 18px;

    display: flex;
    flex-direction: column;
}


/* LOGO */

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo-icon {
    width: 42px;
    height: 42px;

    border-radius: 12px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: linear-gradient(
        135deg,
        #2695ff,
        #07559d
    );

    font-size: 22px;
    font-weight: bold;
}

.logo-name {
    font-size: 21px;
    font-weight: 600;
}

.online {
    margin-left: 52px;
    margin-top: 5px;

    color: #48df89;

    font-size: 11px;
}

.online-dot {
    display: inline-block;

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #35dc79;

    margin-right: 5px;
}


/* NEW CHAT */

.new-chat {
    width: 100%;

    margin-top: 25px;

    padding: 11px;

    border-radius: 10px;

    border: 1px solid #1768ae;

    background: linear-gradient(
        135deg,
        #116fc4,
        #073d70
    );

    color: white;

    cursor: pointer;

    text-align: left;

    font-size: 14px;
}

.new-chat:hover {
    background: #116eb8;
}


/* SECTION */

.section-title {
    margin-top: 24px;
    margin-bottom: 8px;

    color: #718ba5;

    font-size: 11px;

    font-weight: bold;

    text-transform: uppercase;
}


/* CHAT LIST */

.chat-list {
    display: flex;
    flex-direction: column;

    gap: 4px;

    overflow-y: auto;
}

.chat-item {
    width: 100%;

    padding: 9px 10px;

    border: none;

    border-radius: 8px;

    background: transparent;

    color: #d7e7f7;

    cursor: pointer;

    text-align: left;

    font-size: 13px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.chat-item:hover {
    background: #102437;
}

.empty-list {
    padding: 8px 10px;

    color: #557089;

    font-size: 12px;
}


/* =========================
   MORE
========================= */

.more-area {
    margin-top: auto;

    position: relative;
}

.more-button {
    width: 100%;

    padding: 11px;

    border-radius: 10px;

    border: 1px solid #284761;

    background: #0b1724;

    color: #dcecff;

    cursor: pointer;

    text-align: left;

    font-size: 14px;
}

.more-button:hover {
    background: #10283c;
}

.more-menu {
    display: none;

    position: absolute;

    left: 0;
    right: 0;

    bottom: 52px;

    padding: 7px;

    background: #091522;

    border: 1px solid #284b67;

    border-radius: 12px;

    box-shadow:
        0 15px 40px rgba(0,0,0,.7);

    z-index: 1000;
}

.more-menu.show {
    display: block;
}

.more-menu button {
    width: 100%;

    padding: 10px;

    border: none;

    border-radius: 8px;

    background: transparent;

    color: #dcecff;

    cursor: pointer;

    text-align: left;

    font-size: 13px;
}

.more-menu button:hover {
    background: #10304b;
}


/* =========================
   MAIN
========================= */

.main {
    flex: 1;

    min-width: 0;

    height: 100vh;

    display: flex;

    flex-direction: column;
}


/* =========================
   HEADER
========================= */

.top-header {
    height: 60px;

    display: flex;

    align-items: center;

    padding: 0 20px;

    background: #050b12;

    border-bottom: 1px solid #1a3046;
}

.header-title {
    font-size: 14px;
}


/* SHARE */

.share-button {
    margin-left: auto;

    padding: 7px 14px;

    border-radius: 8px;

    border: 1px solid #216ca8;

    background: #0b3154;

    color: white;

    cursor: pointer;
}

.share-button:hover {
    background: #12517f;
}


/* =========================
   CHAT AREA
========================= */

.chat-area {
    flex: 1;

    overflow-y: auto;

    padding: 25px 20px;
}

.conversation {
    width: 100%;

    max-width: 850px;

    margin: auto;
}


/* WELCOME */

.welcome {
    min-height: 100%;

    padding-top: 80px;

    text-align: center;
}

.welcome-icon {
    width: 70px;
    height: 70px;

    margin: auto;

    border-radius: 18px;

    display: flex;

    align-items: center;

    justify-content: center;

    background: linear-gradient(
        135deg,
        #2695ff,
        #07559d
    );

    font-size: 34px;

    font-weight: bold;
}

.welcome h1 {
    margin-top: 16px;

    font-size: 28px;
}

.welcome p {
    margin-top: 7px;

    color: #718ba5;

    font-size: 14px;
}


/* =========================
   MESSAGES
========================= */

.message {
    display: flex;

    gap: 11px;

    margin-bottom: 22px;
}

.avatar {
    width: 36px;
    height: 36px;

    min-width: 36px;

    border-radius: 10px;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #0c63a9;

    font-size: 14px;

    font-weight: bold;
}

.user-avatar {
    background: #263a50;
}

.message-content {
    min-width: 0;
}

.message-name {
    margin-bottom: 5px;

    color: #6d9bc5;

    font-size: 11px;
}

.message-text {
    color: #e7f1fa;

    font-size: 14px;

    line-height: 1.65;

    white-space: pre-wrap;

    word-break: break-word;
}


/* MESSAGE BUTTONS */

.message-actions {
    display: flex;

    gap: 6px;

    margin-top: 9px;
}

.message-actions button {
    padding: 5px 8px;

    border-radius: 7px;

    border: 1px solid #24445f;

    background: #0a1724;

    color: #9db9d2;

    cursor: pointer;

    font-size: 11px;
}

.message-actions button:hover {
    background: #10304b;

    color: white;
}


/* =========================
   INPUT
========================= */

.input-area {
    padding: 12px 20px 18px;

    border-top: 1px solid #1a3046;

    background: #060c14;
}

.input-wrapper {
    max-width: 850px;

    margin: auto;

    display: flex;

    align-items: center;

    gap: 8px;

    padding: 7px 8px 7px 14px;

    border-radius: 20px;

    background: #151b24;

    border: 1px solid #26394d;
}

.message-input {
    flex: 1;

    min-width: 0;

    padding: 8px 3px;

    border: none;

    outline: none;

    background: transparent;

    color: white;

    font-size: 14px;
}

.message-input::placeholder {
    color: #61758a;
}


/* MIC */

.mic-button {
    width: 38px;
    height: 38px;

    min-width: 38px;

    border-radius: 50%;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

    border: 1px solid #31536f;

    background: #10283e;

    color: white;
}

.mic-button:hover {
    background: #17405f;
}

.mic-button.recording {
    background: #b52d3a;
}


/* SEND */

.send-button {
    width: 38px;
    height: 38px;

    min-width: 38px;

    border-radius: 50%;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

    border: none;

    background: linear-gradient(
        135deg,
        #2695ff,
        #07559d
    );

    color: white;
}

.send-button:hover {
    transform: scale(1.05);
}


/* =========================
   HISTORY MODAL
========================= */

.modal {
    display: none;

    position: fixed;

    inset: 0;

    z-index: 5000;

    background: rgba(0,0,0,.75);

    padding: 30px;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: 100%;

    max-width: 700px;

    max-height: 80vh;

    overflow-y: auto;

    margin: auto;

    padding: 20px;

    border-radius: 15px;

    border: 1px solid #274b68;

    background: #0a1623;
}

.modal-header {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 15px;
}

.close-button {
    border: none;

    background: transparent;

    color: white;

    font-size: 25px;

    cursor: pointer;
}


/* =========================
   HISTORY
========================= */

.history-item {
    padding: 12px;

    margin-bottom: 8px;

    border-radius: 10px;

    border: 1px solid #203b53;

    background: #0d1c2b;
}

.history-main {
    display: flex;

    align-items: center;

    gap: 10px;
}


/* CHECKBOX HIDDEN UNTIL DOUBLE CLICK */

.history-checkbox {
    width: 18px;
    height: 18px;

    cursor: pointer;

    accent-color: #2695ff;

    display: none;
}

.history-item.selection-mode
.history-checkbox {
    display: block;
}


.history-info {
    flex: 1;

    cursor: pointer;

    min-width: 0;
}

.history-info:hover {
    color: #55adff;
}

.history-time {
    margin-top: 5px;

    color: #637d95;

    font-size: 10px;
}


/* CHAT DELETE BELOW CHAT */

.history-delete-area {
    margin-top: 9px;

    padding-left: 28px;
}

.history-delete-btn {
    padding: 5px 10px;

    border-radius: 7px;

    border: 1px solid #63313a;

    background: #241218;

    color: #ff7885;

    cursor: pointer;

    font-size: 11px;
}

.history-delete-btn:hover {
    background: #5a2029;

    color: white;
}


/* CONTROLS */

.history-controls {
    display: flex;

    gap: 8px;

    margin-top: 15px;
}

.history-controls button {
    flex: 1;

    padding: 11px;

    border-radius: 9px;

    border: 1px solid #284b67;

    background: #0d1c2b;

    color: #dcecff;

    cursor: pointer;
}

.history-controls button:hover {
    background: #123752;
}

.delete-selected {
    border-color: #63313a !important;

    color: #ff7885 !important;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px) {

    .sidebar {
        width: 220px;

        min-width: 220px;

        padding: 13px;
    }

    .chat-area {
        padding: 18px 12px;
    }

    .input-area {
        padding: 10px;
    }

    .top-header {
        padding: 0 12px;
    }

}

</style>
</head>


<body>


<div class="app">


<!-- =================================================
     SIDEBAR
================================================= -->

<aside class="sidebar">


    <!-- LOGO -->

    <div class="logo">

        <div class="logo-icon">
            B
        </div>

        <div class="logo-name">
            Viggo
        </div>

    </div>


    <div class="online">

        <span class="online-dot"></span>

        Online

    </div>


    <!-- NEW CHAT -->

    <button
        class="new-chat"
        id="newChat">

        ＋ New Chat

    </button>


    <!-- PINNED -->

    <div class="section-title">

        Pinned

    </div>


    <div
        class="chat-list"
        id="pinnedList">

    </div>


    <!-- RECENT -->

    <div class="section-title">

        Recent

    </div>


    <div
        class="chat-list"
        id="recentList">

    </div>


    <!-- MORE -->

    <div class="more-area">


        <button
            class="more-button"
            id="moreButton">

            ⋮ More

        </button>


        <div
            class="more-menu"
            id="moreMenu">


            <button id="saveButton">

                💾 Save

            </button>


            <button id="historyButton">

                🕘 History

            </button>


            <button id="pinButton">

                📌 Pin Chat

            </button>


            <button id="voiceToggle">

                🔊 Voice ON

            </button>


            <button id="femaleVoice">

                🎙️ Female Voice

            </button>


            <button id="maleVoice">

                🎙️ Male Voice

            </button>


            <button id="clearHistory">

                🗑️ Clear History

            </button>


        </div>


    </div>


</aside>



<!-- =================================================
     MAIN
================================================= -->

<main class="main">


    <!-- HEADER -->

    <header class="top-header">


        <div
            class="header-title"
            id="headerTitle">

            New Chat

        </div>


        <!-- SHARE ONLY -->

        <button
            class="share-button"
            id="shareButton">

            ↗ Share

        </button>


    </header>



    <!-- CHAT -->

    <section
        class="chat-area"
        id="chatArea">


        <div
            class="conversation"
            id="conversation">


            <div
                class="welcome"
                id="welcome">


                <div class="welcome-icon">

                    B

                </div>


                <h1>

                    Viggo

                </h1>


                <p>

                    Your AI friend is ready.

                </p>


            </div>


        </div>


    </section>



    <!-- INPUT -->

    <div class="input-area">


        <div class="input-wrapper">


            <input
                type="text"
                id="messageInput"
                class="message-input"
                placeholder="Message Viggo..."
                autocomplete="off"
            >


            <!-- MIC -->

            <button
                id="micButton"
                class="mic-button"
                title="Voice Input">

                🎤

            </button>


            <!-- SEND -->

            <button
                id="sendButton"
                class="send-button"
                title="Send">

                ➤

            </button>


        </div>


    </div>


</main>


</div>



<!-- =================================================
     HISTORY MODAL
================================================= -->

<div
    class="modal"
    id="historyModal">


    <div class="modal-box">


        <div class="modal-header">


            <h3>

                🕘 Chat History

            </h3>


            <button
                class="close-button"
                id="closeHistory">

                ×

            </button>


        </div>


        <div
            id="historyList">

        </div>


    </div>


</div>



<script>

/* =====================================================
   ELEMENTS
===================================================== */

const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");

const conversation =
    document.getElementById("conversation");

const newChat =
    document.getElementById("newChat");

const moreButton =
    document.getElementById("moreButton");

const moreMenu =
    document.getElementById("moreMenu");

const pinnedList =
    document.getElementById("pinnedList");

const recentList =
    document.getElementById("recentList");

const historyModal =
    document.getElementById("historyModal");

const historyList =
    document.getElementById("historyList");

const closeHistory =
    document.getElementById("closeHistory");

const shareButton =
    document.getElementById("shareButton");


/* =====================================================
   DATA
===================================================== */

let chats = [];

let voiceEnabled = true;

let currentVoice = "female";


/* =====================================================
   LOAD LOCAL STORAGE
===================================================== */

try {

    const saved =
        localStorage.getItem("viggoChats");

    chats =
        saved
            ? JSON.parse(saved)
            : [];

    if (!Array.isArray(chats)) {

        chats = [];

    }

} catch (error) {

    console.error(error);

    chats = [];

}


/* =====================================================
   SAVE
===================================================== */

function saveChats() {

    localStorage.setItem(
        "viggoChats",
        JSON.stringify(chats)
    );

}


/* =====================================================
   MORE MENU
===================================================== */

moreButton.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        moreMenu.classList.toggle(
            "show"
        );

    }
);


moreMenu.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

    }
);


document.addEventListener(
    "click",
    function() {

        moreMenu.classList.remove(
            "show"
        );

    }
);


/* =====================================================
   ADD MESSAGE
===================================================== */

function addMessage(
    text,
    sender
) {

    if (
        text === undefined ||
        text === null ||
        !String(text).trim()
    ) {

        return;

    }


    const welcome =
        document.getElementById("welcome");


    if (welcome) {

        welcome.style.display =
            "none";

    }


    const message =
        document.createElement("div");

    message.className =
        "message";


    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar " +
        (
            sender === "user"
                ? "user-avatar"
                : ""
        );


    avatar.textContent =
        sender === "user"
            ? "U"
            : "B";


    const content =
        document.createElement("div");

    content.className =
        "message-content";


    const name =
        document.createElement("div");

    name.className =
        "message-name";


    name.textContent =
        sender === "user"
            ? "You"
            : "Viggo";


    const textDiv =
        document.createElement("div");

    textDiv.className =
        "message-text";


    textDiv.textContent =
        String(text);


    content.appendChild(name);

    content.appendChild(textDiv);


    /* ASSISTANT ACTIONS */

    if (sender === "assistant") {

        const actions =
            document.createElement("div");

        actions.className =
            "message-actions";


        /* COPY */

        const copy =
            document.createElement("button");

        copy.textContent =
            "📋 Copy";


        copy.onclick =
            function() {

                navigator.clipboard.writeText(
                    String(text)
                );

                copy.textContent =
                    "✓ Copied";


                setTimeout(
                    function() {

                        copy.textContent =
                            "📋 Copy";

                    },
                    1200
                );

            };


        /* SPEAKER */

        const speaker =
            document.createElement("button");

        speaker.textContent =
            "🔊 Speaker";


        speaker.onclick =
            function() {

                speakText(text);

            };


        /* LIKE */

        const like =
            document.createElement("button");

        like.textContent =
            "👍 Like";


        like.onclick =
            function() {

                like.textContent =
                    "❤️ Liked";

            };


        actions.appendChild(copy);

        actions.appendChild(speaker);

        actions.appendChild(like);

        content.appendChild(actions);

    }


    message.appendChild(avatar);

    message.appendChild(content);

    conversation.appendChild(message);


    scrollChat();

}


/* =====================================================
   SCROLL
===================================================== */

function scrollChat() {

    const area =
        document.getElementById(
            "chatArea"
        );


    area.scrollTop =
        area.scrollHeight;

}


/* =====================================================
   SAVE CHAT
===================================================== */

function saveChat(text) {

    if (
        !text ||
        !String(text).trim()
    ) {

        return;

    }


    const chat = {

        id:
            Date.now() +
            Math.random(),

        title:
            String(text).length > 35
                ? String(text).substring(
                    0,
                    35
                  ) + "..."
                : String(text),

        message:
            String(text),

        time:
            new Date().toLocaleString(),

        pinned:
            false

    };


    chats.push(chat);

    saveChats();

    renderRecent();

    renderPinned();

}


/* =====================================================
   SEND MESSAGE
===================================================== */

function sendMessage() {

    const text =
        messageInput.value.trim();


    if (!text) {

        return;

    }


    addMessage(
        text,
        "user"
    );


    saveChat(text);


    messageInput.value = "";


    setTimeout(
        function() {

            const reply =
                "Okay friend, I received your message: " +
                text;


            addMessage(
                reply,
                "assistant"
            );


            speakText(reply);

        },
        500
    );

}


/* =====================================================
   SEND BUTTON
===================================================== */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* =====================================================
   ENTER
===================================================== */

messageInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
   NEW CHAT
===================================================== */

newChat.addEventListener(
    "click",
    function() {


        conversation.innerHTML = `

            <div
                class="welcome"
                id="welcome">

                <div class="welcome-icon">
                    B
                </div>

                <h1>
                    Viggo
                </h1>

                <p>
                    Your AI friend is ready.
                </p>

            </div>

        `;


        document.getElementById(
            "headerTitle"
        ).textContent =
            "New Chat";


        messageInput.value = "";


        speechSynthesis.cancel();

    }
);


/* =====================================================
   RECENT
===================================================== */

function renderRecent() {

    recentList.innerHTML = "";


    if (chats.length === 0) {

        recentList.innerHTML = `

            <div class="empty-list">
                No recent chats
            </div>

        `;

        return;

    }


    chats
        .slice()
        .reverse()
        .slice(0, 8)
        .forEach(
            function(chat) {


                const button =
                    document.createElement(
                        "button"
                    );


                button.className =
                    "chat-item";


                button.textContent =
                    "💬 " +
                    (
                        chat.title ||
                        chat.message ||
                        "New Chat"
                    );


                button.onclick =
                    function() {

                        messageInput.value =
                            chat.message || "";

                        messageInput.focus();

                    };


                recentList.appendChild(
                    button
                );

            }
        );

}


/* =====================================================
   PINNED
===================================================== */

function renderPinned() {

    pinnedList.innerHTML = "";


    const pinned =
        chats.filter(
            function(chat) {

                return chat.pinned === true;

            }
        );


    if (pinned.length === 0) {

        pinnedList.innerHTML = `

            <div class="empty-list">
                No pinned chats
            </div>

        `;

        return;

    }


    pinned
        .slice()
        .reverse()
        .forEach(
            function(chat) {


                const button =
                    document.createElement(
                        "button"
                    );


                button.className =
                    "chat-item";


                button.textContent =
                    "📌 " +
                    (
                        chat.title ||
                        chat.message ||
                        "Pinned Chat"
                    );


                button.onclick =
                    function() {

                        messageInput.value =
                            chat.message || "";

                        messageInput.focus();

                    };


                pinnedList.appendChild(
                    button
                );

            }
        );

}


/* =====================================================
   PIN CHAT
===================================================== */

document
.getElementById("pinButton")
.addEventListener(
    "click",
    function() {


        if (chats.length === 0) {

            moreMenu.classList.remove(
                "show"
            );

            return;

        }


        chats[
            chats.length - 1
        ].pinned = true;


        saveChats();

        renderPinned();

        renderRecent();


        moreMenu.classList.remove(
            "show"
        );

    }
);


/* =====================================================
   HISTORY
===================================================== */

function renderHistory() {

    historyList.innerHTML = "";


    if (
        !chats ||
        chats.length === 0
    ) {

        historyList.innerHTML = `

            <div class="empty-list">
                No chat history
            </div>

        `;

        return;

    }


    /* HISTORY ITEMS */

    chats
        .slice()
        .reverse()
        .forEach(
            function(chat) {


                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "history-item";


                item.dataset.id =
                    String(chat.id);


                item.innerHTML = `

                    <div class="history-main">

                        <input
                            type="checkbox"
                            class="history-checkbox"
                            data-id="${chat.id}"
                        >

                        <div class="history-info">

                            <div>
                                💬 ${
                                    chat.title ||
                                    chat.message ||
                                    "New Chat"
                                }
                            </div>

                            <div class="history-time">

                                ${
                                    chat.time || ""
                                }

                            </div>

                        </div>

                    </div>


                    <div class="history-delete-area">

                        <button
                            class="history-delete-btn"
                            data-id="${chat.id}">

                            🗑 Delete

                        </button>

                    </div>

                `;


                historyList.appendChild(
                    item
                );

            }
        );


    /* =================================================
       SINGLE DELETE
    ================================================= */

    document
        .querySelectorAll(
            ".history-delete-btn"
        )
        .forEach(
            function(button) {


                button.addEventListener(
                    "click",
                    function(event) {


                        event.preventDefault();

                        event.stopPropagation();


                        const id =
                            String(
                                this.dataset.id
                            );


                        chats =
                            chats.filter(
                                function(chat) {

                                    return String(
                                        chat.id
                                    ) !== id;

                                }
                            );


                        saveChats();

                        renderRecent();

                        renderPinned();

                        renderHistory();

                    }
                );

            }
        );


    /* =================================================
       DOUBLE CLICK = SELECTION MODE
    ================================================= */

    document
        .querySelectorAll(
            ".history-item"
        )
        .forEach(
            function(item) {


                item.addEventListener(
                    "dblclick",
                    function(event) {


                        event.preventDefault();


                        this.classList.toggle(
                            "selection-mode"
                        );


                        const checkbox =
                            this.querySelector(
                                ".history-checkbox"
                            );


                        checkbox.checked =
                            this.classList.contains(
                                "selection-mode"
                            );

                    }
                );

            }
        );


    /* =================================================
       SELECT ALL + DELETE
    ================================================= */

    const controls =
        document.createElement(
            "div"
        );


    controls.className =
        "history-controls";


    controls.innerHTML = `

        <button id="selectAllHistory">

            ☑ Select All

        </button>


        <button
            id="deleteSelectedHistory"
            class="delete-selected">

            🗑 Delete Selected

        </button>

    `;


    historyList.appendChild(
        controls
    );


    /* =================================================
       SELECT ALL
    ================================================= */

    document
        .getElementById(
            "selectAllHistory"
        )
        .onclick =
        function() {


            const boxes =
                document.querySelectorAll(
                    ".history-checkbox"
                );


            boxes.forEach(
                function(box) {


                    box.checked =
                        true;


                    box
                        .closest(
                            ".history-item"
                        )
                        .classList.add(
                            "selection-mode"
                        );

                }
            );

        };


    /* =================================================
       DELETE SELECTED
    ================================================= */

    document
        .getElementById(
            "deleteSelectedHistory"
        )
        .onclick =
        function() {


            const selected =
                Array.from(
                    document.querySelectorAll(
                        ".history-checkbox:checked"
                    )
                )
                .map(
                    function(box) {

                        return String(
                            box.dataset.id
                        );

                    }
                );


            if (
                selected.length === 0
            ) {

                return;

            }


            chats =
                chats.filter(
                    function(chat) {


                        return !selected.includes(
                            String(chat.id)
                        );

                    }
                );


            saveChats();

            renderRecent();

            renderPinned();

            renderHistory();

        };

}

/* =====================================================
   SHARE
===================================================== */

shareButton.addEventListener(
    "click",
    async function() {


        let text =
            "Viggo AI Chat\n\n";


        document
            .querySelectorAll(
                ".message"
            )
            .forEach(
                function(message) {


                    const name =
                        message.querySelector(
                            ".message-name"
                        );


                    const content =
                        message.querySelector(
                            ".message-text"
                        );


                    if (
                        name &&
                        content
                    ) {

                        text +=
                            name.textContent +
                            ": " +
                            content.textContent +
                            "\n\n";

                    }

                }
            );


        if (
            navigator.share
        ) {

            try {

                await navigator.share({

                    title:
                        "Viggo AI",

                    text:
                        text

                });

            }
            catch(error) {}

        }
        else {


            navigator.clipboard.writeText(
                text
            );


            shareButton.textContent =
                "✓ Copied";


            setTimeout(
                function() {

                    shareButton.textContent =
                        "↗ Share";

                },
                1500
            );

        }

    }
);

/* =====================================================
   TEXT TO SPEECH
===================================================== */

function speakText(text) {


    if (!voiceEnabled) {

        return;

    }


    if (
        !("speechSynthesis" in window)
    ) {

        return;

    }


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            String(text)
        );


    const voices =
        speechSynthesis.getVoices();


    let selected =
        null;


    if (
        currentVoice === "female"
    ) {


        selected =
            voices.find(
                function(voice) {

                    return /female|zira|samantha|karen|susan|google us english/i
                        .test(
                            voice.name
                        );

                }
            );

    }
    else {


        selected =
            voices.find(
                function(voice) {

                    return /male|david|alex|daniel|google uk english/i
                        .test(
                            voice.name
                        );

                }
            );

    }


    if (selected) {

        utterance.voice =
            selected;

    }


    utterance.rate =
        1;

    utterance.pitch =
        1;


    speechSynthesis.speak(
        utterance
    );

}


/* =====================================================
   MICROPHONE
===================================================== */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition =
    null;


if (SpeechRecognition) {


    recognition =
        new SpeechRecognition();


    recognition.lang =
        "en-IN";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.onstart =
        function() {


            micButton.classList.add(
                "recording"
            );


            micButton.textContent =
                "🔴";

        };


    recognition.onend =
        function() {


            micButton.classList.remove(
                "recording"
            );


            micButton.textContent =
                "🎤";

        };


    recognition.onresult =
        function(event) {


            messageInput.value =
                event
                    .results[0][0]
                    .transcript;


            messageInput.focus();

        };

}


/* =====================================================
   MIC BUTTON
===================================================== */

micButton.addEventListener(
    "click",
    function() {


        if (!recognition) {

            return;

        }


        try {

            recognition.start();

        }
        catch(error) {}

    }
);


/* =====================================================
   INITIAL LOAD
===================================================== */

renderRecent();

renderPinned();

</script>
