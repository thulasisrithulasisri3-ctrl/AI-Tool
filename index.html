<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Viggo AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- ================= SIDEBAR ================= -->

        <aside class="sidebar" id="sidebar">

            <div class="sidebar-header">

                <div class="brand">
                    <div class="brand-logo">V</div>

                    <div>
                        <div class="brand-name">
                            Viggo AI
                        </div>

                        <div class="brand-status">
                            AI Assistant
                        </div>
                    </div>
                </div>

                <button
                    class="sidebar-close"
                    id="sidebarClose"
                    type="button">
                    ×
                </button>

            </div>


            <!-- NEW CHAT -->

            <button
                class="new-chat-btn"
                id="newChatBtn"
                type="button">

                <span>＋</span>
                <span>New Chat</span>

            </button>


            <!-- RECENT -->

            <div class="recent-title">

                <span>Recent</span>

                <span
                    id="recentCount">
                    0
                </span>

            </div>


            <div
                class="recent-history"
                id="recentHistory">
            </div>


            <!-- MORE -->

            <div class="sidebar-bottom">

                <button
                    class="sidebar-more-btn"
                    id="sidebarMoreBtn"
                    type="button">

                    <span>•••</span>
                    <span>More</span>

                </button>


                <div
                    class="sidebar-more-menu"
                    id="sidebarMoreMenu">

                    <button
                        id="languageBtn"
                        type="button">

                        🌐 Language

                    </button>


                    <button
                        id="voiceBtn"
                        type="button">

                        🎤 Voice

                    </button>


                    <button
                        id="deleteBtn"
                        type="button">

                        🗑 Delete Chat

                    </button>

                </div>

            </div>

        </aside>


        <!-- ================= MAIN ================= -->

        <main class="main">


            <!-- HEADER -->

            <header class="top-bar">

                <div class="top-left">

                    <button
                        id="menuBtn"
                        class="menu-btn"
                        type="button">

                        ☰

                    </button>


                    <div>

                        <div class="top-title">
                            Viggo AI
                        </div>

                        <div class="online-status">

                            <span></span>
                            Online

                        </div>

                    </div>

                </div>


                <!-- SHARE CHAT -->

                <button
                    id="shareChatBtn"
                    class="share-chat-btn"
                    type="button">

                    🔗 Share

                </button>

            </header>


            <!-- ================= CHAT AREA ================= -->

            <section
                class="chat-area"
                id="chatArea">


                <!-- WELCOME -->

                <div
                    class="welcome"
                    id="welcome">

                    <div class="welcome-logo">
                        V
                    </div>

                    <h1>
                        Hello! I'm Viggo AI
                    </h1>

                    <p>
                        Your friendly AI assistant
                    </p>

                </div>

            </section>


            <!-- ================= INPUT ================= -->

            <footer class="input-section">

                <div class="input-wrapper">


                    <!-- PLUS -->

                    <button
                        id="plusBtn"
                        class="input-button"
                        type="button">

                        ＋

                    </button>


                    <!-- MESSAGE -->

                    <textarea
                        id="messageInput"
                        placeholder="Message Viggo AI..."
                        rows="1">
                    </textarea>


                    <!-- VOICE -->

                    <button
                        id="voiceInputBtn"
                        class="input-button"
                        type="button">

                        🎤

                    </button>


                    <!-- SEND -->

                    <button
                        id="sendBtn"
                        class="send-button"
                        type="button">

                        ➤

                    </button>

                </div>


                <div class="input-note">

                    Viggo AI can make mistakes.
                    Check important information.

                </div>

            </footer>

        </main>

    </div>


    <!-- ==================================================
         PLUS MENU
    ================================================== -->

    <div
        class="popup-menu"
        id="plusMenu">

        <button
            id="photoBtn"
            type="button">

            📷 Photos

        </button>


        <button
            id="videoBtn"
            type="button">

            🎥 Videos

        </button>


        <button
            id="fileBtn"
            type="button">

            📎 Files

        </button>

    </div>


    <!-- FILE INPUTS -->

    <input
        type="file"
        id="photoInput"
        accept="image/*"
        multiple
        hidden>


    <input
        type="file"
        id="videoInput"
        accept="video/*"
        multiple
        hidden>


    <input
        type="file"
        id="fileInput"
        multiple
        hidden>


    <!-- ==================================================
         LANGUAGE MENU
    ================================================== -->

    <div
        class="popup-menu language-menu"
        id="languageMenu">

        <div class="popup-title">
            🌐 Language
        </div>


        <button
            type="button"
            data-language="en">

            English

        </button>


        <button
            type="button"
            data-language="ta">

            தமிழ்

        </button>


        <button
            type="button"
            data-language="hi">

            हिन्दी

        </button>


        <button
            type="button"
            data-language="ml">

            മലയാളം

        </button>


        <button
            type="button"
            data-language="te">

            తెలుగు

        </button>


        <button
            type="button"
            data-language="kn">

            ಕನ್ನಡ

        </button>


        <button
            id="moreLanguagesBtn"
            type="button">

            ＋ More Languages

        </button>


        <div
            id="moreLanguages"
            class="more-languages">


            <button
                type="button"
                data-language="bn">

                Bengali

            </button>


            <button
                type="button"
                data-language="mr">

                Marathi

            </button>


            <button
                type="button"
                data-language="gu">

                Gujarati

            </button>


            <button
                type="button"
                data-language="pa">

                Punjabi

            </button>


            <button
                type="button"
                data-language="ur">

                Urdu

            </button>


            <button
                type="button"
                data-language="es">

                Spanish

            </button>


            <button
                type="button"
                data-language="fr">

                French

            </button>


            <button
                type="button"
                data-language="de">

                German

            </button>


            <button
                type="button"
                data-language="ja">

                Japanese

            </button>


            <button
                type="button"
                data-language="ko">

                Korean

            </button>


            <button
                type="button"
                data-language="zh">

                Chinese

            </button>


            <button
                type="button"
                data-language="ar">

                Arabic

            </button>

        </div>

    </div>


    <!-- ==================================================
         VOICE MENU
    ================================================== -->

    <div
        class="popup-menu voice-menu"
        id="voiceMenu">

        <div class="popup-title">
            🎤 Voice
        </div>


        <button
            type="button"
            data-voice="female">

            👩 Female

        </button>


        <button
            type="button"
            data-voice="male">

            👨 Male

        </button>


        <div
            id="voiceStatus"
            class="voice-status">

            👩 Female voice selected

        </div>

    </div>


    <!-- ==================================================
         DELETE MENU
    ================================================== -->

    <div
        class="popup-menu delete-menu"
        id="deleteMenu">

        <div class="popup-title">
            🗑 Delete Chat
        </div>


        <button
            id="selectDeleteBtn"
            type="button">

            ☑ Select Chat

        </button>


        <button
            id="clearAllBtn"
            type="button">

            🧹 Clear All Chats

        </button>

    </div>


    <!-- ==================================================
         SHARE POPUP
    ================================================== -->

    <div
        class="share-overlay"
        id="shareOverlay">

        <div class="share-box">

            <h2>
                🔗 Share Chat
            </h2>


            <input
                id="shareLink"
                type="text"
                readonly>


            <button
                id="copyShareLink"
                type="button">

                📋 Copy Link

            </button>


            <button
                id="nativeShare"
                type="button">

                ↗ Share

            </button>


            <button
                id="closeShare"
                type="button">

                Close

            </button>

        </div>

    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="script.js"></script>

</body>

</html>
