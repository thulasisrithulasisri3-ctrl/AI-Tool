<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viggo AI Assistant</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef2f7;
    }

    .app {
      max-width: 850px;
      height: 100vh;
      margin: auto;
      background: white;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #111827;
      color: white;
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header h1 {
      margin: 0;
      font-size: 21px;
    }

    button {
      cursor: pointer;
    }

    #historyButton {
      border: none;
      background: #374151;
      color: white;
      padding: 9px 12px;
      border-radius: 8px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
    }

    .message {
      max-width: 82%;
      padding: 12px 15px;
      margin-bottom: 12px;
      border-radius: 15px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user {
      margin-left: auto;
      background: #2563eb;
      color: white;
    }

    .ai {
      margin-right: auto;
      background: #e5e7eb;
      color: #111827;
    }

    .input-area {
      border-top: 1px solid #ddd;
      padding: 12px;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    #message {
      flex: 1;
      resize: none;
      border: 1px solid #ccc;
      border-radius: 12px;
      padding: 13px;
      font-size: 16px;
      outline: none;
    }

    #send {
      width: 85px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 15px;
    }

    #send:disabled {
      opacity: 0.5;
    }

    .voice-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
    }

    #mic {
      width: 58px;
      height: 45px;
      border: none;
      border-radius: 12px;
      background: #16a34a;
      color: white;
      font-size: 22px;
    }

    #mic.listening {
      background: #dc2626;
    }

    #voiceToggle {
      border: none;
      padding: 10px 15px;
      border-radius: 10px;
      background: #16a34a;
      color: white;
    }

    #voiceToggle.off {
      background: #6b7280;
    }

    .panel {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 20;
    }

    .panel-box {
      width: 92%;
      max-width: 550px;
      height: 82vh;
      margin: 7vh auto;
      background: white;
      border-radius: 15px;
      padding: 18px;
      overflow-y: auto;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    #closeHistory {
      border: none;
      background: #ef4444;
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
    }

    .history-item {
      border-bottom: 1px solid #ddd;
      padding: 13px 0;
    }

    .history-user {
      font-weight: bold;
      margin-bottom: 6px;
    }

    .history-ai {
      color: #444;
      white-space: pre-wrap;
    }

    .history-time {
      display: block;
      margin-top: 6px;
      font-size: 12px;
      color: #777;
    }

    .history-actions {
      margin-top: 9px;
      display: flex;
      gap: 7px;
    }

    .pin {
      border: none;
      background: #facc15;
      padding: 7px 10px;
      border-radius: 7px;
    }

    .delete {
      border: none;
      background: #ef4444;
      color: white;
      padding: 7px 10px;
      border-radius: 7px;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 30px;
    }

    @media (max-width: 600px) {
      .app {
        height: 100dvh;
      }

      .message {
        max-width: 90%;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>🤖 Viggo AI Assistant</h1>

    <button id="historyButton">
      📜 History
    </button>
  </div>


  <div id="chat">

    <div class="message ai">
      Hello! 👋
      I am Viggo AI Assistant.
      How can I help you?
    </div>

  </div>


  <div class="input-area">

    <div class="input-row">

      <textarea
        id="message"
        rows="2"
        placeholder="Type your message..."
      ></textarea>

      <button id="send">
        Send
      </button>

    </div>


    <div class="voice-row">

      <button id="mic" title="Speak">
        🎤
      </button>

      <button id="voiceToggle">
        🔊 Voice ON
      </button>

    </div>

  </div>

</div>


<div id="historyPanel" class="panel">

  <div class="panel-box">

    <div class="panel-header">

      <h2>📜 Viggo History</h2>

      <button id="closeHistory">
        Close
      </button>

    </div>

    <div id="historyList"></div>

  </div>

</div>


<script src="script.js"></script>

</body>
</html>
