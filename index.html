```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AI Assistant</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .app {
      width: 100%;
      max-width: 900px;
      height: 100vh;
      margin: auto;
      display: flex;
      flex-direction: column;
      background: white;
    }

    .header {
      padding: 18px 20px;
      background: #111827;
      color: white;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 22px;
    }

    .header p {
      margin: 5px 0 0;
      font-size: 13px;
      opacity: 0.8;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      max-width: 80%;
      margin-bottom: 14px;
      padding: 12px 15px;
      border-radius: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user-message {
      margin-left: auto;
      background: #2563eb;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .ai-message {
      margin-right: auto;
      background: #e5e7eb;
      color: #111827;
      border-bottom-left-radius: 4px;
    }

    .welcome {
      text-align: center;
      margin-top: 80px;
      color: #6b7280;
    }

    .welcome h2 {
      color: #111827;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 15px;
      border-top: 1px solid #ddd;
      background: white;
    }

    #messageInput {
      flex: 1;
      min-height: 48px;
      max-height: 140px;
      resize: vertical;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    #messageInput:focus {
      border-color: #2563eb;
    }

    #sendButton {
      min-width: 90px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #sendButton:hover {
      background: #1d4ed8;
    }

    #sendButton:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      padding: 6px 15px;
      text-align: center;
      font-size: 12px;
      color: #6b7280;
      background: #f9fafb;
    }

    @media (max-width: 600px) {
      .message {
        max-width: 90%;
      }

      .input-area {
        padding: 10px;
      }

      #sendButton {
        min-width: 70px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <header class="header">
      <h1>🤖 AI Assistant</h1>
      <p>Gemini AI • Text Chat</p>
    </header>

    <div id="chat">

      <div class="welcome">
        <h2>Hello 👋</h2>
        <p>Ask me anything.</p>
        <p>தமிழிலும் கேட்கலாம்.</p>
      </div>

    </div>

    <div class="status">
      AI Assistant Online
    </div>

    <div class="input-area">

      <textarea
        id="messageInput"
        placeholder="Type your message..."
        rows="1"
      ></textarea>

      <button id="sendButton">
        Send
      </button>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
```
