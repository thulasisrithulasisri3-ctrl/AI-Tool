<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Viggo AI</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at 20% 10%, #123b75 0%, transparent 35%),
        radial-gradient(circle at 80% 90%, #071a38 0%, transparent 40%),
        #030812;
    color: #ffffff;
    height: 100vh;
    overflow: hidden;
}

/* ================= APP ================= */

.app {
    display: flex;
    height: 100vh;
}

/* ================= SIDEBAR ================= */

.sidebar {
    width: 270px;
    background: rgba(3, 10, 22, 0.94);
    border-right: 1px solid rgba(38, 126, 255, 0.25);
    box-shadow: 8px 0 35px rgba(0, 75, 180, 0.12);
    padding: 18px;
    display: flex;
    flex-direction: column;
}

/* LOGO */

.logo {
    display: flex;
    align-items: center;
    gap: 11px;
    margin-bottom: 25px;
}

.logo-b {
    width: 42px;
    height: 42px;
    border-radius: 12px;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 23px;
    font-weight: bold;

    background: linear-gradient(
        145deg,
        #248cff,
        #0751c9
    );

    box-shadow:
        0 0 12px rgba(20, 125, 255, .7),
        inset 0 0 12px rgba(255,255,255,.12);
}

.logo-text {
    font-size: 22px;
    font-weight: bold;
}

/* NEW CHAT */

.new-chat {
    border: 1px solid rgba(55, 145, 255, .35);

    background:
        linear-gradient(
            135deg,
            rgba(18, 78, 150, .65),
            rgba(5, 20, 45, .8)
        );

    color: white;

    padding: 12px;

    border-radius: 10px;

    cursor: pointer;

    text-align: left;

    font-size: 14px;

    box-shadow:
        0 5px 20px rgba(0, 80, 200, .15);

    transition: .2s;
}

.new-chat:hover {
    border-color: #238cff;

    box-shadow:
        0 0 18px rgba(20,130,255,.3);
}

/* SIDEBAR TITLE */

.side-title {
    color: #6e9bcf;
    font-size: 11px;
    margin-top: 22px;
    margin-bottom: 8px;
    text-transform: uppercase;
}

/* CHAT LIST */

.chat-list {
    overflow-y: auto;
}

.chat-item {
    width: 100%;

    background: transparent;

    color: #c9d9ef;

    border: none;

    padding: 10px;

    border-radius: 8px;

    text-align: left;

    cursor: pointer;

    margin-bottom: 3px;
}

.chat-item:hover,
.chat-item.active {
    background:
        linear-gradient(
            90deg,
            rgba(20,105,210,.35),
            rgba(15,30,60,.2)
        );

    color: white;
}

/* SIDEBAR BOTTOM */

.sidebar-bottom {
    margin-top: auto;

    display: flex;
    flex-direction: column;

    gap: 8px;
}

.side-button {
    border: 1px solid rgba(55,145,255,.18);

    background: rgba(10,25,48,.75);

    color: #dceaff;

    padding: 10px;

    border-radius: 8px;

    cursor: pointer;

    text-align: left;

    transition: .2s;
}

.side-button:hover {
    background: rgba(20,80,160,.35);
    border-color: #247fff;
}

/* ================= MAIN ================= */

.main {
    flex: 1;

    display: flex;
    flex-direction: column;

    min-width: 0;
}

/* ================= TOPBAR ================= */

.topbar {
    height: 64px;

    display: flex;
    align-items: center;

    padding: 0 20px;

    background:
        linear-gradient(
            90deg,
            rgba(5,15,30,.95),
            rgba(7,22,45,.9)
        );

    border-bottom:
        1px solid rgba(40,130,255,.2);

    box-shadow:
        0 5px 25px rgba(0,80,180,.12);
}

.current-title {
    font-size: 16px;
    font-weight: bold;
}

.online {
    display: flex;
    align-items: center;
    gap: 7px;

    margin-left: 12px;

    font-size: 12px;

    color: #4ca3ff;
}

.online-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #2b9cff;

    box-shadow:
        0 0 10px #238cff;
}

/* TOP ACTIONS */

.top-actions {
    margin-left: auto;

    display: flex;

    gap: 8px;
}

.top-btn {
    border: 1px solid rgba(50,140,255,.25);

    background: rgba(10,30,60,.8);

    color: #d9eaff;

    padding: 8px 12px;

    border-radius: 8px;

    cursor: pointer;

    transition: .2s;
}

.top-btn:hover {
    border-color: #298cff;

    box-shadow:
        0 0 12px rgba(20,130,255,.3);
}

/* ================= CHAT AREA ================= */

.chat-area {
    flex: 1;

    overflow-y: auto;

    padding: 25px;
}

.conversation {
    max-width: 900px;

    margin: auto;
}

/* WELCOME */

.welcome {
    min-height: 65vh;

    display: flex;

    justify-content: center;

    align-items: center;

    text-align: center;
}

.welcome-b {
    width: 80px;
    height: 80px;

    border-radius: 22px;

    display: flex;

    justify-content: center;
    align-items: center;

    margin: auto;

    font-size: 42px;
    font-weight: bold;

    background:
        linear-gradient(
            145deg,
            #238cff,
            #063c9d
        );

    box-shadow:
        0 0 25px rgba(20,130,255,.6),
        0 0 70px rgba(10,80,200,.25);
}

.welcome h1 {
    margin-top: 18px;

    font-size: 30px;
}

.welcome p {
    margin-top: 10px;

    color: #7895ba;
}

/* ================= MESSAGE ================= */

.message {
    display: flex;

    gap: 13px;

    padding: 19px 12px;

    border-bottom:
        1px solid rgba(50,130,255,.1);
}

.message.user {
    background: rgba(5,15,30,.3);
}

.message.ai {
    background:
        linear-gradient(
            90deg,
            rgba(8,28,58,.48),
            rgba(4,12,25,.3)
        );

    border-radius: 10px;
}

/* AVATAR */

.avatar {
    width: 36px;
    height: 36px;

    min-width: 36px;

    border-radius: 9px;

    display: flex;

    justify-content: center;
    align-items: center;

    background:
        linear-gradient(
            145deg,
            #238cff,
            #0751bd
        );

    font-weight: bold;

    box-shadow:
        0 0 12px rgba(20,125,255,.3);
}

.user .avatar {
    background:
        linear-gradient(
            145deg,
            #293a52,
            #111b2b
        );
}

.message-content {
    flex: 1;
}

.message-name {
    font-weight: bold;

    margin-bottom: 6px;
}

.message-text {
    color: #d4e1f2;

    line-height: 1.65;

    white-space: pre-wrap;
}

/* ================= MESSAGE BUTTONS ================= */

.message-actions {
    display: flex;

    gap: 6px;

    margin-top: 11px;
}

.msg-btn {
    border:
        1px solid rgba(60,145,255,.2);

    background:
        rgba(8,25,50,.7);

    color: #9fc5ed;

    padding: 6px 9px;

    border-radius: 7px;

    cursor: pointer;

    font-size: 12px;

    transition: .2s;
}

.msg-btn:hover {
    color: white;

    border-color: #248cff;

    background:
        rgba(20,90,180,.35);

    box-shadow:
        0 0 10px rgba(20,120,255,.2);
}

.msg-btn.active {
    background: #126ed3;

    color: white;

    border-color: #3298ff;
}

/* ================= INPUT ================= */

.input-area {
    padding: 15px 20px;

    background:
        linear-gradient(
            180deg,
            rgba(3,10,22,.7),
            rgba(2,7,15,.97)
        );

    border-top:
        1px solid rgba(45,130,255,.18);
}

.input-box {
    max-width: 900px;

    margin: auto;

    display: flex;

    align-items: center;

    gap: 8px;

    padding: 7px;

    border-radius: 14px;

    background:
        rgba(7,22,45,.95);

    border:
        1px solid rgba(50,140,255,.25);

    box-shadow:
        0 0 25px rgba(0,80,180,.12);
}

.message-input {
    flex: 1;

    background: transparent;

    border: none;

    outline: none;

    resize: none;

    color: white;

    font-size: 15px;

    padding: 10px;

    min-height: 40px;
}

.message-input::placeholder {
    color: #607c9f;
}

.input-btn {
    width: 42px;
    height: 40px;

    border: none;

    border-radius: 9px;

    cursor: pointer;

    background:
        rgba(20,60,110,.7);

    color: #c8e3ff;

    font-size: 17px;
}

.input-btn:hover {
    background: #126bd0;

    box-shadow:
        0 0 14px rgba(20,130,255,.35);
}

.send-btn {
    background:
        linear-gradient(
            145deg,
            #238cff,
            #0751c9
        );

    color: white;
}

/* ================= VOICE PANEL ================= */

.voice-panel {
    display: none;

    position: fixed;

    right: 25px;
    bottom: 90px;

    width: 280px;

    background:
        linear-gradient(
            145deg,
            #071a35,
            #020914
        );

    border:
        1px solid rgba(50,140,255,.35);

    border-radius: 14px;

    padding: 18px;

    box-shadow:
        0 0 35px rgba(0,90,220,.3);
}

.voice-panel.show {
    display: block;
}

.voice-panel h3 {
    margin-bottom: 15px;
}

.voice-select {
    width: 100%;

    padding: 10px;

    background: #091b35;

    color: white;

    border:
        1px solid rgba(50,140,255,.3);

    border-radius: 8px;
}

/* ================= MOBILE ================= */

.mobile-menu {
    display: none;
}

@media(max-width:700px) {

    .sidebar {
        position: fixed;

        left: -280px;

        top: 0;
        bottom: 0;

        z-index: 1000;

        transition: .25s;
    }

    .sidebar.open {
        left: 0;
    }

    .mobile-menu {
        display: block;

        border: 1px solid rgba(50,140,255,.2);

        background: #091b35;

        color: white;

        border-radius: 8px;

        padding: 8px 10px;

        cursor: pointer;
    }

    .topbar {
        padding: 0 10px;
    }

    .online {
        display: none;
    }

    .chat-area {
        padding: 10px;
    }

    .top-btn span {
        display: none;
    }

}

</style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar" id="sidebar">

        <div class="logo">

            <div class="logo-b">
                B
            </div>

            <div class="logo-text">
                Viggo
            </div>

        </div>


        <button class="new-chat" id="newChat">
            ＋ New Chat
        </button>


        <div class="side-title">
            Pinned
        </div>

        <div class="chat-list" id="pinnedList">
        </div>


        <div class="side-title">
            Recent
        </div>

        <div class="chat-list" id="recentList">
        </div>


        <div class="sidebar-bottom">

            <button class="side-button" id="historyButton">
                🕘 History
            </button>

            <button class="side-button" id="saveButton">
                💾 Save
            </button>

            <button class="side-button" id="voiceToggle">
                🔊 Voice ON
            </button>

            <button class="side-button" id="clearHistory">
                🗑 Clear History
            </button>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <!-- TOP -->

        <header class="topbar">

            <button class="mobile-menu" id="mobileMenu">
                ☰
            </button>


            <div class="current-title" id="currentTitle">
                New Chat
            </div>


            <div class="online">

                <span class="online-dot"></span>

                Viggo Online

            </div>


            <div class="top-actions">

                <button class="top-btn" id="shareChat">
                    🔗 <span>Share</span>
                </button>

                <button class="top-btn" id="voiceSettings">
                    🎙
                </button>

            </div>

        </header>


        <!-- CHAT -->

        <section class="chat-area">

            <div class="conversation" id="conversation">


                <div class="welcome">

                    <div>

                        <div class="welcome-b">
                            B
                        </div>

                        <h1>
                            Welcome to Viggo
                        </h1>

                        <p>
                            Your AI assistant is ready.
                        </p>

                    </div>

                </div>


            </div>

        </section>


        <!-- INPUT -->

        <footer class="input-area">

            <div class="input-box">

                <textarea
                    class="message-input"
                    id="message"
                    placeholder="Message Viggo..."
                    rows="1"
                ></textarea>


                <button
                    class="input-btn"
                    id="mic"
                    title="Voice input"
                >
                    🎤
                </button>


                <button
                    class="input-btn send-btn"
                    id="send"
                    title="Send"
                >
                    ➤
                </button>

            </div>

        </footer>

    </main>

</div>


<!-- VOICE SETTINGS -->

<div class="voice-panel" id="voicePanel">

    <h3>
        🎙 Voice Settings
    </h3>

    <select
        class="voice-select"
        id="voiceSelect"
    >
        <option>
            Default Voice
        </option>
    </select>

    <br><br>

    <button
        class="top-btn"
        id="testVoice"
    >
        🔊 Test Voice
    </button>

</div>


<script src="script.js"></script>

</body>
</html>
