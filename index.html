<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Voice Assistant</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #111827, #312e81);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app {
            width: 100%;
            max-width: 650px;
            height: 700px;
            background: white;
            border-radius: 25px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        .header {
            padding: 20px;
            background: #4f46e5;
            color: white;
            text-align: center;
        }

        .header h1 {
            font-size: 25px;
        }

        .header p {
            margin-top: 6px;
            opacity: 0.85;
        }

        #chat {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8fafc;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            margin-bottom: 12px;
            border-radius: 16px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .ai {
            background: #e5e7eb;
            color: #111827;
        }

        .user {
            background: #4f46e5;
            color: white;
            margin-left: auto;
        }

        .bottom {
            padding: 15px;
            display: flex;
            gap: 8px;
            border-top: 1px solid #ddd;
            background: white;
            flex-wrap: wrap;
        }

        #messageInput {
            flex: 1;
            min-width: 180px;
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 15px;
            outline: none;
            font-size: 16px;
        }

        #language {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 15px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        button {
            border: none;
            border-radius: 15px;
            padding: 12px 16px;
            cursor: pointer;
            font-size: 18px;
            background: #4f46e5;
            color: white;
        }

        button:hover {
            transform: scale(1.05);
        }

        #micButton {
            background: #ef4444;
        }

        @media (max-width: 600px) {
            .app {
                height: 90vh;
            }

            .bottom {
                flex-direction: column;
            }

            #messageInput,
            #language,
            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <div class="header">
        <h1>🤖 AI Voice Assistant</h1>
        <p>Speak in your language 🌍</p>
    </div>

    <div id="chat">

        <div class="message ai">
            Hello! 👋 I'm your AI assistant.
            Choose a language and start chatting.
        </div>

    </div>

    <div class="bottom">

        <input
            type="text"
            id="messageInput"
            placeholder="Type your message..."
            onkeydown="handleEnter(event)"
        >

        <select id="language">

            <option value="en-IN">
                🇬🇧 English
            </option>

            <option value="ta-IN">
                🇮🇳 தமிழ்
            </option>

            <option value="hi-IN">
                🇮🇳 हिन्दी
            </option>

            <option value="te-IN">
                🇮🇳 తెలుగు
            </option>

            <option value="ml-IN">
                🇮🇳 മലയാളം
            </option>

            <option value="kn-IN">
                🇮🇳 ಕನ್ನಡ
            </option>

            <option value="bn-IN">
                🇮🇳 বাংলা
            </option>

            <option value="mr-IN">
                🇮🇳 मराठी
            </option>

            <option value="gu-IN">
                🇮🇳 ગુજરાતી
            </option>

            <option value="pa-IN">
                🇮🇳 ਪੰਜਾਬੀ
            </option>

            <option value="fr-FR">
                🇫🇷 Français
            </option>

            <option value="de-DE">
                🇩🇪 Deutsch
            </option>

            <option value="es-ES">
                🇪🇸 Español
            </option>

            <option value="it-IT">
                🇮🇹 Italiano
            </option>

            <option value="pt-BR">
                🇧🇷 Português
            </option>

            <option value="ja-JP">
                🇯🇵 日本語
            </option>

            <option value="ko-KR">
                🇰🇷 한국어
            </option>

            <option value="zh-CN">
                🇨🇳 中文
            </option>

            <option value="ar-SA">
                🇸🇦 العربية
            </option>

            <option value="ru-RU">
                🇷🇺 Русский
            </option>

        </select>

        <button onclick="sendMessage()">
            ➤
        </button>

        <button
            id="micButton"
            onclick="startVoice()"
        >
            🎤
        </button>

    </div>

</div>

<script>

const BACKEND_URL =
https://ai-tool-pxi1.onrender.com/chat


function addMessage(text, type) {

    const chat =
        document.getElementById("chat");

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    message.textContent = text;

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;
}


async function sendMessage() {

    const input =
        document.getElementById("messageInput");

    const text =
        input.value.trim();

    if (text === "") {
        return;
    }

    addMessage(text, "user");

    input.value = "";

    addMessage("Thinking... 🤖", "ai");

    try {

        const response =
            await fetch(
                BACKEND_URL + "/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message: text
                    })
                }
            );

        if (!response.ok) {
            throw new Error(
                "Server error"
            );
        }

        const data =
            await response.json();

        const aiMessages =
            document.querySelectorAll(
                ".message.ai"
            );

        const lastAI =
            aiMessages[
                aiMessages.length - 1
            ];

        lastAI.textContent =
            data.reply ||
            "No response received.";

    } catch (error) {

        console.error(error);

        const aiMessages =
            document.querySelectorAll(
                ".message.ai"
            );

        const lastAI =
            aiMessages[
                aiMessages.length - 1
            ];

        lastAI.textContent =
            "Sorry, I couldn't connect to the server. 😔";
    }
}


function handleEnter(event) {

    if (event.key === "Enter") {
        sendMessage();
    }
}


function startVoice() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        alert(
            "Voice input is not supported in this browser."
        );

        return;
    }

    const recognition =
        new SpeechRecognition();

    const language =
        document.getElementById(
            "language"
        ).value;

    recognition.lang =
        language;

    recognition.continuous =
        false;

    recognition.interimResults =
        false;

    recognition.start();

    recognition.onstart =
        function() {

            document.getElementById(
                "micButton"
            ).textContent =
                "🎙️ Listening...";
        };


    recognition.onresult =
        function(event) {

            const text =
                event
                .results[0][0]
                .transcript;

            document.getElementById(
                "messageInput"
            ).value = text;

            sendMessage();
        };


    recognition.onerror =
        function(event) {

            console.error(
                "Voice error:",
                event.error
            );

            alert(
                "Could not hear you. Please try again."
            );
        };


    recognition.onend =
        function() {

            document.getElementById(
                "micButton"
            ).textContent =
                "🎤";
        };
}

</script>

</body>

</html>
