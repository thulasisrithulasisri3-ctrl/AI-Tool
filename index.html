<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Viggo AI</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background: #07111f;
            color: #eaf4ff;
        }

        button {
            font-family: inherit;
        }

        /* ==================================================
           APP
        ================================================== */

        .app {
            display: flex;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background:
                radial-gradient(
                    circle at 70% 20%,
                    rgba(0, 119, 255, .12),
                    transparent 35%
                ),
                #07111f;
        }

        /* ==================================================
           SIDEBAR
        ================================================== */

        #sidebar {
            width: 270px;
            height: 100%;
            flex-shrink: 0;

            display: flex;
            flex-direction: column;

            padding: 16px;

            background:
                linear-gradient(
                    180deg,
                    #050b14,
                    #0a1525
                );

            border-right: 1px solid #16304f;

            box-shadow:
                8px 0 30px rgba(0,0,0,.45);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;

            margin-bottom: 18px;
        }

        .brand-logo {
            width: 40px;
            height: 40px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #168cff,
                    #0754b8
                );

            color: white;

            font-size: 22px;
            font-weight: 900;

            box-shadow:
                0 0 18px rgba(0,140,255,.35);
        }

        .brand-name {
            font-size: 21px;
            font-weight: 800;
            color: white;
        }

        .brand-status {
            font-size: 11px;
            color: #4cc9ff;
            margin-top: 2px;
        }

        /* ==================================================
           NEW CHAT
        ================================================== */

        #newChat {
            width: 100%;

            border: 1px solid #1b4d7e;
            border-radius: 11px;

            padding: 12px;

            background:
                linear-gradient(
                    135deg,
                    #0d2946,
                    #0a1b30
                );

            color: #fff;

            text-align: left;

            cursor: pointer;

            transition: .2s;
        }

        #newChat:hover {
            border-color: #249cff;
            background: #0e2d4d;
        }

        /* ==================================================
           TITLES
        ================================================== */

        .side-title {
            margin-top: 20px;
            margin-bottom: 8px;

            padding-left: 6px;

            color: #6e8cab;

            font-size: 11px;
            font-weight: bold;

            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ==================================================
           CHAT LIST
        ================================================== */

        .chat-list {
            overflow-y: auto;
            max-height: 35vh;
        }

        .chat-row {
            display: flex;
            align-items: center;
            gap: 3px;

            margin-bottom: 4px;
        }

        .chat-item {
            flex: 1;

            min-width: 0;

            border: 1px solid transparent;
            border-radius: 9px;

            padding: 10px;

            background: transparent;

            color: #cbd9e8;

            cursor: pointer;

            text-align: left;

            transition: .2s;
        }

        .chat-item:hover,
        .chat-item.active {
            background: #0d2239;
            border-color: #164c7e;
            color: white;
        }

        .chat-item-title {
            display: block;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }

        .small-action {
            width: 31px;
            height: 31px;

            border: 0;
            border-radius: 7px;

            background: transparent;

            color: #7191b2;

            cursor: pointer;
        }

        .small-action:hover {
            background: #122b45;
            color: #fff;
        }

        .delete-action:hover {
            color: #ff6b6b;
        }

        .empty-sidebar {
            color: #526d88;
            font-size: 12px;
            padding: 8px;
        }

        /* ==================================================
           MORE
        ================================================== */

        .sidebar-bottom {
            margin-top: auto;
            position: relative;
        }

        #moreButton {
            width: 100%;

            border: 1px solid #173653;
            border-radius: 10px;

            padding: 11px;

            background: #0b1b2e;

            color: #dcecff;

            cursor: pointer;

            text-align: left;
        }

        #moreButton:hover {
            background: #102842;
        }

        #moreMenu {
            display: none;

            position: absolute;

            left: 0;
            right: 0;
            bottom: 52px;

            padding: 6px;

            border: 1px solid #1b4268;
            border-radius: 12px;

            background: #081727;

            box-shadow:
                0 15px 40px rgba(0,0,0,.55);

            z-index: 500;
        }

        #moreMenu.show {
            display: block;
        }

        .more-item {
            width: 100%;

            border: 0;
            border-radius: 8px;

            padding: 11px;

            background: transparent;

            color: #dcecff;

            cursor: pointer;

            text-align: left;
        }

        .more-item:hover {
            background: #10304e;
        }

        /* ==================================================
           MAIN
        ================================================== */

        .main {
            flex: 1;
            min-width: 0;

            display: flex;
            flex-direction: column;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(0,119,255,.08),
                    transparent 45%
                );
        }

        /* ==================================================
           TOPBAR
        ================================================== */

        .topbar {
            height: 62px;
            flex-shrink: 0;

            display: flex;
            align-items: center;

            padding: 0 18px;

            border-bottom: 1px solid #15314f;

            background: rgba(5,14,25,.85);

            backdrop-filter: blur(12px);
        }

        #mobileMenu {
            display: none;

            border: 0;
            border-radius: 8px;

            background: #10263d;
            color: white;

            padding: 8px 11px;

            cursor: pointer;
        }

        .top-title-area {
            display: flex;
            flex-direction: column;
        }

        #currentTitle {
            font-size: 16px;
            font-weight: bold;
        }

        .online-status {
            font-size: 11px;
            color: #4cc9ff;
            margin-top: 3px;
        }

        /* ==================================================
           CHAT AREA
        ================================================== */

        #chatArea {
            flex: 1;

            overflow-y: auto;

            padding: 25px 18px;
        }

        #conversation {
            max-width: 900px;
            margin: auto;
        }

        /* ==================================================
           WELCOME
        ================================================== */

        .welcome {
            min-height: 65vh;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
        }

        .welcome-b {
            width: 70px;
            height: 70px;

            margin: auto;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 20px;

            background:
                linear-gradient(
                    135deg,
                    #168cff,
                    #064eae
                );

            color: white;

            font-size: 38px;
            font-weight: 900;

            box-shadow:
                0 0 35px rgba(0,132,255,.35);
        }

        .welcome h1 {
            margin: 18px 0 8px;
            color: white;
        }

        .welcome p {
            color: #7892ac;
        }

        /* ==================================================
           MESSAGE
        ================================================== */

        .message {
            display: flex;
            gap: 12px;

            padding: 18px 8px;

            border-bottom: 1px solid #12283f;
        }

        .message.user {
            background: rgba(9,25,42,.45);
        }

        .message.ai {
            background: rgba(5,15,27,.25);
        }

        .avatar {
            width: 36px;
            height: 36px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #168cff,
                    #0754b8
                );

            color: white;

            font-weight: 900;
        }

        .message.user .avatar {
            background: #25384d;
        }

        .message-content {
            flex: 1;
            min-width: 0;
        }

        .message-name {
            margin-bottom: 6px;

            font-weight: bold;
            color: #fff;
        }

        .message-text {
            white-space: pre-wrap;

            line-height: 1.65;

            color: #d9e7f5;

            word-break: break-word;
        }

        /* ==================================================
           MESSAGE ACTIONS
        ================================================== */

        .message-actions {
            display: flex;
            flex-wrap: wrap;

            gap: 6px;

            margin-top: 11px;
        }

        .msg-btn {
            border: 1px solid #193b5d;
            border-radius: 7px;

            padding: 6px 9px;

            background: #0b1b2d;

            color: #8fb1d0;

            cursor: pointer;

            font-size: 12px;

            transition: .2s;
        }

        .msg-btn:hover {
            background: #123250;
            color: white;
            border-color: #247ec5;
        }

        .msg-btn.active {
            color: #4caaff;
            border-color: #268be2;
        }

        /* ==================================================
           VOICE UNDER CHAT
        ================================================== */

        .message-voice-control {
            margin-top: 9px;
        }

        .message-voice-btn {
            border: 1px solid #1b456b;
            border-radius: 8px;

            padding: 7px 11px;

            background: #0b1c30;

            color: #8fcaff;

            cursor: pointer;

            font-size: 12px;
        }

        .message-voice-btn:hover {
            background: #123655;
        }

        /* ==================================================
           INPUT AREA
        ================================================== */

        .input-area {
            flex-shrink: 0;

            padding: 10px 14px 14px;

            background: rgba(5,14,25,.94);

            border-top: 1px solid #15314f;
        }

        .input-box {
            max-width: 900px;
            margin: auto;

            display: flex;
            align-items: flex-end;
            gap: 7px;

            padding: 7px;

            border: 1px solid #1b456c;
            border-radius: 14px;

            background: #081827;

            box-shadow:
                0 0 25px rgba(0,0,0,.25);
        }

        #message {
            flex: 1;

            min-height: 40px;
            max-height: 150px;

            resize: none;

            border: 0;
            outline: none;

            padding: 10px;

            background: transparent;

            color: white;

            font-size: 15px;
        }

        #message::placeholder {
            color: #5d7893;
        }

        #mic,
        #send {
            width: 43px;
            height: 40px;

            flex-shrink: 0;

            border: 0;
            border-radius: 9px;

            cursor: pointer;
        }

        #mic {
            background: #102b45;
            color: white;
            font-size: 17px;
        }

        #mic.listening {
            background: #6c2630;
        }

        #send {
            background:
                linear-gradient(
                    135deg,
                    #168cff,
                    #0754b8
                );

            color: white;

            font-size: 17px;
        }

        #send:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        /* ==================================================
           CHAT VOICE BAR
        ================================================== */

        .chat-voice-bar {
            max-width: 900px;
            margin: 7px auto 0;

            display: flex;
            justify-content: flex-end;
        }

        #globalVoiceToggle {
            border: 1px solid #1a466e;
            border-radius: 8px;

            padding: 7px 12px;

            background: #0a1d31;

            color: #8fcaff;

            cursor: pointer;

            font-size: 12px;
        }

        #globalVoiceToggle:hover {
            background: #123656;
        }

        /* ==================================================
           HISTORY MODAL
        ================================================== */

        #historyModal {
            display: none;

            position: fixed;

            inset: 0;

            padding: 25px;

            background: rgba(0,0,0,.72);

            z-index: 5000;
        }

        .history-window {
            width: 100%;
            max-width: 800px;

            max-height: 88vh;

            overflow-y: auto;

            margin: auto;

            padding: 18px;

            border: 1px solid #1d4d78;
            border-radius: 15px;

            background:
                linear-gradient(
                    180deg,
                    #0b1b2c,
                    #071321
                );

            box-shadow:
                0 20px 70px rgba(0,0,0,.65);
        }

        .history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 15px;
        }

        .history-header h2 {
            margin: 0;
        }

        #closeHistory {
            border: 0;
            border-radius: 8px;

            padding: 8px 12px;

            background: #142b42;

            color: white;

            cursor: pointer;
        }

        .history-card {
            padding: 13px;

            margin-bottom: 10px;

            border: 1px solid #1a3c5c;
            border-radius: 11px;

            background: #091a2b;
        }

        .history-card.pinned {
            border-left: 4px solid #168cff;
        }

        .history-card-title {
            color: white;
            font-weight: bold;
        }

        .history-card-time {
            margin-top: 5px;
            margin-bottom: 10px;

            color: #66819c;

            font-size: 11px;
        }

        .history-card-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .history-card-actions button {
            border: 1px solid #214766;
            border-radius: 7px;

            padding: 7px 10px;

            background: #10273d;

            color: #cde5fa;

            cursor: pointer;
        }

        .history-card-actions button:hover {
            background: #153957;
        }

        .history-delete {
            color: #ff8888 !important;
        }

        /* ==================================================
           TOAST
        ================================================== */

        #viggoToast {
            display: none;

            position: fixed;

            left: 50%;
            bottom: 25px;

            transform: translateX(-50%);

            padding: 9px 16px;

            border: 1px solid #246da9;
            border-radius: 9px;

            background: #071a2c;

            color: #dff1ff;

            box-shadow:
                0 8px 30px rgba(0,0,0,.5);

            z-index: 99999;

            font-size: 13px;
        }

        /* ==================================================
           MOBILE
        ================================================== */

        @media (max-width: 700px) {

            #sidebar {
                position: fixed;

                left: -285px;
                top: 0;
                bottom: 0;

                z-index: 6000;

                transition: left .2s;
            }

            #sidebar.open {
                left: 0;
            }

            #mobileMenu {
                display: block;
            }

            .topbar {
                padding: 0 10px;
                gap: 10px;
            }

            #chatArea {
                padding: 10px;
            }

            .message {
                padding: 14px 3px;
            }

            .input-area {
                padding: 8px;
            }

            #historyModal {
                padding: 10px;
            }

            .history-window {
                max-height: 95vh;
            }

        }

    </style>
</head>


<body>

<div class="app">

    <!-- ==================================================
         SIDEBAR
    ================================================== -->

    <aside id="sidebar">

        <div class="brand">

            <div class="brand-logo">
                B
            </div>

            <div>
                <div class="brand-name">
                    Viggo
                </div>

                <div class="brand-status">
                    ● AI Online
                </div>
            </div>

        </div>


        <button id="newChat">
            ＋ New Chat
        </button>


        <div class="side-title">
            Pinned
        </div>

        <div id="pinnedList"
             class="chat-list">
        </div>


        <div class="side-title">
            Recent
        </div>

        <div id="recentList"
             class="chat-list">
        </div>


        <!-- MORE -->

        <div class="sidebar-bottom">

            <button id="moreButton">
                ⋮ &nbsp; More
            </button>


            <div id="moreMenu">

                <button
                    class="more-item"
                    id="saveButton"
                >
                    💾 Save Chat
                </button>

                <button
                    class="more-item"
                    id="historyButton"
                >
                    🕘 History
                </button>

                <button
                    class="more-item"
                    id="shareChat"
                >
                    🔗 Share Chat
                </button>

                <button
                    class="more-item"
                    id="clearHistory"
                >
                    🗑️ Clear History
                </button>

            </div>

        </div>

    </aside>


    <!-- ==================================================
         MAIN
    ================================================== -->

    <main class="main">


        <!-- TOPBAR -->

        <header class="topbar">

            <button id="mobileMenu">
                ☰
            </button>


            <div class="top-title-area">

                <div id="currentTitle">
                    New Chat
                </div>

                <div class="online-status">
                    ● Viggo Online
                </div>

            </div>

        </header>


        <!-- CHAT -->

        <section id="chatArea">

            <div id="conversation">

                <div class="welcome">

                    <div>

                        <div class="welcome-b">
                            B
                        </div>

                        <h1>
                            Welcome to Viggo
                        </h1>

                        <p>
                            Your AI assistant is ready.
                        </p>

                    </div>

                </div>

            </div>

        </section>


        <!-- INPUT -->

        <footer class="input-area">

            <div class="input-box">

                <textarea
                    id="message"
                    placeholder="Message Viggo..."
                    rows="1"
                ></textarea>


                <button
                    id="mic"
                    title="Voice input"
                >
                    🎤
                </button>


                <button
                    id="send"
                    title="Send"
                >
                    ➤
                </button>

            </div>


            <!-- VOICE BELOW CHAT -->

            <div class="chat-voice-bar">

                <button id="globalVoiceToggle">
                    🔊 Voice ON
                </button>

            </div>

        </footer>

    </main>

</div>


<!-- ======================================================
     HISTORY MODAL
====================================================== -->

<div id="historyModal">

    <div class="history-window">

        <div class="history-header">

            <h2>
                Chat History
            </h2>

            <button id="closeHistory">
                ✕
            </button>

        </div>

        <div id="historyList"></div>

    </div>

</div>


<!-- TOAST -->

<div id="viggoToast"></div>


<script src="script.js"></script>

</body>
</html>
