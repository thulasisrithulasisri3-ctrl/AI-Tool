<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viggo AI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#07101a;
    color:white;
    height:100vh;
    overflow:hidden;
}

.app{
    display:flex;
    height:100vh;
}

/* SIDEBAR */

.sidebar{
    width:260px;
    min-width:260px;
    background:#050b12;
    border-right:1px solid #20364a;
    padding:18px;
    display:flex;
    flex-direction:column;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo-icon{
    width:42px;
    height:42px;
    border-radius:12px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#2999ff,#07569d);
    font-weight:bold;
    font-size:22px;
}

.logo-name{
    font-size:21px;
}

.online{
    margin-left:52px;
    margin-top:5px;
    color:#45df88;
    font-size:11px;
}

.online-dot{
    display:inline-block;
    width:6px;
    height:6px;
    border-radius:50%;
    background:#45df88;
}

.new-chat{
    margin-top:25px;
    padding:11px;
    border-radius:10px;
    border:1px solid #176bad;
    background:#0b4f82;
    color:white;
    cursor:pointer;
    text-align:left;
}

.section-title{
    margin-top:22px;
    margin-bottom:7px;
    color:#6c87a0;
    font-size:11px;
}

.chat-list{
    display:flex;
    flex-direction:column;
    gap:4px;
    overflow:auto;
}

.chat-item{
    border:0;
    background:transparent;
    color:#d7e6f5;
    padding:9px;
    border-radius:8px;
    cursor:pointer;
    text-align:left;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.chat-item:hover{
    background:#10283c;
}

.empty{
    color:#50677d;
    font-size:12px;
    padding:8px;
}

/* MORE */

.more-area{
    margin-top:auto;
    position:relative;
}

.more-button{
    width:100%;
    padding:11px;
    border-radius:10px;
    border:1px solid #294760;
    background:#0b1724;
    color:white;
    cursor:pointer;
    text-align:left;
}

.more-menu{
    display:none;
    position:absolute;
    bottom:52px;
    left:0;
    right:0;
    background:#091522;
    border:1px solid #294b67;
    border-radius:12px;
    padding:7px;
    z-index:1000;
}

.more-menu.show{
    display:block;
}

.more-menu button{
    width:100%;
    padding:10px;
    border:0;
    border-radius:8px;
    background:transparent;
    color:white;
    cursor:pointer;
    text-align:left;
}

.more-menu button:hover{
    background:#12314a;
}

/* MAIN */

.main{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
}

.header{
    height:60px;
    display:flex;
    align-items:center;
    padding:0 20px;
    border-bottom:1px solid #1d3449;
    background:#050b12;
}

.header-title{
    font-size:14px;
}

.share{
    margin-left:auto;
    padding:8px 14px;
    border-radius:8px;
    border:1px solid #226da8;
    background:#0b3152;
    color:white;
    cursor:pointer;
}

.chat-area{
    flex:1;
    overflow-y:auto;
    padding:25px 18px;
}

.conversation{
    width:100%;
    max-width:850px;
    margin:auto;
}

.welcome{
    text-align:center;
    padding-top:80px;
}

.welcome-icon{
    width:70px;
    height:70px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:18px;
    background:linear-gradient(135deg,#2999ff,#07569d);
    font-size:34px;
    font-weight:bold;
}

.welcome h1{
    margin-top:15px;
}

.welcome p{
    color:#718ba5;
    margin-top:7px;
}

/* MESSAGE */

.message{
    display:flex;
    gap:11px;
    margin-bottom:22px;
}

.avatar{
    width:36px;
    height:36px;
    min-width:36px;
    border-radius:10px;
    background:#0b68ad;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.user-avatar{
    background:#293d52;
}

.message-content{
    min-width:0;
}

.message-name{
    color:#76a4cd;
    font-size:11px;
    margin-bottom:5px;
}

.message-text{
    color:#e7f1fa;
    font-size:14px;
    line-height:1.65;
    white-space:pre-wrap;
    word-break:break-word;
}

.message-actions{
    display:flex;
    gap:6px;
    margin-top:8px;
}

.message-actions button{
    border:1px solid #29465d;
    background:#0b1723;
    color:#9db7cd;
    border-radius:7px;
    padding:5px 8px;
    cursor:pointer;
    font-size:11px;
}

/* INPUT */

.input-area{
    padding:12px 20px 18px;
    background:#060c14;
    border-top:1px solid #1b3043;
}

.input-box{
    max-width:850px;
    margin:auto;
    display:flex;
    align-items:center;
    gap:8px;
    padding:7px 8px 7px 14px;
    border:1px solid #294052;
    background:#151b24;
    border-radius:22px;
}

.input{
    flex:1;
    min-width:0;
    background:transparent;
    border:0;
    outline:0;
    color:white;
    font-size:14px;
}

.mic,
.send{
    width:38px;
    height:38px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
}

.mic{
    border:1px solid #31536f;
    background:#10283e;
    color:white;
}

.send{
    border:0;
    background:#0873c5;
    color:white;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    z-index:5000;
    padding:25px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:700px;
    max-height:85vh;
    overflow:auto;
    margin:auto;
    background:#091522;
    border:1px solid #294b67;
    border-radius:15px;
    padding:20px;
}

.modal-head{
    display:flex;
    justify-content:space-between;
    margin-bottom:15px;
}

.close{
    background:none;
    border:0;
    color:white;
    font-size:24px;
    cursor:pointer;
}

.history-item{
    background:#0d1d2b;
    border:1px solid #223e54;
    border-radius:10px;
    padding:12px;
    margin-bottom:8px;
}

.history-top{
    display:flex;
    gap:10px;
    align-items:center;
}

.history-info{
    flex:1;
    cursor:pointer;
}

.history-time{
    color:#637d94;
    font-size:10px;
    margin-top:4px;
}

.delete-history{
    margin-top:8px;
    border:1px solid #63313a;
    background:#28151a;
    color:#ff7e89;
    padding:6px 10px;
    border-radius:7px;
    cursor:pointer;
}

.history-controls{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.history-controls button{
    flex:1;
    padding:10px;
    border-radius:8px;
    border:1px solid #294760;
    background:#0d1d2b;
    color:white;
    cursor:pointer;
}

/* SHARED */

.shared-mode .sidebar,
.shared-mode .input-area,
.shared-mode .share{
    display:none;
}

.shared-mode .main{
    width:100%;
}

.shared-banner{
    display:none;
    text-align:center;
    padding:10px;
    background:#0c2940;
    color:#a9d8ff;
    font-size:12px;
}

.shared-mode .shared-banner{
    display:block;
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

    <div class="logo">
        <div class="logo-icon">B</div>
        <div class="logo-name">Viggo</div>
    </div>

    <div class="online">
        <span class="online-dot"></span>
        Online
    </div>

    <button class="new-chat" id="newChat">
        ＋ New Chat
    </button>

    <div class="section-title">
        Pinned
    </div>

    <div class="chat-list" id="pinnedList"></div>

    <div class="section-title">
        Recent
    </div>

    <div class="chat-list" id="recentList"></div>

    <div class="more-area">

        <button class="more-button" id="moreButton">
            ⋮ More
        </button>

        <div class="more-menu" id="moreMenu">

            <button id="saveButton">
                💾 Save
            </button>

            <button id="historyButton">
                🕘 History
            </button>

            <button id="pinButton">
                📌 Pin Chat
            </button>

            <button id="voiceButton">
                🔊 Voice ON
            </button>

            <button id="femaleButton">
                🎙 Female Voice
            </button>

            <button id="maleButton">
                🎙 Male Voice
            </button>

            <button id="clearButton">
                🗑 Clear History
            </button>

        </div>
    </div>

</aside>


<main class="main">

    <header class="header">

        <div class="header-title" id="headerTitle">
            New Chat
        </div>

        <button class="share" id="shareButton">
            ↗ Share
        </button>

    </header>

    <div class="shared-banner">
        👁 Shared Viggo conversation — Read only
    </div>

    <section class="chat-area" id="chatArea">

        <div class="conversation" id="conversation">

            <div class="welcome" id="welcome">

                <div class="welcome-icon">
                    B
                </div>

                <h1>Viggo</h1>

                <p>Your AI friend is ready.</p>

            </div>

        </div>

    </section>


    <div class="input-area">

        <div class="input-box">

            <input
                id="messageInput"
                class="input"
                placeholder="Message Viggo..."
            >

            <button
                class="mic"
                id="micButton">
                🎤
            </button>

            <button
                class="send"
                id="sendButton">
                ➤
            </button>

        </div>

    </div>

</main>

</div>


<!-- HISTORY -->

<div class="modal" id="historyModal">

    <div class="modal-box">

        <div class="modal-head">

            <h3>🕘 Chat History</h3>

            <button class="close" id="closeHistory">
                ×
            </button>

        </div>

        <div id="historyList"></div>

    </div>

</div>


<script>

/* =====================================================
   IMPORTANT: PUT YOUR REAL VIGGO SERVER URL HERE
===================================================== */

const API_URL = "YOUR_VIGGO_SERVER_URL/chat";


/* =====================================================
   ELEMENTS
===================================================== */

const input =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");

const conversation =
    document.getElementById("conversation");

const moreButton =
    document.getElementById("moreButton");

const moreMenu =
    document.getElementById("moreMenu");

const saveButton =
    document.getElementById("saveButton");

const recentList =
    document.getElementById("recentList");

const pinnedList =
    document.getElementById("pinnedList");

const historyModal =
    document.getElementById("historyModal");

const historyList =
    document.getElementById("historyList");

const headerTitle =
    document.getElementById("headerTitle");

const shareButton =
    document.getElementById("shareButton");


/* =====================================================
   STATE
===================================================== */

let chats =
    JSON.parse(
        localStorage.getItem("viggoChats") || "[]"
    );

let currentMessages = [];

let currentChatId = null;

let voiceEnabled = true;

let selectedVoice = "female";

let sharedMode = false;


/* =====================================================
   STORAGE
===================================================== */

function saveStorage(){

    localStorage.setItem(
        "viggoChats",
        JSON.stringify(chats)
    );

}


/* =====================================================
   MORE MENU
===================================================== */

moreButton.onclick = function(e){

    e.stopPropagation();

    moreMenu.classList.toggle("show");

};

moreMenu.onclick = function(e){

    e.stopPropagation();

};

document.onclick = function(){

    moreMenu.classList.remove("show");

};


/* =====================================================
   ADD MESSAGE
===================================================== */

function addMessage(text, sender, store=true){

    const welcome =
        document.getElementById("welcome");

    if(welcome){

        welcome.remove();

    }


    const message =
        document.createElement("div");

    message.className = "message";


    const avatar =
        document.createElement("div");

    avatar.className =
        sender === "user"
            ? "avatar user-avatar"
            : "avatar";

    avatar.textContent =
        sender === "user"
            ? "U"
            : "B";


    const content =
        document.createElement("div");

    content.className =
        "message-content";


    const name =
        document.createElement("div");

    name.className =
        "message-name";

    name.textContent =
        sender === "user"
            ? "You"
            : "Viggo";


    const textElement =
        document.createElement("div");

    textElement.className =
        "message-text";

    textElement.textContent =
        text;


    content.appendChild(name);

    content.appendChild(textElement);


    if(sender === "assistant"){

        const actions =
            document.createElement("div");

        actions.className =
            "message-actions";


        const copy =
            document.createElement("button");

        copy.textContent = "📋 Copy";

        copy.onclick = async function(){

            await navigator.clipboard.writeText(text);

            copy.textContent = "✓ Copied";

            setTimeout(
                ()=>copy.textContent="📋 Copy",
                1200
            );

        };


        const speaker =
            document.createElement("button");

        speaker.textContent = "🔊 Speaker";

        speaker.onclick = function(){

            speak(text);

        };


        const like =
            document.createElement("button");

        like.textContent = "👍 Like";

        like.onclick = function(){

            like.textContent = "❤️ Liked";

        };


        actions.appendChild(copy);

        actions.appendChild(speaker);

        actions.appendChild(like);

        content.appendChild(actions);

    }


    message.appendChild(avatar);

    message.appendChild(content);

    conversation.appendChild(message);


    if(store){

        currentMessages.push({

            sender:sender,

            text:String(text)

        });

    }


    document.getElementById("chatArea").scrollTop =
        document.getElementById("chatArea").scrollHeight;

}


/* =====================================================
   REAL VIGGO SERVER REQUEST
===================================================== */

async function getViggoReply(message){

    if(
        !API_URL ||
        API_URL.includes("YOUR_VIGGO_SERVER_URL")
    ){

        throw new Error(
            "Viggo server URL is not configured."
        );

    }


    const response =
        await fetch(
            API_URL,
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:JSON.stringify({

                    message:message,

                    history:currentMessages

                })

            }
        );


    if(!response.ok){

        throw new Error(
            "Server error: " +
            response.status
        );

    }


    const data =
        await response.json();


    /*
       Supports common response names:
       reply / response / message / answer
    */

    return (
        data.reply ||
        data.response ||
        data.message ||
        data.answer ||
        "Viggo did not return a response."
    );

}


/* =====================================================
   SEND
===================================================== */

async function sendMessage(){

    if(sharedMode){

        return;

    }


    const text =
        input.value.trim();


    if(!text){

        return;

    }


    addMessage(
        text,
        "user",
        true
    );


    input.value = "";


    const loading =
        document.createElement("div");

    loading.className = "message";

    loading.innerHTML = `
        <div class="avatar">B</div>
        <div class="message-content">
            <div class="message-name">Viggo</div>
            <div class="message-text">
                Thinking...
            </div>
        </div>
    `;

    conversation.appendChild(loading);


    try{

        const reply =
            await getViggoReply(text);


        loading.remove();


        addMessage(
            reply,
            "assistant",
            true
        );


        if(voiceEnabled){

            speak(reply);

        }

    }
    catch(error){

        loading.remove();


        addMessage(
            "Sorry friend, I couldn't connect to Viggo AI right now.",
            "assistant",
            true
        );


        console.error(error);

    }

}


/* =====================================================
   SEND EVENTS
===================================================== */

sendButton.onclick =
    sendMessage;


input.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Enter"){

            e.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
   SAVE FULL CHAT
===================================================== */

saveButton.onclick = function(e){

    e.preventDefault();

    e.stopPropagation();


    if(currentMessages.length === 0){

        alert(
            "First send a message."
        );

        return;

    }


    const firstUser =
        currentMessages.find(
            m => m.sender === "user"
        );


    const title =
        firstUser
            ? firstUser.text.substring(0,40)
            : "Viggo Chat";


    /*
       UPDATE EXISTING CHAT
    */

    if(currentChatId){

        const existing =
            chats.find(
                c =>
                String(c.id) ===
                String(currentChatId)
            );


        if(existing){

            existing.messages =
                JSON.parse(
                    JSON.stringify(
                        currentMessages
                    )
                );

            existing.title =
                title;

            existing.time =
                new Date().toLocaleString();


            saveStorage();

            renderRecent();

            renderPinned();

            saveButton.textContent =
                "✓ Saved";

            setTimeout(
                ()=>{
                    saveButton.textContent =
                        "💾 Save";
                },
                1500
            );

            return;

        }

    }


    /*
       CREATE NEW CHAT
    */

    const newChat = {

        id:
            Date.now().toString(),

        title:title,

        messages:
            JSON.parse(
                JSON.stringify(
                    currentMessages
                )
            ),

        time:
            new Date().toLocaleString(),

        pinned:false

    };


    chats.push(newChat);

    currentChatId =
        newChat.id;


    saveStorage();

    renderRecent();

    renderPinned();


    saveButton.textContent =
        "✓ Saved";


    setTimeout(
        ()=>{
            saveButton.textContent =
                "💾 Save";
        },
        1500
    );

};


/* =====================================================
   LOAD CHAT
===================================================== */

function loadChat(id){

    const chat =
        chats.find(
            c =>
            String(c.id) ===
            String(id)
        );


    if(!chat){

        return;

    }


    currentChatId =
        chat.id;


    currentMessages =
        JSON.parse(
            JSON.stringify(
                chat.messages || []
            )
        );


    conversation.innerHTML = "";


    currentMessages.forEach(
        m => {

            addMessage(
                m.text,
                m.sender,
                false
            );

        }
    );


    headerTitle.textContent =
        chat.title ||
        "Saved Chat";


    moreMenu.classList.remove("show");

}


/* =====================================================
   RECENT
===================================================== */

function renderRecent(){

    recentList.innerHTML = "";


    if(chats.length === 0){

        recentList.innerHTML =
            `<div class="empty">
                No recent chats
             </div>`;

        return;

    }


    chats
    .slice()
    .reverse()
    .slice(0,10)
    .forEach(chat=>{

        const button =
            document.createElement("button");

        button.className =
            "chat-item";

        button.textContent =
            "💬 " +
            (chat.title || "Viggo Chat");

        button.onclick =
            ()=>loadChat(chat.id);

        recentList.appendChild(button);

    });

}


/* =====================================================
   PINNED
===================================================== */

function renderPinned(){

    pinnedList.innerHTML = "";


    const pinned =
        chats.filter(
            chat => chat.pinned
        );


    if(pinned.length === 0){

        pinnedList.innerHTML =
            `<div class="empty">
                No pinned chats
             </div>`;

        return;

    }


    pinned.forEach(chat=>{

        const button =
            document.createElement("button");

        button.className =
            "chat-item";

        button.textContent =
            "📌 " +
            (chat.title || "Pinned");

        button.onclick =
            ()=>loadChat(chat.id);

        pinnedList.appendChild(button);

    });

}


/* =====================================================
   NEW CHAT
===================================================== */

document
.getElementById("newChat")
.onclick = function(){

    currentMessages = [];

    currentChatId = null;

    conversation.innerHTML = `

        <div class="welcome" id="welcome">

            <div class="welcome-icon">
                B
            </div>

            <h1>Viggo</h1>

            <p>
                Your AI friend is ready.
            </p>

        </div>

    `;

    headerTitle.textContent =
        "New Chat";

    input.value = "";

};


/* =====================================================
   HISTORY
===================================================== */

function openHistory(){

    historyList.innerHTML = "";


    if(chats.length === 0){

        historyList.innerHTML =
            `<div class="empty">
                No chat history
             </div>`;

    }


    chats
    .slice()
    .reverse()
    .forEach(chat=>{

        const item =
            document.createElement("div");

        item.className =
            "history-item";


        item.innerHTML = `

            <div class="history-top">

                <div class="history-info">

                    <strong>
                        💬 ${
                            chat.title ||
                            "Viggo Chat"
                        }
                    </strong>

                    <div class="history-time">
                        ${
                            chat.time || ""
                        }
                    </div>

                </div>

            </div>

            <button class="delete-history">
                🗑 Delete
            </button>

        `;


        item
        .querySelector(".history-info")
        .onclick =
            ()=>{
                loadChat(chat.id);

                historyModal
                    .classList
                    .remove("show");
            };


        item
        .querySelector(".delete-history")
        .onclick =
            ()=>{

                chats =
                    chats.filter(
                        c =>
                        String(c.id) !==
                        String(chat.id)
                    );


                if(
                    String(currentChatId) ===
                    String(chat.id)
                ){

                    currentChatId = null;

                    currentMessages = [];

                }


                saveStorage();

                renderRecent();

                renderPinned();

                openHistory();

            };


        historyList.appendChild(item);

    });

}


/* =====================================================
   HISTORY BUTTON
===================================================== */

document
.getElementById("historyButton")
.onclick = function(){

    openHistory();

    historyModal
        .classList
        .add("show");

    moreMenu
        .classList
        .remove("show");

};


/* =====================================================
   CLOSE HISTORY
===================================================== */

document
.getElementById("closeHistory")
.onclick = function(){

    historyModal
        .classList
        .remove("show");

};


/* =====================================================
   PIN
===================================================== */

document
.getElementById("pinButton")
.onclick = function(){

    if(!currentChatId){

        alert(
            "Save this chat first."
        );

        return;

    }


    const chat =
        chats.find(
            c =>
            String(c.id) ===
            String(currentChatId)
        );


    if(chat){

        chat.pinned =
            !chat.pinned;

        saveStorage();

        renderPinned();

    }

};


/* =====================================================
   CLEAR
===================================================== */

document
.getElementById("clearButton")
.onclick = function(){

    if(
        !confirm(
            "Delete all saved history?"
        )
    ){

        return;

    }


    chats = [];

    saveStorage();

    renderRecent();

    renderPinned();

};


/* =====================================================
   VOICE
===================================================== */

document
.getElementById("voiceButton")
.onclick = function(){

    voiceEnabled =
        !voiceEnabled;

    this.textContent =
        voiceEnabled
            ? "🔊 Voice ON"
            : "🔇 Voice OFF";

};


/* =====================================================
   VOICE SELECTION
===================================================== */

document
.getElementById("femaleButton")
.onclick = function(){

    selectedVoice =
        "female";

    voiceEnabled =
        true;

    speak(
        "Okay friend, female voice selected."
    );

};


document
.getElementById("maleButton")
.onclick = function(){

    selectedVoice =
        "male";

    voiceEnabled =
        true;

    speak(
        "Okay friend, male voice selected."
    );

};


/* =====================================================
   TEXT TO SPEECH
===================================================== */

function speak(text){

    if(!voiceEnabled){

        return;

    }


    if(!window.speechSynthesis){

        return;

    }


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    const voices =
        speechSynthesis.getVoices();


    if(selectedVoice === "female"){

        const female =
            voices.find(
                v =>
                /female|zira|samantha|karen|susan/i
                .test(v.name)
            );

        if(female){

            utterance.voice =
                female;

        }

    }
    else{

        const male =
            voices.find(
                v =>
                /male|david|alex|daniel/i
                .test(v.name)
            );

        if(male){

            utterance.voice =
                male;

        }

    }


    speechSynthesis.speak(
        utterance
    );

}


/* =====================================================
   MICROPHONE
===================================================== */

const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition = null;


if(Recognition){

    recognition =
        new Recognition();

    recognition.lang =
        "en-IN";

    recognition.interimResults =
        false;

    recognition.onresult =
        function(event){

            input.value =
                event.results[0][0].transcript;

        };

}


micButton.onclick =
    function(){

        if(!recognition){

            alert(
                "Voice input is not supported."
            );

            return;

        }


        recognition.start();

    };


/* =====================================================
   SHARE
===================================================== */

shareButton.onclick =
    async function(){

        if(!currentChatId){

            alert(
                "Save the chat first, then share it."
            );

            return;

        }


        const url =
            window.location.origin +
            window.location.pathname +
            "?shared=" +
            encodeURIComponent(
                currentChatId
            );


        try{

            if(navigator.share){

                await navigator.share({

                    title:
                        "Viggo AI Chat",

                    text:
                        "View my Viggo AI conversation",

                    url:url

                });

            }
            else{

                await navigator.clipboard
                    .writeText(url);

                shareButton.textContent =
                    "✓ Link Copied";

                setTimeout(
                    ()=>{
                        shareButton.textContent =
                            "↗ Share";
                    },
                    1500
                );

            }

        }
        catch(error){

            console.log(
                "Share cancelled"
            );

        }

    };


/* =====================================================
   SHARED CHAT
===================================================== */

function loadSharedChat(){

    const params =
        new URLSearchParams(
            window.location.search
        );


    const sharedId =
        params.get("shared");


    if(!sharedId){

        return;

    }


    const chat =
        chats.find(
            c =>
            String(c.id) ===
            String(sharedId)
        );


    if(!chat){

        alert(
            "This shared chat is not available on this device."
        );

        return;

    }


    sharedMode = true;

    document.body.classList.add(
        "shared-mode"
    );


    currentMessages =
        JSON.parse(
            JSON.stringify(
                chat.messages || []
            )
        );


    conversation.innerHTML = "";


    currentMessages.forEach(
        m => {

            addMessage(
                m.text,
                m.sender,
                false
            );

        }
    );


    headerTitle.textContent =
        chat.title ||
        "Shared Viggo Chat";

}


/* =====================================================
   START
===================================================== */

renderRecent();

renderPinned();

loadSharedChat();

</script>
