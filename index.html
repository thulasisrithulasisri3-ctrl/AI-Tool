<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Assistant</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #111827, #312e81);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app {
            width: 100%;
            max-width: 650px;
            height: 700px;
            background: white;
            border-radius: 24px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0,0,0,.35);
        }

        .header {
            background: #4f46e5;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 25px;
        }

        .header p {
            margin-top: 6px;
        }

        #chat {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8fafc;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            margin-bottom: 12px;
            border-radius: 16px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .ai {
            background: #e5e7eb;
            color: #111827;
        }

        .user {
            background: #4f46e5;
            color: white;
            margin-left: auto;
        }

        .bottom {
            padding: 15px;
            display: flex;
            gap: 8px;
            border-top: 1px solid #ddd;
            background: white;
        }

        #messageInput {
            flex: 1;
            min-width: 0;
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 15px;
            outline: none;
            font-size: 16px;
        }

        #messageInput:focus {
            border-color: #4f46e5;
        }

        #language {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 15px;
            background: white;
        }

        button {
            border: none;
            border-radius: 15px;
            padding: 12px 16px;
            cursor: pointer;
            font-size: 18px;
            color: white;
            background: #4f46e5;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        #micButton {
            background: #ef4444;
        }

        @media (max-width: 600px) {
            .app {
                height: 90vh;
            }

            .bottom {
                flex-wrap: wrap;
            }

            #messageInput {
                width: 100%;
                flex-basis: 100%;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <div class="header">
        <h1>🤖 AI Voice Assistant</h1>
        <p>Speak or type in your language 🌍</p>
    </div>

    <div id="chat">
        <div class="message ai">
            Hello! 👋 I'm your AI assistant.
        </div>
    </div>

    <div class="bottom">

        <input
            id="messageInput"
            type="text"
            placeholder="Type your message..."
            autocomplete="off"
        >

        <select id="language">
            <option value="en-IN">🇬🇧 English</option>
            <option value="ta-IN">🇮🇳 தமிழ்</option>
            <option value="hi-IN">🇮🇳 हिन्दी</option>
            <option value="te-IN">🇮🇳 తెలుగు</option>
            <option value="ml-IN">🇮🇳 മലയാളം</option>
            <option value="kn-IN">🇮🇳 ಕನ್ನಡ</option>
            <option value="bn-IN">🇮🇳 বাংলা</option>
            <option value="mr-IN">🇮🇳 मराठी</option>
            <option value="gu-IN">🇮🇳 ગુજરાતી</option>
            <option value="pa-IN">🇮🇳 ਪੰਜਾਬੀ</option>
            <option value="fr-FR">🇫🇷 Français</option>
            <option value="de-DE">🇩🇪 Deutsch</option>
            <option value="es-ES">🇪🇸 Español</option>
            <option value="it-IT">🇮🇹 Italiano</option>
            <option value="pt-BR">🇧🇷 Português</option>
            <option value="ja-JP">🇯🇵 日本語</option>
            <option value="ko-KR">🇰🇷 한국어</option>
            <option value="zh-CN">🇨🇳 中文</option>
            <option value="ar-SA">🇸🇦 العربية</option>
            <option value="ru-RU">🇷🇺 Русский</option>
        </select>

        <button id="sendButton" type="button">➤</button>
        <button id="micButton" type="button">🎤</button>

    </div>
</div>

<script>

const BACKEND_URL =
    "https://ai-tool-1-fgmc.onrender.com/chat";


const input =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");

const language =
    document.getElementById("language");

const chat =
    document.getElementById("chat");


function addMessage(text, type) {

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    message.textContent =
        text;

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;

    return message;
}


async function sendMessage() {

    const text =
        input.value.trim();

    if (!text) {
        return;
    }

    addMessage(text, "user");

    input.value = "";

    sendButton.disabled = true;

    const aiMessage =
        addMessage(
            "Thinking... 🤖",
            "ai"
        );

    try {

        const response =
            await fetch(
                BACKEND_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message: text
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(
                data.error ||
                "Server error"
            );
        }

        aiMessage.textContent =
            data.reply ||
            "No response received.";

    } catch (error) {

        console.error(error);

        aiMessage.textContent =
            "❌ Connection error: " +
            error.message;

    } finally {

        sendButton.disabled = false;
        input.focus();
    }
}


sendButton.addEventListener(
    "click",
    sendMessage
);


input.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            sendMessage();
        }
    }
);


micButton.addEventListener(
    "click",
    startVoice
);


function startVoice() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        alert(
            "Voice input is not supported in this browser."
        );

        return;
    }

    const recognition =
        new SpeechRecognition();

    recognition.lang =
        language.value;

    recognition.continuous =
        false;

    recognition.interimResults =
        false;


    recognition.onstart =
        function() {

            micButton.textContent =
                "🎙️";

            micButton.disabled =
                true;
        };


    recognition.onresult =
        function(event) {

            const text =
                event.results[0][0]
                    .transcript;

            input.value =
                text;

            sendMessage();
        };


    recognition.onerror =
        function(event) {

            console.error(
                "Voice error:",
                event.error
            );

            alert(
                "Voice input failed. Please try again."
            );
        };


    recognition.onend =
        function() {

            micButton.textContent =
                "🎤";

            micButton.disabled =
                false;
        };


    recognition.start();
}

</script>

</body>
</html>
