<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#050b16"
    >

    <meta
        name="description"
        content="Viggo AI - Your AI Friend"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <title>Viggo AI</title>


    <!-- =========================
         PWA
    ========================== -->

    <link
        rel="manifest"
        href="./manifest.json"
    >

    <link
        rel="icon"
        type="image/png"
        sizes="192x192"
        href="./icon-192.png"
    >

    <link
        rel="apple-touch-icon"
        href="./icon-192.png"
    >


    <!-- =========================
         CSS
    ========================== -->

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>


    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside
        class="sidebar"
        id="sidebar"
    >


        <!-- LOGO -->

        <div class="logo">

            <div class="logo-icon">
                V
            </div>

            <div class="logo-text">

                <strong>
                    Viggo
                </strong>

                <small>
                    AI Friend
                </small>

            </div>

        </div>


        <!-- NEW CHAT -->

        <button
            class="new-chat"
            id="newChatBtn"
            type="button"
        >
            ＋ New Chat
        </button>


        <!-- HISTORY -->

        <div
            class="history"
            id="historyList"
        ></div>


        <!-- MORE -->

        <div class="sidebar-more">

            <button
                class="more-button"
                id="moreBtn"
                type="button"
            >
                ⋮ More
            </button>


            <div
                class="more-menu"
                id="moreMenu"
            >


                <!-- SAVE -->

                <button
                    id="saveBtn"
                    type="button"
                >
                    💾 Save
                </button>


                <!-- SELECT -->

                <button
                    id="selectChatsBtn"
                    type="button"
                >
                    ☑ Select Chats
                </button>


                <!-- DELETE SELECTED -->

                <button
                    id="deleteSelectedBtn"
                    type="button"
                    class="danger-button"
                    style="display:none;"
                >
                    🗑 Delete Selected
                </button>


                <!-- CLEAR HISTORY -->

                <button
                    id="clearHistoryBtn"
                    type="button"
                    class="danger-button"
                >
                    🗑 Clear History
                </button>


                <div class="menu-divider"></div>


                <!-- LANGUAGE -->

                <div class="language-title">
                    🌐 Select Language
                </div>


                <button
                    type="button"
                    data-language="en"
                >
                    🇬🇧 English
                </button>


                <button
                    type="button"
                    data-language="ta"
                >
                    🇮🇳 தமிழ்
                </button>


                <button
                    type="button"
                    data-language="hi"
                >
                    🇮🇳 हिन्दी
                </button>


                <button
                    type="button"
                    data-language="ml"
                >
                    🇮🇳 മലയാളം
                </button>


                <button
                    type="button"
                    data-language="te"
                >
                    🇮🇳 తెలుగు
                </button>


                <button
                    type="button"
                    data-language="kn"
                >
                    🇮🇳 ಕನ್ನಡ
                </button>


                <div class="menu-divider"></div>


                <!-- VOICE SETTINGS -->

                <button
                    id="voiceSettingsButton"
                    type="button"
                >
                    🔊 Voice Settings
                </button>


                <div
                    id="voiceSettingsPanel"
                    class="voice-settings-panel"
                >

                    <div class="voice-setting-title">
                        Voice
                    </div>


                    <button
                        id="femaleVoiceBtn"
                        class="voice-choice"
                        type="button"
                    >
                        👩 Female
                    </button>


                    <button
                        id="maleVoiceBtn"
                        class="voice-choice"
                        type="button"
                    >
                        👨 Male
                    </button>


                    <div
                        id="voiceLanguageStatus"
                        class="voice-language-status"
                    ></div>

                </div>


            </div>

        </div>

    </aside>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="main">


        <!-- HEADER -->

        <header class="header">


            <!-- MOBILE MENU -->

            <button
                class="mobile-menu"
                id="mobileMenuBtn"
                type="button"
                aria-label="Open menu"
            >
                ☰
            </button>


            <!-- TITLE -->

            <div
                class="chat-title"
                id="chatTitle"
            >
                New Chat
            </div>


            <!-- SHARE -->

            <button
                class="share-btn"
                id="shareBtn"
                type="button"
            >
                ↗ Share
            </button>


        </header>


        <!-- =================================================
             MESSAGES
        ================================================== -->

        <section
            class="messages"
            id="messages"
        ></section>


        <!-- =================================================
             INPUT AREA
        ================================================== -->

        <footer class="input-area">


            <div class="input-box">


                <!-- =========================
                     PLUS BUTTON
                ========================== -->

                <button
                    class="input-icon"
                    id="plusBtn"
                    type="button"
                    title="Attach photo or image"
                    aria-label="Attach photo or image"
                >
                    ＋
                </button>


                <!-- =========================
                     HIDDEN IMAGE INPUT
                ========================== -->

                <input
                    type="file"
                    id="imageInput"
                    accept="image/*"
                    multiple
                    hidden
                >


                <!-- =========================
                     IMAGE PREVIEW
                ========================== -->

                <div
                    id="imagePreview"
                    class="image-preview"
                ></div>


                <!-- =========================
                     MESSAGE INPUT
                ========================== -->

                <input
                    type="text"
                    id="messageInput"
                    placeholder="Message Viggo..."
                    autocomplete="off"
                >


                <!-- =========================
                     VOICE
                ========================== -->

                <button
                    class="input-icon"
                    id="voiceBtn"
                    type="button"
                    title="Voice input"
                    aria-label="Voice input"
                >
                    🎤
                </button>


                <!-- =========================
                     SEND
                ========================== -->

                <button
                    class="send-btn"
                    id="sendBtn"
                    type="button"
                    title="Send"
                    aria-label="Send"
                >
                    ➤
                </button>


            </div>


            <!-- HINT -->

            <div class="input-hint">
                Viggo AI can make mistakes. Check important information.
            </div>


        </footer>


    </main>


    <!-- =====================================================
         TOAST
    ====================================================== -->

    <div
        id="viggoToast"
        class="toast"
    ></div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="./script.js"></script>


    <!-- =====================================================
         SERVICE WORKER
    ====================================================== -->

    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener(
                "load",
                function () {

                    navigator.serviceWorker
                        .register("./service-worker.js")
                        .then(function () {

                            console.log(
                                "Viggo Service Worker registered."
                            );

                        })
                        .catch(function (error) {

                            console.error(
                                "Service Worker error:",
                                error
                            );

                        });

                }
            );

        }

    </script>


</body>

</html>
